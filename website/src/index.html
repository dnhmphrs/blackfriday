<!doctype html>
<html lang="en" class="loading">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>30% Off EVERYTHING</title>
<meta name="description" content="A Black Friday treat for your browser. Every website, 30% off! Black Friday only!">
<meta name="theme-color" content="#0a1cc4">
<meta name="color-scheme" content="only light">
<link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
<meta property="og:type" content="website">
<meta property="og:site_name" content="30% Off EVERYTHING">
<meta property="og:title" content="30% Off EVERYTHING">
<meta property="og:description" content="A Black Friday treat for your browser. Every website, 30% off! Black Friday only!">
<meta property="og:url" content="%SITE%">
<meta property="og:image" content="%SITE%og.png">
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="30% OFF EVERYTHING ON THE INTERNET. BLACK FRIDAY ONLY!">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="30% Off EVERYTHING">
<meta name="twitter:description" content="A Black Friday treat for your browser. Every website, 30% off! Black Friday only!">
<meta name="twitter:image" content="%SITE%og.png">
<link rel="preload" href="fonts/archivo-black.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/arimo-bold-italic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="images/globe-still.webp" as="image">
<style>/*STYLE*/</style>
<noscript><style>.loading #p > * { visibility: visible !important; }</style></noscript>
</head>
<body>
<!-- The page is one screen, in the look of the extension's banner ("Globe Badge"). #p holds the picture
     (the WebGL background and the page itself) and carries the tape filter; .lines adds the scanlines and
     dark corners, as on the banner. Read in order: 1. the badge with 30% OFF, and the clock; 2. EVERYTHING
     ON THE INTERNET. and BLACK FRIDAY ONLY!; 3. the yellow tape, ADD TO CHROME; then the furniture. -->
<div id="tv">
  <div id="p">
    <canvas id="bg" aria-hidden="true"></canvas>

    <div class="ticker" aria-hidden="true"><div class="run"><span></span></div></div>

    <main class="stage">
      <p class="osd" aria-hidden="true"><b>●</b> ON AIR</p>

      <!-- the badge: everything in it is sized in em, 1em being the badge's radius (see .badge) -->
      <div class="badge-box">
        <div class="badge">
          <div class="glow" aria-hidden="true"></div>
          <svg class="burst red shadow" viewBox="-112 -112 224 224" aria-hidden="true"><polygon class="red-pts" fill="#0a0f66" opacity="0.92"/></svg>
          <svg class="burst red" viewBox="-112 -112 224 224" aria-hidden="true"><polygon class="red-pts" fill="#ff1616" stroke="#000" stroke-width="1.4" stroke-linejoin="round"/></svg>
          <svg class="burst yellow shadow" viewBox="-112 -112 224 224" aria-hidden="true"><polygon class="yellow-pts" fill="#0a0f66" opacity="0.7"/></svg>
          <svg class="burst yellow" viewBox="-112 -112 224 224" aria-hidden="true">
            <defs>
              <radialGradient id="gold" r="0.9"><stop offset="0.6" stop-color="#fffb86"/><stop offset="1" stop-color="#f6d80c"/></radialGradient>
              <path id="rim" d="M -73.5 0 A 73.5 73.5 0 1 1 73.5 0 A 73.5 73.5 0 1 1 -73.5 0"/>
            </defs>
            <polygon class="yellow-pts" fill="url(#gold)" stroke="#000" stroke-width="1.2" stroke-linejoin="round"/>
            <!-- three times round, stretched to close the circle exactly -->
            <text font-size="10.4" textLength="455" lengthAdjust="spacing"><textPath href="#rim">EVERY SITE 30% OFF! ✦ EVERY SITE 30% OFF! ✦ EVERY SITE 30% OFF! ✦</textPath></text>
          </svg>
          <svg class="burst plate" viewBox="-112 -112 224 224" aria-hidden="true">
            <radialGradient id="plate" cx="0.42" cy="0.36" r="0.75"><stop offset="0" stop-color="#3aa6ff"/><stop offset="0.45" stop-color="#1550ee"/><stop offset="1" stop-color="#071090"/></radialGradient>
            <circle r="68.5" fill="#000"/><circle r="67.2" fill="#fff"/><circle r="64.8" fill="url(#plate)"/>
          </svg>
          <img class="globe" src="images/globe-still.webp" alt="" width="340" height="340" decoding="async" draggable="false">
          <svg class="glint g1" viewBox="-1 -1 2 2" aria-hidden="true"><path d="M0,-1C.06,-.22 .22,-.06 1,0C.22,.06 .06,.22 0,1C-.06,.22 -.22,.06 -1,0C-.22,-.06 -.06,-.22 0,-1Z"/></svg>
          <svg class="glint g2" viewBox="-1 -1 2 2" aria-hidden="true"><path d="M0,-1C.06,-.22 .22,-.06 1,0C.22,.06 .06,.22 0,1C-.06,.22 -.22,.06 -1,0C-.22,-.06 -.06,-.22 0,-1Z"/></svg>
          <div class="sticker"><h1 class="head">30% OFF</h1></div>
          <p class="stamp"><span class="a">But wait…</span> <span class="b">THERE’S LESS!</span></p>
        </div>
      </div>

      <!-- the clock: the split-flap digits in their case, under the LIMITED TIME label -->
      <div class="clock-box">
        <div class="fit timer">
          <p class="label" aria-hidden="true"><span class="lt">LIMITED TIME</span><span class="to">TODAY ONLY</span> ✦ ACT NOW</p>
          <div class="clock" role="timer" aria-live="off" aria-label="Black Friday starts in">
            <div class="ch"><span class="lbl">STARTS IN</span></div>
            <div class="row"></div>
          </div>
        </div>
      </div>

      <div class="words-box">
        <div class="fit words">
          <h2 class="sub"><span>EVERYTHING ON</span> <span>THE INTERNET.</span></h2>
          <p class="tag">BLACK FRIDAY ONLY!</p>
        </div>
      </div>
    </main>

    <!-- the yellow tape is the one link: to the store -->
    <a class="order" href="https://chromewebstore.google.com/detail/henmcmipcaepmamandofeafnkijmeddn" target="_blank" rel="noopener" aria-label="ADD TO CHROME: 30% off the entire internet. No purchase necessary!">
      <span class="fit"><span class="np">No purchase necessary!</span><b class="sep" aria-hidden="true">✦</b><span class="go">ADD TO CHROME <i aria-hidden="true">→</i></span></span>
    </a>

    <footer class="by"><span class="fit">Brought to you by Gary Mustard Enterprises</span></footer>

    <div class="crawl" aria-hidden="true"><div class="run"><span></span></div></div>

    <div class="takeover" aria-hidden="true">
      <div class="slam"><div class="run"><span></span></div></div>
    </div>
    <p class="sr">30% off the entire internet.</p>
  </div>
  <div class="lines" aria-hidden="true"></div>
</div>
<!-- The tape look: the same filter as the extension's banner (extension/src/content.js), noise and all -->
<svg class="defs" aria-hidden="true" width="0" height="0">
  <filter id="tape" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB">
    <feFlood flood-color="#0a22d6"/>
    <feMerge result="picture"><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    <feGaussianBlur class="soft" in="picture"/>
    <feColorMatrix type="matrix" values="0.299 0.587 0.114 0 0 0.299 0.587 0.114 0 0 0.299 0.587 0.114 0 0 0 0 0 1 0" result="luma"/>
    <feGaussianBlur class="halo"/>
    <feComposite in="luma" operator="arithmetic" k2="1.42" k3="-0.42" result="sharp"/>
    <feGaussianBlur class="smear" in="picture"/>
    <feOffset class="late"/>
    <feColorMatrix type="matrix" values="0.393 -0.329 -0.064 0 0.5  -0.167 0.231 -0.064 0 0.5  -0.167 -0.329 0.496 0 0.5  0 0 0 1 0"/>
    <feComposite in2="sharp" operator="arithmetic" k2="2" k3="1" k4="-1" result="clean"/>
    <feTurbulence type="fractalNoise" baseFrequency="0.042 0.167" numOctaves="1" seed="3"><animate attributeName="seed" values="3;41;11;7;29;19;53;5;37;13" keyTimes="0.0000;0.1154;0.1923;0.3462;0.4231;0.5385;0.5769;0.6923;0.7692;0.9231" dur="2.2s" calcMode="discrete" repeatCount="indefinite"/></feTurbulence>
    <feColorMatrix type="matrix" values="0.21032 0.1242 0 0 0.33274  -0.05984 -0.1294 0 0 0.59462  -0.24332 0.3406 0 0 0.45136  0 0 0 0 1"/>
    <feComposite in2="clean" operator="arithmetic" k2="1" k3="1" k4="-0.5" result="mottled"/>
    <feTurbulence type="fractalNoise" baseFrequency="0.19 0.71" numOctaves="2" seed="2"><animate attributeName="seed" values="2;31;17;47;9;23;59;4;43;29;11;61;37;19" keyTimes="0.0000;0.0833;0.1250;0.2500;0.2917;0.3750;0.4583;0.5000;0.6250;0.6667;0.7500;0.7917;0.8750;0.9167" dur="1.6s" calcMode="discrete" repeatCount="indefinite"/></feTurbulence>
    <feColorMatrix type="matrix" values="0.7 0 0 0 -0.399  0.7 0 0 0 -0.399  0.7 0 0 0 -0.399   0 0 0 0 1"/>
    <feComposite in2="mottled" operator="arithmetic" k2="1" k3="1" result="taped"/>
    <feComponentTransfer><feFuncR type="linear" intercept="-0.55"/><feFuncG type="linear" intercept="-0.55"/><feFuncB type="linear" intercept="-0.55"/></feComponentTransfer>
    <feGaussianBlur class="bloom"/>
    <feComposite in2="taped" operator="arithmetic" k2="0.149" k3="0.93" k4="0.037"/>
  </filter>
</svg>
<!--SCRIPT-->
</body>
</html>
