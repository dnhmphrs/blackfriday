<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>30% OFF Overlay</title>
  <style>
    /* Styles for the overlay */
    .thirtyOffOverlay {
      position: fixed;
      width: 30%;
      height: 100%;
      top: 0;
      right: 0;
      background-color: blue;
      z-index: 10000;
      display: flex;
      flex-flow: column wrap;
      justify-content: space-between;
      color: red;
      font-family: "Arial Black", Arial, sans-serif;
      text-align: center;
      box-sizing: border-box;
      padding: 20px 10px;
      gap: 10px;
      border-left: 5px solid black;
      -webkit-text-stroke: 4px black;
    }

    /* Double text effect for 30% and OFF */
    .double-text {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      text-transform: uppercase;
    }

    .double-text::before {
      content: attr(data-text);
      position: absolute;
      left: 4px; /* Horizontal offset */
      top: 4px;  /* Vertical offset */
      color: black; /* Same as the background color for shadow effect */
      z-index: -1;
    }

    /* Specific styles for each line */
    .line1 {
      font-size: 12vw;
      letter-spacing: -3px;
      line-height: 0.8;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      /* make letters to fill whole width*/
      text-align: justify;
      text-justify: inter-word;
      -webkit-text-stroke: 4px black;

    }

    .line2 {
      font-size: 10vw;
      letter-spacing: -3px;
      line-height: 0.8;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .line3, .line4, .line5, .lineGlobe {
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      letter-spacing: 1px;
    }

    .line3, .line4 {
      font-size: 4vw;
      line-height: 1.0;
      -webkit-text-stroke: 4px black;
    }

    .lineGlobe {
      font-size: 2.0vw;
      line-height: 1.0;
      color: blue;
      -webkit-text-stroke: 2px black;
    }

    .line5 {
      font-size: 2.1vw;
      line-height: 1;
      -webkit-text-stroke: 3px black;
    }
    
  </style>
</head>
<body>
  
  <!-- Overlay Element -->
  <div class="thirtyOffOverlay">
    <!-- 30% with offset shadow effect -->
    <p class="lineGlobe">$🌐$🌐$🌐$🌐$🌐$🌐$</p>
    <p class="line1 double-text" data-text="30%">30%</p>

    <!-- OFF with offset shadow effect -->
    <p class="line2 double-text" data-text="&nbsp;OFF">&nbsp;OFF&nbsp;</p>

    <!-- Remaining lines without shadow -->
    <p class="line3 ">THE ENTIRE</p>
    <p class="line4">INTERNET</p>

    <p class="lineGlobe">$🌐$🌐$🌐$🌐$</p>
    <p class="line5">BLACK FRIDAY ONLY</p>
    <p class="lineGlobe">$🌐$🌐$🌐$🌐$🌐$🌐$</p>
  </div>

</body>
</html>
