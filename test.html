<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>30% OFF Overlay Test</title>
  <style>
    /* Styles for the side panel */

    /* Styles for the 30 OFF overlay */
    .thirtyOffOverlay {
      position: fixed;
      width: 30%;
      height: 100%;
      top: 0;
      right: 0; /* Centers the 30% div in the middle of the screen */
      background-color: red;
      z-index: 10000; /* Ensure it is on top of all content */
      display: flex;
      justify-content: center;
      align-items: center;
      writing-mode: vertical-rl; /* Rotates text to be top-to-bottom */
      border: ridge  15px red; /* Adds a double border around the div */
      box-sizing: border-box;
    }

    .thirtyOffOverlay::after {
      content: "30% OFF!";
      color: #fcfcfc;
      -webkit-text-stroke: 3px #f4f4f4;
      font-family: "Arial Black", monospace;
      font-size: 15.5dvh;
      letter-spacing: 5px;
      text-transform: uppercase;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  
  <!-- Overlay Element -->
  <div class="thirtyOffOverlay"></div>

</body>
</html>
