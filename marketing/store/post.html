<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>30% Off EVERYTHING: posts</title>
<!-- The banner's pieces composed as standalone pictures on a grid: one margin, two columns, one
     set of gaps. The message stacks down the left column, set flush left; the globe on its column
     stands in the right one; the tapes and the crawl close the bottom.
       ?f=square|story                        the posts: 1080 x 1080, and 1080 x 1920 for stories, which
                                              is the banner's own arrangement, top to bottom
       ?f=shot|marquee|tile                   the store's images
       ?bg=slant|step|wall|mono|none          the faint tiled ground of Gary Mustard Enterprises marks (default: slant)
     store/posts.mjs renders it, stepping window.setT(t) through a 12 s loop. -->
<style>
  @font-face { font-family: "TOE Antonio"; font-weight: 300; src: url(../../src/fonts/antonio-light.woff2) format("woff2"); }
  @font-face { font-family: "TOE Antonio"; font-weight: 600; src: url(../../src/fonts/antonio-semibold.woff2) format("woff2"); }
  @font-face { font-family: "TOE Black"; src: url(../../src/fonts/archivo-black.woff2) format("woff2"); }
  @font-face { font-family: "TOE Arimo"; font-style: italic; font-weight: 700; src: url(../../src/fonts/arimo-bold-italic.woff2) format("woff2"); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #070f9c; }
  #p { position: relative; overflow: hidden; background: linear-gradient(#0a1cc4, #0a22d6 45%, #070f9c); --yellow: #fff035; --shade: #0a0f66; --red: #ff1616; }
  #p > * { position: absolute; display: block; max-width: none; }
  .glow { border-radius: 50%; background: radial-gradient(closest-side, #58c4ff 0%, #2a8cff 22%, #1348ee 44%, transparent 72%); }

  /* the faint ground of marks */
  .tiles { inset: -30%; opacity: 0.075; }
  .tiles img { position: absolute; display: block; }

  /* lettering, placed by baseline and ink edge (see set()) */
  .t { white-space: nowrap; line-height: 1; }
  .head { font-family: "TOE Black", "Arial Black", sans-serif; color: var(--yellow); letter-spacing: -0.05em;
          text-shadow: 0.009em 0.009em 0 var(--shade), 0.018em 0.018em 0 var(--shade), 0.027em 0.027em 0 var(--shade),
                       0.036em 0.036em 0 var(--shade), 0.045em 0.045em 0 var(--shade), 0.054em 0.054em 0 var(--shade); }
  .sub { font: italic 700 1em "TOE Arimo", Arial, sans-serif; letter-spacing: -0.04em;
         background: linear-gradient(#fff 35%, #c5d4fb 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
         filter: drop-shadow(0.045em 0.045em 0 rgba(6, 8, 70, 0.95)); padding: 0 0.1em 0.06em 0; }

  .glint svg { display: block; width: 100%; height: 100%; overflow: visible; fill: #fff; }
  .glint path { filter: drop-shadow(0 0 0.08px #fff) drop-shadow(0 0 0.22px #9fd4ff); transform-box: fill-box; transform-origin: center; animation: twinkle 2.4s ease-in-out infinite; }
  .glint.b path { animation-delay: -1.2s; }

  .ticker, .crawl { left: 0; right: 0; overflow: hidden; white-space: nowrap; }
  .ticker { top: 0; font-family: "TOE Antonio", "Arial Narrow", sans-serif; font-weight: 300; letter-spacing: 0.035em; word-spacing: 0.3em;
            color: #e9f0ff; text-shadow: 0.06em 0.06em 0 rgba(4, 8, 80, 0.85); }
  .ticker span { display: inline-block; animation: slide 24s linear infinite; }  /* one pass of the lines per 12 s loop */
  .crawl { bottom: 0; font-family: "TOE Black", "Arial Black", sans-serif; color: var(--yellow); letter-spacing: -0.02em; word-spacing: 0.08em; }
  .crawl span { display: inline-block; animation: crawl 36s linear infinite;      /* two passes per loop */
                text-shadow: 0.027em 0.027em 0 var(--shade), 0.054em 0.054em 0 var(--shade), 0.08em 0.08em 0 var(--shade); }
  .strip { display: flex !important; align-items: center; justify-content: center; white-space: nowrap; font: italic 700 1em "TOE Arimo", Arial, sans-serif; }
  .tape { background: linear-gradient(#fffb86, #f0e11c); color: #111; }
  .by { background: var(--shade); color: #fff; letter-spacing: 0.08em; text-transform: uppercase; }

  .card { width: 400px; height: 306px; background: #f3f4f6; color: #0c0c0c; border: 5px solid #000; box-shadow: 8px 8px 0 rgba(4, 6, 60, 0.92);
          transform-origin: left top; font: italic 700 50px/1 "TOE Arimo", Arial, sans-serif; }
  .card .hd { background: var(--red); color: #fff46a; font: 600 41px/57px "TOE Antonio", "Arial Narrow", sans-serif; padding: 0 15px; border-bottom: 5px solid #000; white-space: nowrap; overflow: hidden; }
  .card .ln { padding: 13px 17px 0; }
  .card s { position: relative; text-decoration: none; color: #6b6f78; margin-left: 9px; }
  .card s::after { content: ""; position: absolute; left: -8%; right: -8%; top: 46%; height: 8px; background: var(--red); transform: rotate(-11deg); box-shadow: 0 0 0 2px #000; }
  .card .big { position: absolute; right: 9px; bottom: -54px; font: 400 165px/0.9 "TOE Black", "Arial Black", sans-serif; color: var(--red); letter-spacing: -0.05em;
               -webkit-text-stroke: 11px #000; paint-order: stroke fill; transform: skewX(-8deg); transform-origin: 70% 80%; animation: jolt 1.2s ease-in-out infinite; }
  @keyframes slide { to { transform: translateX(-50%); } }
  @keyframes crawl { from { transform: skewX(-9deg); } to { transform: translateX(-50%) skewX(-9deg); } }
  @keyframes twinkle { 0%, 100% { transform: scale(0.55) rotate(-10deg); opacity: 0.75; } 50% { transform: scale(1) rotate(12deg); opacity: 1; } }
  @keyframes jolt { 0%, 100% { transform: skewX(-8deg) scale(1) rotate(0deg); } 12% { transform: skewX(-8deg) scale(1.18) rotate(-5deg); }
                    26% { transform: skewX(-8deg) scale(0.96) rotate(3deg); } 40% { transform: skewX(-8deg) scale(1.08) rotate(-2deg); } 55% { transform: skewX(-8deg) scale(1) rotate(0deg); } }
</style>
</head>
<body>
<div id="p"></div>
<script type="module">
  const PARTS = '../out/channel-page/parts/', IMAGES = '../../src/images/', MARKS = '../assets/gme/';
  const TICKER = 'But wait… there’s less! ✦ No purchase necessary! ✦ Black Friday only! ✦ Every website, 30% off! ✦ Works like magic! ✦ ';
  const CRAWL = 'BLACK FRIDAY ONLY! ✦ ';
  const BRAND = 'Brought to you by Gary Mustard Enterprises';
  const GLINT = 'M0,-1 C0.06,-0.22 0.22,-0.06 1,0 C0.22,0.06 0.06,0.22 0,1 C-0.06,0.22 -0.22,0.06 -1,0 C-0.22,-0.06 -0.06,-0.22 0,-1Z';
  const TAN6 = Math.tan((6 * Math.PI) / 180), COS6 = Math.cos((6 * Math.PI) / 180), TAN9 = Math.tan((9 * Math.PI) / 180);

  // ---- the formats: one margin (m), a left column for the message (col), and one set of gaps ----
  // head: the headline's lines, the widest fitted to the column; headTop: its cap line; lead: the
  // space between its lines (x cap height); toSub, toCard: the gaps down the stack; sub: the lines
  // under it; subLead: between them (x cap height); card: its scale (0: none); ball: the globe's
  // diameter, centred in what is left right of the gutter; strips: the tapes' scale (0: none);
  // tick 0: no ticker.
  //   split: the sub lines and the card in a second column beside the headline, on the same cap line
  //   stack: the live banner's own arrangement for a tall frame: the lettering centred, at u times
  //     its size (its top at headTop), glints either side of 30% OFF; under it the card and the globe
  //     in a row, at `row` times their size (card: left, how far below the ball's top; globe: centre
  //     x); the tapes and the crawl below
  const TWO = ['30%', 'OFF'];
  const F = {
    square:   { w: 1080, h: 1080, m: 60, tick: 54, crawl: 96, col: 436, gutter: 44, head: TWO, headTop: 100, lead: 0.3, toSub: 42, sub: ['EVERYTHING ON', 'THE INTERNET.'], subLead: 0.4, toCard: 40, card: 0.62, ball: 372, strips: 0.62 },
    // stories: the ticker and the crawl on the frame's edges; the message starts below where the apps put their own header
    story:    { w: 1080, h: 1920, m: 60, stack: true, u: 0.86, row: 1.1, tick: 72, crawl: 129, headTop: 124, toSub: 34, toRow: 40, card: [60, 103], globe: 790 },
    shot:     { w: 1280, h: 800, m: 56, tick: 44, crawl: 76, col: 700, gutter: 48, head: ['30% OFF'], headTop: 96, lead: 0.3, toSub: 34, sub: ['EVERYTHING ON THE INTERNET.'], subLead: 0.4, toCard: 34, card: 0.7, ball: 300, strips: 0.5 },
    marquee:  { w: 1400, h: 560, m: 56, tick: 40, crawl: 70, col: 552, gutter: 56, head: TWO, headTop: 80, lead: 0.3, split: { col: 264, gutter: 56 }, sub: ['EVERYTHING', 'ON THE', 'INTERNET.'], subLead: 0.38, toCard: 30, card: 0.66, ball: 260, strips: 0 },
    tile:     { w: 880, h: 560, m: 56, tick: 40, crawl: 76, col: 380, gutter: 44, head: TWO, headTop: 78, lead: 0.3, toSub: 28, sub: ['EVERYTHING ON', 'THE INTERNET.'], subLead: 0.4, card: 0, ball: 262, strips: 0 },
  };
  const q = new URLSearchParams(location.search);
  const f = { ...(F[q.get('f')] || F.square) };
  for (const [key, v] of q) if (key in f && typeof f[key] === 'number') f[key] = Number(v); // try a value from the address
  const p = document.getElementById('p');
  Object.assign(p.style, { width: f.w + 'px', height: f.h + 'px' });
  await Promise.all(['100px "TOE Black"', 'italic 700 100px "TOE Arimo"', '300 50px "TOE Antonio"', '600 50px "TOE Antonio"'].map((s) => document.fonts.load(s)));

  const add = (html) => { p.insertAdjacentHTML('beforeend', html); return p.lastElementChild; };
  const place = (el, x, y, w, h) => Object.assign(el.style, { left: x + 'px', top: y + 'px', width: w + 'px', height: h + 'px' });

  // Lettering is measured, not guessed: the ink's edges and the cap height of a string, per 1px of type.
  const mc = document.createElement('canvas').getContext('2d');
  function ink(text, font, ls) {
    mc.font = font.replace('SIZE', '200px'); mc.letterSpacing = ls * 200 + 'px';
    const m = mc.measureText(text), k = 1 / 200;
    return { l: -m.actualBoundingBoxLeft * k, r: m.actualBoundingBoxRight * k - ls, cap: mc.measureText('H').actualBoundingBoxAscent * k,
             asc: m.fontBoundingBoxAscent * k, desc: m.fontBoundingBoxDescent * k };
  }
  // Set a line of type with its ink's left edge at x and its baseline at y. skew: the headline's slant.
  function set(cls, text, font, ls, size, x, y, skew) {
    const i = ink(text, font, ls), el = add(`<div class="t ${cls}">${text}</div>`);
    const base = (1 - (i.asc + i.desc)) / 2 + i.asc; // where the baseline sits in a line-height: 1 box
    Object.assign(el.style, { fontSize: size + 'px', left: x - i.l * size + 'px', top: y - base * size + 'px' });
    if (skew) Object.assign(el.style, { transformOrigin: `0 ${base * size}px`, transform: 'skewX(-9deg)' });
    return el;
  }
  const HEAD = 'SIZE "TOE Black"', SUB = 'italic 700 SIZE "TOE Arimo"';
  const width = (text, font, ls) => { const i = ink(text, font, ls); return i.r - i.l; };
  const fitHead = (text, w) => w / (width(text, HEAD, -0.05) + ink(text, HEAD, -0.05).cap * TAN9);
  const fitSub = (text, w) => w / width(text, SUB, -0.04);

  // ---- the grid ----
  const L = f.m, R = f.w - f.m, L2 = L + f.col + (f.split ? f.split.gutter : 0), colR = f.split ? L2 + f.split.col : L + f.col, monL = colR + f.gutter, monX = (monL + R) / 2;
  const crawlTop = f.h - f.crawl;
  // the tapes: the navy one's lower left corner meets the crawl; the yellow one lies on it
  if (f.stack) f.strips = f.u;
  const tapeH = 126 * f.strips, byH = 68 * f.strips;
  const byC = crawlTop - (f.w / 2) * TAN6 - (byH / 2) / COS6, tapeC = byC - ((tapeH + byH) / 2 + 4 * f.strips) / COS6;
  const tapeTop = (x) => tapeC - (tapeH / 2) / COS6 - (x - f.w / 2) * TAN6;

  // ---- the ground ----
  const bg = q.get('bg') || 'slant';
  if (bg !== 'none') {
    const A = (n) => MARKS + n + '.png';
    const kinds = {
      step: { marks: [['gme-primary', 190]], cell: [260, 112], angle: 0, opacity: 0.06 },    // one lockup, stepped and repeated
      slant: { marks: [['gme-primary', 190]], cell: [260, 112], angle: -6, opacity: 0.095 },  // the same, on the tapes' slant
      wall: { marks: [['gme-primary', 170], ['family-gme-box', 104], ['family-gm-serif', 128], ['family-gme-star', 136], ['family-gm-plate', 100], ['family-orbit', 150],
                      ['family-gm-hex', 96], ['family-gme-heavy', 124], ['family-swoosh', 150], ['family-globe-box', 150]], cell: [236, 124], angle: -6, opacity: 0.065 }, // the whole family
      mono: { marks: [['wire-globe', 46], ['family-gme-outline', 84]], cell: [128, 84], angle: 0, opacity: 0.055 },   // a monogram ground
    };
    const kind = kinds[bg] || kinds.slant, t = add('<div class="tiles"></div>');
    Object.assign(t.style, { transform: `rotate(${kind.angle}deg)`, opacity: Number(q.get('tint')) || kind.opacity }); // ?tint= tries another strength
    const [cw, ch] = kind.cell, W = f.w * 1.6, H = f.h * 1.6;
    const ratio = await Promise.all(kind.marks.map(([n]) => new Promise((res) => { const i = new Image(); i.onload = () => res(i.naturalHeight / i.naturalWidth); i.src = A(n); })));
    for (let row = 0, y = 0; y < H; row++, y += ch) for (let x = row % 2 ? -cw / 2 : 0, c = 0; x < W; x += cw, c++) {
      const j = (row * 3 + c) % kind.marks.length, [name, w] = kind.marks[j], h = w * ratio[j];
      t.insertAdjacentHTML('beforeend', `<img src="${A(name)}" style="left:${x + (cw - w) / 2}px; top:${y + (ch - h) / 2}px; width:${w}px; height:${h}px">`);
    }
  }

  // ---- the monument: the globe in the middle of the right-hand column, its top level with the
  //      headline's cap line, its column running down behind the tapes to the bottom edge ----
  // (stacked: the lettering is the banner's two pictures, 706 x 522 and 895 x 349, one under the other, centred)
  const T1 = { w: 706 * f.u, h: 522 * f.u }, T2 = { w: 895 * f.u, h: 349 * f.u };
  const t1y = f.headTop, t2y = t1y + T1.h + f.toSub, rowY = t2y + T2.h + f.toRow; // rowY: the top of the ball
  const gd = f.stack ? 480 * f.row : f.ball / (374 / 480), k = gd / 480;     // the ball is 374 of the picture's 480
  const gx = (f.stack ? f.globe : monX) - gd / 2, gy = f.stack ? rowY - 47 * k : f.headTop - 6 - 47 * k; // a round thing overshoots the cap line a little
  place(add('<div class="glow"></div>'), gx + gd / 2 - gd * 1.3, gy + gd * 0.487 - gd * 1.45, gd * 2.6, gd * 2.9);
  const colX = gx + 40 * k, colW = 400 * k, capTop = gy + 410 * k, baseTop = Math.max(capTop + 136 * k + 4, f.h - 144 * k);
  place(add(`<img src="${IMAGES}shaft.webp">`), colX, capTop + 136 * k - 2, colW, baseTop - capTop - 136 * k + 4);
  place(add(`<img src="${IMAGES}cap.webp">`), colX, capTop, colW, 136 * k);
  place(add(`<img src="${IMAGES}base.webp">`), colX, baseTop, colW, 144 * k);
  const globe = add(`<img src="${PARTS}globe-00.png">`);
  place(globe, gx, gy, gd, gd);

  // ---- the message: stacked and centred as in the banner, or flush left down the column (or two
  //      columns, in the wide formats) ----
  const putCard = (x, top, scale) => {
    const card = add('<div class="card"><div class="hd">The Internet (All Of It)</div><div class="ln">WAS: <s>100%</s></div><div class="ln">NOW:</div><div class="big">70%</div></div>');
    Object.assign(card.style, { left: x + 'px', top: top + 'px', transform: `scale(${scale}) rotate(-1.4deg)` });
    return top + (306 + 54) * scale;
  };
  const glint = (cls, cx, cy, r) => place(add(`<div class="glint ${cls}"><svg viewBox="-1 -1 2 2"><path d="${GLINT}"/></svg></div>`), cx - r, cy - r, r * 2, r * 2);
  const ballL = gx + 53 * k, ballT = gy + 47 * k, bd = 374 * k;
  let hs = 0, ss = 0, y = 0, cardBottom = 0, sx = L;
  if (f.stack) {
    const t1x = (f.w - T1.w) / 2, u = f.u;
    place(add(`<img src="${IMAGES}type-top.webp">`), t1x, t1y, T1.w, T1.h);
    place(add(`<img src="${IMAGES}type-mid.webp">`), (f.w - T2.w) / 2, t2y, T2.w, T2.h);
    // the glints either side of 30% OFF: a large one out wide, a small one nearer in and lower
    for (const side of [-1, 1]) {
      const edge = side < 0 ? t1x : t1x + T1.w, out = (d) => edge + side * d * u;
      glint('', out(149), t1y + 204 * u, 49 * u);
      glint('b', out(92), t1y + 295 * u, 29 * u);
    }
    y = t2y + T2.h;
    cardBottom = putCard(f.card[0], rowY + f.card[1], f.row);
    sx = f.card[0];
  } else {
  const hw = (t) => width(t, HEAD, -0.05) + ink(t, HEAD, -0.05).cap * TAN9;
  const widest = (lines, w) => lines.reduce((a, b) => (w(a) > w(b) ? a : b));
  hs = fitHead(widest(f.head, hw), f.col); const hc = ink('H', HEAD, -0.05).cap * hs;
  y = f.headTop;
  for (const [n, line] of f.head.entries()) { y += hc + (n ? hc * f.lead : 0); set('head', line, HEAD, -0.05, hs, L, y, true); }
  sx = f.split ? L2 : L;
  ss = fitSub(widest(f.sub, (t) => width(t, SUB, -0.04)), f.split ? f.split.col : f.col); const sc = ink('H', SUB, -0.04).cap * ss;
  y = f.split ? f.headTop : y + f.toSub;
  for (const [n, line] of f.sub.entries()) { y += sc + (n ? sc * f.subLead : 0); set('sub', line, SUB, -0.04, ss, sx, y); }
  cardBottom = f.card ? putCard(sx, y + f.toCard, f.card) : y;
  // glints: one on the globe's shoulder, one at its foot
  glint('', ballL + bd * 0.1, ballT + bd * 0.1, bd * 0.105);
  glint('b', ballL + bd * 0.97, ballT + bd * 0.86, bd * 0.06);
  }

  // ---- the tapes ----
  const len = Math.hypot(f.w, f.h) * 1.4;
  for (const [cls, text, c, h, cap] of f.strips ? [['by', BRAND, byC, byH, 25 * f.strips], ['tape', 'EVERY SITE 30% OFF!', tapeC, tapeH, 54 * f.strips]] : []) {
    const el = add(`<div class="strip ${cls}"><span>${text}</span></div>`);
    place(el, f.w / 2 - len / 2, c - h / 2, len, h);
    Object.assign(el.style, { fontSize: cap / 0.72 + 'px', transform: 'rotate(-6deg)' });
    if (cls === 'tape') el.style.boxShadow = `inset 0 ${4 * f.strips}px 0 rgba(170,158,0,0.6), inset 0 ${-4 * f.strips}px 0 rgba(170,158,0,0.6), ${11 * f.strips}px ${11 * f.strips}px 0 rgba(6,8,70,0.9)`;
  }

  // ---- the tickers: both caught part way through, running off either edge ----
  if (f.tick) {
    const tk = add(`<div class="ticker"><span>${TICKER.repeat(4)}</span></div>`);
    Object.assign(tk.style, { height: f.tick + 'px', fontSize: f.tick * 0.66 + 'px', lineHeight: f.tick + 'px' });
    tk.firstElementChild.style.animationDelay = `${-(Number(q.get('tickAt')) || 4.4)}s`; // the still catches it part way through
  }
  const cr = add(`<div class="crawl"><span>${CRAWL.repeat(12)}</span></div>`);
  Object.assign(cr.style, { height: f.crawl + 'px', fontSize: f.crawl * 0.75 + 'px', lineHeight: f.crawl + 'px' });
  cr.firstElementChild.style.animationDelay = `${-(Number(q.get('crawlAt')) || 2.3)}s`;

  // what the grid came to, for checking
  window.report = { headSize: hs, subSize: ss, textBottom: y, cardBottom, tapeTopAtCard: tapeTop(sx + 200 * (f.stack ? f.row : f.card)), tapeTopAtColumn: tapeTop(gx + gd / 2), crawlTop, capTop, ball: [ballL, ballT, bd] };

  // Time: every animation is paused and set to t; the globe steps through its 60 frames (one turn in 4 s).
  const frames = Array.from({ length: 60 }, (_, i) => `${PARTS}globe-${String(i).padStart(2, '0')}.png`);
  await Promise.all([...frames.map((src) => { const i = new Image(); i.src = src; return i.decode(); }), ...[...p.querySelectorAll('img')].map((i) => i.decode().catch(() => {}))]);
  window.setT = async (t) => {
    for (const a of document.getAnimations()) { a.pause(); a.currentTime = t * 1000; }
    globe.src = frames[Math.floor(t * 15 + 1e-6) % 60];
    await globe.decode();
  };
  window.ready = true;
</script>
</body>
</html>
