<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>30% Off EVERYTHING</title>
<link rel="icon" href="{{img:favicon}}">
<!-- Variant "countdown-banner": "Limited Time Spot" (v-countdown) redrawn as the extension's sale banner
     itself. It is a picture, not a page: no links, no buttons, no credits. The banner only ever shows
     on Black Friday, so the clock counts what is left of the day: to local midnight at its end, in
     hours, minutes and seconds (before the day, should the date say so, it counts to the start).
     It lays itself out for the banner's two shapes:
       a tall column (about 0.42-0.6 wide:tall; the side banner on a desktop window), and
       a short wide strip (the banner across the top of a phone or narrow window).
     Read in order:
       1. BLACK FRIDAY ONLY! on the red marquee, the running clock hanging from it
       2. 30% OFF EVERYTHING ON THE INTERNET.
       3. the turning globe (with the As Seen On badge and the price card in a roomy column) where there is room
     then the furniture: the ticker along the top, the crawl along the bottom; in the column the
     slanted yellow tape EVERY SITE 30% OFF! with the navy tape under it, as on the live banner.
     ?edge=left|bottom&clear=N keeps N px of the face clear along the coupon edge (the harness that
     shows it in place passes them); ?keep keeps the tape look on however slow the machine.
     Everything that moves runs off one clock at 25 frames a second; nothing is animated in CSS. -->
<style>
{{fonts}}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; background: #070f9c; }
body { -webkit-font-smoothing: antialiased; }
#p { position: fixed; inset: 0; overflow: hidden; background: linear-gradient(#0a1cc4, #0a22d6 45%, #070f9c); filter: url(#tape);
     --yellow: #fff035; --shade: #0a0f66; --red: #ff1616; user-select: none; pointer-events: none; }
#p > * { position: absolute; display: block; max-width: none; }
.defs { position: absolute; width: 0; height: 0; }
.lines { position: fixed; inset: 0; pointer-events: none; z-index: 2;
         background: repeating-linear-gradient(rgba(0, 0, 16, 0) 0, rgba(0, 0, 16, 0.05) 1.5px, rgba(0, 0, 16, 0) 3px),
                     radial-gradient(farthest-corner at 50% 50%, rgba(0, 0, 0, 0) 0%, rgba(0, 0, 0, 0.03) 50%, rgba(0, 0, 0, 0.08) 71%, rgba(0, 0, 0, 0.13) 85%, rgba(0, 0, 0, 0.21) 100%); }

.glow { border-radius: 50%; background: radial-gradient(closest-side, #58c4ff 0%, #2a8cff 22%, #1348ee 44%, transparent 72%); }
.tiles { background-repeat: repeat; opacity: 0.08; transform: rotate(-6deg); }

.t { white-space: nowrap; line-height: 1; }
.head { font-family: "Archivo Black", "Arial Black", sans-serif; color: var(--yellow); letter-spacing: -0.05em;
        text-shadow: 0.009em 0.009em 0 var(--shade), 0.018em 0.018em 0 var(--shade), 0.027em 0.027em 0 var(--shade),
                     0.036em 0.036em 0 var(--shade), 0.045em 0.045em 0 var(--shade), 0.054em 0.054em 0 var(--shade); }
/* the marquee's lettering: the same yellow, its stacked shadow in oxblood on the red */
.head.bf { --shade: #4a0004; }
.sub { font: italic 700 1em "Arimo", Arial, sans-serif; letter-spacing: -0.04em;
       background: linear-gradient(#fff 35%, #c5d4fb 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
       filter: drop-shadow(0.045em 0.045em 0 rgba(6, 8, 70, 0.95)); padding: 0 0.1em 0.06em 0; }

.glint svg { display: block; width: 100%; height: 100%; overflow: visible; fill: #fff; }
.glint path { filter: drop-shadow(0 0 0.08px #fff) drop-shadow(0 0 0.22px #9fd4ff); transform-box: fill-box; transform-origin: center; }

/* 1. the marquee: red, with a row of chasing bulbs along each edge */
.band { background: linear-gradient(#ff3b2e, #ec0d0d 55%, #b30007); box-shadow: 0 0 0 0.25em #000, 0 1.1em 0 rgba(6, 8, 70, 0.85); }
.bulbs { background-repeat: repeat-x; }

/* 1. the clock: split-flap digits in a black case hanging from the marquee; what is left of the day */
.clock { display: flex !important; flex-direction: column; align-items: stretch; background: linear-gradient(#1b1b26, #07070c); color: var(--yellow);
         border: 0.07em solid var(--yellow); box-shadow: 0 0 0 0.05em #000, 0.16em 0.16em 0 rgba(6, 8, 70, 0.9); white-space: nowrap; }
.clock .ch { display: flex; align-items: center; justify-content: center; gap: 0.5em; background: var(--yellow); color: #0b0b12;
             font: 600 var(--hr, 0.34em)/1 "Antonio", "Arial Narrow", sans-serif; letter-spacing: 0.16em; padding: 0.22em 0.6em 0.24em; text-transform: uppercase; }
.clock .ch .dot { width: 0.62em; height: 0.62em; border-radius: 50%; background: var(--red); box-shadow: 0 0 0 0.12em #0b0b12; }
.clock .ch .dot.off { background: #5a1010; }
.clock .row { display: flex; align-items: flex-start; justify-content: center; padding: 0.14em 0.2em 0.12em; }
.clock.nolab .row { padding-bottom: 0.14em; }
.clock .u { display: flex; flex-direction: column; align-items: center; }
.clock .dd { display: flex; gap: 0.05em; }
.clock em { display: grid; place-items: center; width: 0.8em; height: 1.08em; font: normal 400 1em/1 "Archivo Black", "Arial Black", sans-serif;
            background: linear-gradient(#2e2e3b 0 49%, #000 49% 52%, #1d1d27 52%); border-radius: 0.07em; color: var(--yellow);
            box-shadow: inset 0 0 0 0.02em rgba(255, 255, 255, 0.08); }
.clock .u.s em { color: #ff4a3a; }
.clock .u i { font: 600 0.2em/1 "Antonio", "Arial Narrow", sans-serif; letter-spacing: 0.2em; color: #fff; margin-top: 0.3em; font-style: normal; }
.clock.nolab .u i { display: none; }
.clock .colon { font: 400 0.7em/1.45 "Archivo Black", "Arial Black", sans-serif; color: var(--yellow); padding: 0 0.06em; }

/* the ACT NOW! starburst */
.burst { display: grid !important; place-items: center; }
.burst svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.burst span { position: relative; font: 400 1em/0.9 "Archivo Black", "Arial Black", sans-serif; color: var(--red); text-align: center; letter-spacing: -0.03em;
              text-shadow: 0.04em 0.04em 0 #4a0004; }

/* the bands: the ticker along the top, BLACK FRIDAY ONLY! crawling along the bottom (the live banner's) */
.ticker, .crawl { overflow: hidden; white-space: nowrap; }
.ticker { top: 0; font-family: "Antonio", "Arial Narrow", sans-serif; font-weight: 300; letter-spacing: 0.035em; word-spacing: 0.3em;
          color: #e9f0ff; text-shadow: 0.06em 0.06em 0 rgba(4, 8, 80, 0.85); background: rgba(4, 8, 90, 0.5); }
.ticker span { display: inline-block; }
.crawl { font-family: "Archivo Black", "Arial Black", sans-serif; color: var(--yellow); letter-spacing: -0.02em; word-spacing: 0.08em; background: rgba(4, 4, 20, 0.55); }
.crawl span { display: inline-block; text-shadow: 0.027em 0.027em 0 var(--shade), 0.054em 0.054em 0 var(--shade), 0.08em 0.08em 0 var(--shade); }

/* the tapes, at the live banner's slant: the yellow one, and the navy one under it (column only) */
.strip { display: flex !important; align-items: center; justify-content: center; white-space: nowrap; font: italic 700 1em "Arimo", Arial, sans-serif; }
.tape { background: linear-gradient(#fffb86, #f0e11c); color: #111; }
.by { background: var(--shade); color: #fff; letter-spacing: 0.08em; text-transform: uppercase; }

/* the price card; only its 70% moves */
.card { width: 400px; height: 306px; background: #f3f4f6; color: #0c0c0c; border: 5px solid #000; box-shadow: 8px 8px 0 rgba(4, 6, 60, 0.92);
        transform-origin: left top; font: italic 700 50px/1 "Arimo", Arial, sans-serif; }
.card .hd { background: var(--red); color: #fff46a; font: 600 41px/57px "Antonio", "Arial Narrow", sans-serif; padding: 0 15px; border-bottom: 5px solid #000; white-space: nowrap; overflow: hidden; }
.card .ln { padding: 13px 17px 0; }
.card s { position: relative; text-decoration: none; color: #6b6f78; margin-left: 9px; }
.card s::after { content: ""; position: absolute; left: -8%; right: -8%; top: 46%; height: 8px; background: var(--red); transform: rotate(-11deg); box-shadow: 0 0 0 2px #000; }
.card .big { position: absolute; right: 9px; bottom: -54px; font: 400 165px/0.9 "Archivo Black", "Arial Black", sans-serif; color: var(--red); letter-spacing: -0.05em;
             -webkit-text-stroke: 11px #000; paint-order: stroke fill; transform: skewX(-8deg); transform-origin: 70% 80%; }

.oval { width: 7.6em; height: 3.31em; border-radius: 50%; display: grid !important; place-items: center; text-align: center;
        font: italic 700 1em/0.98 "Tinos", "Times New Roman", serif; background: radial-gradient(ellipse at 40% 30%, #fffc9a, #efe01c 72%); color: #151515;
        transform: rotate(-7deg); box-shadow: 0.143em 0.167em 0 rgba(6, 8, 70, 0.9), inset 0 0 0 0.095em rgba(170, 158, 0, 0.5); }
</style>
</head>
<body>
<main id="p" role="img" aria-label="Black Friday only! 30% off everything on the internet."></main>
<div class="lines" aria-hidden="true"></div>
<script>
(async () => {
  const query = new URLSearchParams(location.search);
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const IMG = { globe: still ? '{{img:globe_still}}' : '{{img:globe_anim}}', tile: '{{img:tile}}' };
  const TICKER = 'But wait… there’s less! ✦ No purchase necessary! ✦ Black Friday only! ✦ Every website, 30% off! ✦ Works like magic! ✦ ';
  const CRAWL = 'BLACK FRIDAY ONLY! ✦ ';
  const BRAND = 'Brought to you by Gary Mustard Enterprises';
  const GLINT = 'M0,-1 C0.06,-0.22 0.22,-0.06 1,0 C0.22,0.06 0.06,0.22 0,1 C-0.06,0.22 -0.22,0.06 -1,0 C-0.22,-0.06 -0.06,-0.22 0,-1Z';
  const TAN9 = Math.tan((9 * Math.PI) / 180), SLANT = -6, TAN6 = Math.tan((6 * Math.PI) / 180);
  const FPS = 25;
  // the coupon edge: which side faces the page, and how many px along it to keep clear of the teeth
  const EDGE = query.get('edge') || '', CLEAR = EDGE ? Number(query.get('clear') || 17) : 0;

  // ---- the tape look: the live banner's filter, distances set in build(), the noise moved on by the clock ----
  const LUMA = '0.299 0.587 0.114 0 0';
  const tint = (i, q) => `${i * 0.22} ${q * 0.2} 0 0 ${0.5 - 0.5 * (i * 0.22 + q * 0.2)}`;
  const MOTTLE = `${tint(0.956, 0.621)}  ${tint(-0.272, -0.647)}  ${tint(-1.106, 1.703)}  0 0 0 0 1`;
  const GRAIN = `${'0.7 0 0 0 -0.399  '.repeat(3)} 0 0 0 0 1`;
  const add = (extra = '') => `operator="arithmetic" k2="1" k3="1" k4="-0.5" ${extra}`;
  document.body.insertAdjacentHTML('beforeend', `
    <svg class="defs" aria-hidden="true"><filter id="tape" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB">
      <feFlood flood-color="#0a22d6"/><feMerge result="picture"><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
      <feGaussianBlur class="soft" in="picture"/><feColorMatrix type="matrix" values="${LUMA} ${LUMA} ${LUMA} 0 0 0 1 0" result="luma"/>
      <feGaussianBlur class="halo"/><feComposite in="luma" operator="arithmetic" k2="1.42" k3="-0.42" result="sharp"/>
      <feGaussianBlur class="smear" in="picture"/><feOffset class="late"/>
      <feColorMatrix type="matrix" values="0.393 -0.329 -0.064 0 0.5  -0.167 0.231 -0.064 0 0.5  -0.167 -0.329 0.496 0 0.5  0 0 0 1 0"/>
      <feComposite in2="sharp" operator="arithmetic" k2="2" k3="1" k4="-1" result="clean"/>
      <feTurbulence class="blotch" type="fractalNoise" numOctaves="1" seed="3"/>
      <feColorMatrix type="matrix" values="${MOTTLE}"/><feComposite in2="clean" ${add('result="mottled"')}/>
      <feTurbulence class="static" type="fractalNoise" numOctaves="2" seed="2"/>
      <feColorMatrix type="matrix" values="${GRAIN}"/><feComposite in2="mottled" operator="arithmetic" k2="1" k3="1" result="taped"/>
      <feComponentTransfer><feFuncR type="linear" intercept="-0.55"/><feFuncG type="linear" intercept="-0.55"/><feFuncB type="linear" intercept="-0.55"/></feComponentTransfer>
      <feGaussianBlur class="bloom"/><feComposite in2="taped" operator="arithmetic" k2="0.149" k3="0.93" k4="0.037"/>
    </filter></svg>`);
  const $ = (sel) => document.querySelector(sel);
  const BLOTCH = [3, 11, 7, 19, 5, 13], STATIC = [2, 17, 9, 23, 4, 29];

  await Promise.all(['100px "Archivo Black"', 'italic 700 100px "Arimo"', '300 50px "Antonio"', '600 50px "Antonio"', 'italic 700 50px "Tinos"'].map((f) => document.fonts.load(f)));
  const p = document.getElementById('p');
  const put = (html) => { p.insertAdjacentHTML('beforeend', html); return p.lastElementChild; };
  const place = (el, x, y, w, h) => { Object.assign(el.style, { left: x + 'px', top: y + 'px', width: w + 'px', height: h + 'px' }); return el; };
  const at = (el, x, y) => { Object.assign(el.style, { left: x + 'px', top: y + 'px' }); return el; };

  // Lettering is measured, not guessed: the ink's edges and the cap height of a string, per 1px of type.
  const mc = document.createElement('canvas').getContext('2d');
  function ink(text, font, ls) {
    mc.font = font.replace('SIZE', '200px'); mc.letterSpacing = ls * 200 + 'px';
    const m = mc.measureText(text), k = 1 / 200;
    return { l: -m.actualBoundingBoxLeft * k, r: m.actualBoundingBoxRight * k - ls, cap: mc.measureText('H').actualBoundingBoxAscent * k,
             asc: m.fontBoundingBoxAscent * k, desc: m.fontBoundingBoxDescent * k };
  }
  // a line of type with its ink's left edge at x and its baseline at y
  function set(cls, text, font, ls, size, x, y, skew, tag = 'div') {
    const i = ink(text, font, ls), el = put(`<${tag} class="t ${cls}">${text}</${tag}>`);
    const base = (1 - (i.asc + i.desc)) / 2 + i.asc;
    Object.assign(el.style, { fontSize: size + 'px', left: x - i.l * size + 'px', top: y - base * size + 'px' });
    if (skew) Object.assign(el.style, { transformOrigin: `0 ${base * size}px`, transform: 'skewX(-9deg)' });
    return el;
  }
  const HEAD = 'SIZE "Archivo Black"', SUB = 'italic 700 SIZE "Arimo"';
  const width = (text, font, ls) => { const i = ink(text, font, ls); return i.r - i.l; };
  const headW = (t) => width(t, HEAD, -0.05) + ink(t, HEAD, -0.05).cap * TAN9;
  const subW = (t) => width(t, SUB, -0.04);
  const HCAP = ink('H', HEAD, -0.05).cap, SCAP = ink('H', SUB, -0.04).cap;
  // centred lettering: cx is the centre of the ink
  const setC = (cls, text, font, ls, size, cx, y, skew, tag) =>
    set(cls, text, font, ls, size, cx - ((font === HEAD ? headW(text) : subW(text)) * size) / 2, y, skew, tag);
  const across = (text, font, size, ls) => { mc.font = `${font} ${size}px "Arimo"`; mc.letterSpacing = ls * size + 'px'; return mc.measureText(text).width; };

  // ---- what moves, and how, at time t (seconds) ----
  let movers = [];
  const ease = (q) => q * q * (3 - 2 * q);
  const lerp = (a, b, q) => a + (b - a) * q;
  const twinkle = (path, delay) => movers.push((t) => {
    const ph = ((t + delay) / 2.4) % 1, q = ease(ph < 0.5 ? ph * 2 : 2 - ph * 2);
    path.style.transform = `scale(${lerp(0.55, 1, q)}) rotate(${lerp(-10, 12, q)}deg)`; path.style.opacity = lerp(0.75, 1, q);
  });
  const JOLT = [[0, 1, 0], [0.12, 1.18, -5], [0.26, 0.96, 3], [0.4, 1.08, -2], [0.55, 1, 0], [1, 1, 0]];
  const jolt = (el, period) => movers.push((t) => {
    const ph = (t / period) % 1, i = JOLT.findIndex(([w], n) => ph < JOLT[n + 1]?.[0]), [w0, s0, r0] = JOLT[i], [w1, s1, r1] = JOLT[i + 1];
    const q = ease((ph - w0) / (w1 - w0));
    el.style.transform = `skewX(-8deg) scale(${lerp(s0, s1, q)}) rotate(${lerp(r0, r1, q)}deg)`;
  });
  // on and off, by the clock: a class toggled every `period` seconds
  const blink = (el, cls, period, invert = false) => movers.push((t) => el.classList.toggle(cls, (Math.floor(t / period) % 2 === 0) !== invert));

  const glint = (cls, cx, cy, r) => {
    const el = place(put(`<div class="glint ${cls}" aria-hidden="true"><svg viewBox="-1 -1 2 2"><path d="${GLINT}"/></svg></div>`), cx - r, cy - r, r * 2, r * 2);
    twinkle(el.querySelector('path'), cls === 'b' ? 1.2 : 0);
    return el;
  };
  const oval = (size) => { const el = put('<div class="oval" aria-hidden="true"><span>As Seen On<br>Every Website</span></div>'); el.style.fontSize = size + 'px'; return el; };
  // the price card, 400 x 306 at scale 1 (its 70% hangs 54 below)
  const card = (x, top, scale, turn) => {
    const el = put('<div class="card" aria-hidden="true"><div class="hd">The Internet (All Of It)</div><div class="ln">WAS: <s>100%</s></div><div class="ln">NOW:</div><div class="big">70%</div></div>');
    Object.assign(el.style, { left: x + 'px', top: top + 'px', transform: `scale(${scale}) rotate(${turn}deg)` });
    jolt(el.querySelector('.big'), 1.1);
  };
  // the globe, its 60 frames drawn by the clock onto a canvas once decoded; a picture until then
  let globeFrames = null;
  const globe = (cx, cy, d) => {
    const k = d / 374, box = 480 * k, x = cx - 240 * k, y = cy - (47 + 187) * k;
    if (globeFrames) {
      const c = put('<canvas class="globe" aria-hidden="true"></canvas>'), dpr = Math.min(2, devicePixelRatio || 1);
      c.width = Math.round(box * dpr); c.height = Math.round(box * dpr); place(c, x, y, box, box);
      const g = c.getContext('2d'); let shown = -1;
      movers.push((t) => { const i = Math.floor(t * 15) % 60; if (i !== shown) { shown = i; g.clearRect(0, 0, c.width, c.height); g.drawImage(globeFrames[i], 0, 0, c.width, c.height); } });
    } else place(put(`<img class="globe" alt="" src="${IMG.globe}">`), x, y, box, box);
  };
  const glow = (cx, cy, d) => place(put('<div class="glow" aria-hidden="true"></div>'), cx - d * 1.3, cy - d * 1.45, d * 2.6, d * 2.9);

  // ---- the countdown. Black Friday is the day after the fourth Thursday of November; the banner shows
  //      on that day, so the clock counts what is left of it, to local midnight at its end. Before the
  //      day (should the date say so) it counts to the start ----
  const blackFriday = (y) => { const first = new Date(y, 10, 1).getDay(); return new Date(y, 10, 1 + ((4 - first + 7) % 7) + 21 + 1); };
  function countdown(now = new Date()) {
    let y = now.getFullYear(), start = blackFriday(y), end = new Date(y, 10, start.getDate() + 1);
    if (now >= end) { start = blackFriday(y + 1); end = new Date(y + 1, 10, start.getDate() + 1); }
    return now >= start ? { today: true, to: end } : { today: false, to: start };
  }
  // the clock's case, fitted into w x h (not yet placed; the caller puts it with at()); its digits filled in by the clock.
  // hr: the header's type, per the digits'
  function clock(w, h, head, hr) {
    const cd = countdown(), days = Math.floor((cd.to - Date.now()) / 864e5);
    const units = days >= 1 ? [['DAYS', Math.max(1, String(days).length)], ['HRS', 2], ['MIN', 2], ['SEC', 2]] : [['HRS', 2], ['MIN', 2], ['SEC', 2]];
    const html = units.map(([name, n], i) => `${i ? '<span class="colon">:</span>' : ''}<span class="u${name === 'SEC' ? ' s' : ''}"><span class="dd">${'<em>0</em>'.repeat(n)}</span><i>${name}</i></span>`).join('');
    const title = cd.today ? head : 'STARTS IN';
    const el = put(`<div class="clock" role="timer" aria-label="${title}"><div class="ch"><span class="dot"></span><span>${title}</span><span class="dot"></span></div><div class="row">${html}</div></div>`);
    el.style.setProperty('--hr', hr + 'em');
    el.style.fontSize = '100px';
    let k = Math.min(w / el.offsetWidth, h / el.offsetHeight);
    if (100 * k * 0.2 < 7) { el.classList.add('nolab'); k = Math.min(w / el.offsetWidth, h / el.offsetHeight); } // unit names too small to read: off
    el.style.fontSize = 100 * k + 'px';
    const ems = [...el.querySelectorAll('.u')].map((u) => [...u.querySelectorAll('em')]);
    for (const d of el.querySelectorAll('.ch .dot')) blink(d, 'off', 0.4);
    let shown = '', rebuilt = false;
    movers.push(() => {
      if (!cd.today && cd.to <= Date.now()) { if (!rebuilt) { rebuilt = true; requestAnimationFrame(build); } return; } // the day has come: count it out
      const ms = Math.max(0, cd.to - Date.now()); // at the day's end it stops at zero
      const sec = Math.floor(ms / 1000), hrs = Math.floor(sec / 3600);
      const vals = units.length === 4 ? [Math.floor(sec / 86400), hrs % 24, Math.floor(sec / 60) % 60, sec % 60] : [hrs, Math.floor(sec / 60) % 60, sec % 60];
      const str = vals.map((v, i) => String(v).padStart(units[i][1], '0')).join('|');
      if (str === shown) return;
      const parts = str.split('|'), old = shown.split('|'); shown = str;
      parts.forEach((v, i) => { if (v !== old[i]) [...v].forEach((c, j) => { if (ems[i][j] && ems[i][j].textContent !== c) ems[i][j].textContent = c; }); });
    });
    return { el, w: el.offsetWidth, h: el.offsetHeight, f: 100 * k };
  }
  // the ACT NOW! starburst, d across, centred at cx, cy
  function burst(cx, cy, d, turn) {
    const pts = []; const n = 18;
    for (let i = 0; i < n * 2; i++) { const a = (i / (n * 2)) * Math.PI * 2, r = i % 2 ? 0.8 : 1; pts.push(`${(Math.cos(a) * r).toFixed(3)},${(Math.sin(a) * r).toFixed(3)}`); }
    const el = put(`<div class="burst" aria-hidden="true"><svg viewBox="-1.1 -1.1 2.2 2.2"><polygon points="${pts.join(' ')}" transform="translate(0.06 0.07)" fill="rgba(6,8,70,0.9)"/><polygon points="${pts.join(' ')}" fill="#fff035" stroke="#000" stroke-width="0.05" stroke-linejoin="round"/><circle r="0.66" fill="none" stroke="#ff1616" stroke-width="0.035"/></svg><span>ACT<br>NOW!</span></div>`);
    place(el, cx - d / 2, cy - d / 2, d, d); el.style.fontSize = d * 0.2 + 'px';
    movers.push((t) => { const ph = (t / 0.8) % 1, q = ph < 0.2 ? ease(ph / 0.2) : ph < 0.4 ? 1 - ease((ph - 0.2) / 0.2) : 0; el.style.transform = `rotate(${turn}deg) scale(${1 + 0.08 * q})`; });
    return el;
  }
  // the marquee: red, across the box, bulbs along each edge of the face, its lines centred on cx
  function marquee(x0, x1, W, top, h, bulbH, cx, lines) {
    place(put('<div class="band" aria-hidden="true"></div>'), -20, top, W + 40, h).style.fontSize = bulbH + 'px';
    const B = bulbH * 1.5;
    for (const y of [top + bulbH * 0.35, top + h - bulbH * 1.35]) {
      const b = place(put('<div class="bulbs" aria-hidden="true"></div>'), x0, y, x1 - x0, bulbH);
      Object.assign(b.style, { backgroundSize: `${B * 2}px ${bulbH}px`,
        backgroundImage: `radial-gradient(circle at ${B * 0.5}px 50%, #fffbd0 0 ${bulbH * 0.16}px, #ffd400 ${bulbH * 0.3}px, rgba(255,212,0,0.5) ${bulbH * 0.38}px, rgba(255,212,0,0) ${bulbH * 0.5}px),` +
                         `radial-gradient(circle at ${B * 1.5}px 50%, #b54a00 0 ${bulbH * 0.26}px, rgba(90,10,0,0) ${bulbH * 0.34}px)` });
      movers.push((t) => { b.style.backgroundPosition = `${(Math.floor(t / 0.16) % 2) * B}px 0`; });
    }
    for (const [text, size, y, tag] of lines) setC('head bf', text, HEAD, -0.05, size, cx, y, true, tag);
  }
  // the bands: the ticker along the top of (x, w), the crawl with its foot at y1
  function bands(x, w, tick, crawlH, y1) {
    const tk = put(`<div class="ticker" aria-hidden="true"><span>${TICKER.repeat(6)}</span></div>`);
    Object.assign(tk.style, { left: x + 'px', width: w + 'px', height: tick + 'px', fontSize: tick * 0.66 + 'px', lineHeight: tick + 'px' });
    const cr = put(`<div class="crawl" aria-hidden="true"><span>${CRAWL.repeat(16)}</span></div>`);
    Object.assign(cr.style, { left: x + 'px', width: w + 'px', top: y1 - crawlH + 'px', height: crawlH + 'px', fontSize: crawlH * 0.75 + 'px', lineHeight: crawlH + 'px' });
    const tks = tk.firstElementChild, crs = cr.firstElementChild, tkRep = tks.offsetWidth / 6, crRep = crs.offsetWidth / 16;
    const tkV = tick * 1.5, crV = crawlH * 2.6;
    movers.push((t) => {
      tks.style.transform = `translateX(${-(((t + 3) * tkV) % tkRep)}px)`;
      crs.style.transform = `translateX(${-(((t + 3) * crV) % crRep)}px) skewX(-9deg)`;
    });
  }
  function look(s) {
    $('.soft').setAttribute('stdDeviation', `${1.25 * s} ${0.5 * s}`);
    $('.halo').setAttribute('stdDeviation', `${5 * s} ${0.6 * s}`);
    $('.smear').setAttribute('stdDeviation', `${10 * s} ${1.6 * s}`);
    $('.late').setAttribute('dx', 7 * s); $('.late').setAttribute('dy', 1.7 * s);
    $('.bloom').setAttribute('stdDeviation', 14 * s);
    // the noise at the live banner's grain: in px, not scaled with the art
    $('.blotch').setAttribute('baseFrequency', '0.042 0.167');
    $('.static').setAttribute('baseFrequency', '0.19 0.71');
  }
  // 2. the offer: 30% OFF over EVERYTHING ON / THE INTERNET., centred on cx, the cap line's top at y; returns nothing
  function offer(hs, ss, cx, y, g1, g2) {
    y += HCAP * hs; setC('head', '30% OFF', HEAD, -0.05, hs, cx, y, true, 'h1');
    y += g1 + SCAP * ss; setC('sub', 'EVERYTHING ON', SUB, -0.04, ss, cx, y, false, 'h2');
    y += g2 + SCAP * ss; setC('sub', 'THE INTERNET.', SUB, -0.04, ss, cx, y, false);
  }

  // ---- one layout pass, for the box as it is ----
  function build() {
    p.textContent = ''; movers = [];
    const W = p.clientWidth, H = p.clientHeight;
    if (!W || !H) return;
    // the face: all of the box but the strip kept clear along the coupon edge
    const X0 = EDGE === 'left' ? CLEAR : 0, X1 = EDGE === 'right' ? W - CLEAR : W;
    const Y0 = EDGE === 'top' ? CLEAR : 0, Y1 = EDGE === 'bottom' ? H - CLEAR : H;
    const FW = X1 - X0, FH = Y1 - Y0, cx = X0 + FW / 2;
    const tiles = put('<div class="tiles" aria-hidden="true"></div>');
    place(tiles, -W * 0.3, -H * 0.3, W * 1.6, H * 1.6);
    const ground = (u) => Object.assign(tiles.style, { backgroundImage: `url(${IMG.tile})`, backgroundSize: `${260 * u * 1.4}px ${224 * u * 1.4}px` });

    if (FW / FH < 1) {
      // ---- the column: the live banner's measures (1080 banner px across) ----
      const u = Math.min(FW / 1080, FH / 1900);
      look(u * 1.1); ground(u);
      const tick = 84 * u, crawlH = 150 * u, crawlTop = Y1 - crawlH;
      const tapeH = 126 * u, byH = 68 * u, tapeC = crawlTop - 232 * u, byC = crawlTop - 130 * u;
      const m = Math.max(10, 46 * u), cw = FW - 2 * m;
      const floor = (half) => tapeC - tapeH / 2 - half * TAN6 - 26 * u; // the lowest a thing half wide may come, over the tape
      // 1. the marquee, on two lines, as wide as the column
      const bTop = Y0 + tick, bulbH = 24 * u, pad = bulbH * 1.9 + 20 * u, lg = 26 * u;
      const b1 = cw / headW('BLACK FRIDAY'), b2 = Math.min((cw * 0.98) / headW('ONLY!'), b1 * 1.5);
      const bH = pad * 2 + HCAP * (b1 + b2) + lg;
      // 1. the clock, hanging from it
      const ck = clock(cw * 0.94, 300 * u, 'TIME LEFT TODAY', 0.36);
      const ckTop = bTop + bH - 14 * u;
      // 2. the offer, and 3. the globe in what is left between the clock and the tape
      const hs0 = (cw * 0.84) / headW('30% OFF'), ss0 = (cw * 0.96) / subW('EVERYTHING ON');
      const g1 = 30 * u, g2 = 16 * u, offerH = (k) => (HCAP * hs0 + SCAP * ss0 * 2 + g1 + g2) * k;
      const lo = ckTop + ck.h + 34 * u, hi = floor(cw * 0.47), gap = 30 * u;
      const space = (k) => hi - lo - offerH(k) - gap;
      const minD = cw * 0.52;
      let k = 1;
      while (space(k) < minD && k > 0.82) k -= 0.03;
      const withGlobe = space(k) >= minD * 0.8;
      if (!withGlobe) k = Math.min(1, (hi - lo) / offerH(1));
      let y;
      if (withGlobe) {
        const d = Math.min(space(k), cw * 1.04), spare = space(k) - d;
        const gcy = lo + spare * 0.35 + d / 2, r = d / 2;
        glow(cx, gcy, d * 1.15);
        globe(cx, gcy, d);
        if (d > 150) { // the globe's furniture, where it is large enough to carry it
          const o = oval(Math.max(12, d * 0.085));
          at(o, Math.max(X0 + 4, cx - r * 1.04 - o.offsetWidth * 0.2), gcy - r * 0.62);
          const cs = Math.min(0.62 * u * 1.6, (d * 0.4) / 400);
          card(Math.min(X1 - 420 * cs - 6, cx + r * 0.36), gcy + r * 0.12, cs, 3);
          glint('', cx - r * 0.72, gcy - r * 0.8, d * 0.07);
          glint('b', Math.min(X1 - d * 0.05, cx + r * 0.98), gcy - r * 0.32, d * 0.045);
        }
        y = gcy + r + gap + spare * 0.3;
      } else {
        y = lo + Math.max(0, hi - lo - offerH(k)) * 0.5;
        glow(cx, y + offerH(k) * 0.55, cw * 0.62); // no globe: its light still behind the offer
      }
      offer(hs0 * k, ss0 * k, cx, y, g1 * k, g2 * k);
      // the marquee over the globe's top; the clock and its burst over the marquee
      marquee(X0, X1, W, bTop, bH, bulbH, cx, [['BLACK FRIDAY', b1, bTop + pad + HCAP * b1, 'p'], ['ONLY!', b2, bTop + bH - pad, 'span']]);
      p.append(ck.el); at(ck.el, cx - ck.w / 2, ckTop);
      // ACT NOW! stuck on the marquee, in the room right of ONLY! (never over the lettering)
      const onlyR = cx + (headW('ONLY!') * b2) / 2 + 0.06 * b2, bd = Math.min(170 * u, X1 - 6 * u - onlyR - 10 * u);
      if (bd > 70 * u) burst(X1 - 6 * u - bd / 2, bTop + bH - pad - (HCAP * b2) / 2, bd, 14);

      // the yellow tape and the navy one under it, the live banner's slant and wording
      const length = Math.hypot(W, H) * 1.4;
      const by = put(`<div class="strip by" aria-hidden="true"><span>${BRAND}</span></div>`);
      let byFont = (25 / 0.72) * u;
      const byNeed = across(BRAND.toUpperCase(), 'italic 700', byFont, 0.08);
      if (byNeed > (FW - m) / Math.cos(0.105)) byFont *= (FW - m) / byNeed;
      place(by, cx - length / 2, byC - byH / 2, length, byH);
      Object.assign(by.style, { fontSize: byFont + 'px', transform: `rotate(${SLANT}deg)` });
      const tape = put('<div class="strip tape" aria-hidden="true"><span>EVERY SITE 30% OFF!</span></div>');
      place(tape, cx - length / 2, tapeC - tapeH / 2, length, tapeH);
      Object.assign(tape.style, { fontSize: (54 / 0.72) * u + 'px', paddingLeft: 24 * u + 'px', transform: `rotate(${SLANT}deg)`,
        boxShadow: `inset 0 ${4 * u}px 0 rgba(170, 158, 0, 0.6), inset 0 ${-4 * u}px 0 rgba(170, 158, 0, 0.6), ${11 * u}px ${11 * u}px 0 rgba(6, 8, 70, 0.9)` });
      bands(X0, FW, tick, crawlH, Y1);
    } else {
      // ---- the strip: the marquee across the top; under it the clock and the offer, side by side in a
      //      long strip (the globe at the left), one over the other in a short one ----
      const u = Math.min(FW / 1170, FH / 720);
      look(u * 1.1); ground(u);
      const tick = 70 * u, crawlH = 90 * u;
      const top = Y0 + tick, bot = Y1 - crawlH, mid = bot - top;
      const m = Math.max(10, 34 * u);
      // 1. the marquee, BLACK FRIDAY ONLY! on one line
      const bulbH = Math.max(6, 17 * u), pad = bulbH * 1.75 + 5 * u;
      const bs = Math.min((FW - 2 * m) * 0.98 / headW('BLACK FRIDAY ONLY!'), (mid * 0.24) / HCAP);
      const bTop = top + 3 * u, bH = HCAP * bs + 2 * pad;
      const rTop = bTop + bH + 0.25 * bulbH, rH = bot - rTop;      // the room under it
      const long = FW / rH > 3.4;
      const parts = [];
      if (long) {
        // the globe at the left, tucked under the marquee; the clock and the offer side by side
        const d = Math.min(rH * 1.12, FW * 0.25), gcx = X0 + m * 0.5 + d * 0.52, gcy = rTop + rH / 2 + d * 0.02;
        glow(gcx, gcy, d * 1.1);
        globe(gcx, gcy, d);
        glint('b', gcx + d * 0.5, gcy - d * 0.3, d * 0.05);
        const left = gcx + d * 0.56 + m * 0.4, right = X1 - m, gw = m * 0.9;
        const ck = clock((right - left - gw) * 0.53, rH * 0.86, 'TIME LEFT TODAY', 0.4);
        parts.push(() => { p.append(ck.el); at(ck.el, left, rTop + (rH - ck.h) / 2 - 2 * u); });
        const ol = left + ck.w + gw, ocx = (ol + right) / 2, ow = right - ol;
        let hs = (ow * 0.9) / headW('30% OFF'), ss = (ow * 0.98) / subW('EVERYTHING ON');
        const oh = HCAP * hs + SCAP * ss * 2 + hs * 0.26 + ss * 0.22, k = Math.min(1, (rH * 0.84) / oh);
        offer(hs * k, ss * k, ocx, rTop + (rH - oh * k) / 2, hs * 0.26 * k, ss * 0.22 * k);
      } else {
        // the clock, as large as goes, then 30% OFF beside EVERYTHING ON / THE INTERNET.
        const g = 9 * u, oRow = rH * 0.36;
        const ck = clock((FW - 2 * m) * 0.9, rH - oRow - g * 2, 'ENDS IN', 0.44);
        const ckTop = rTop + g * 0.6;
        parts.push(() => { p.append(ck.el); at(ck.el, cx - ck.w / 2, ckTop); });
        const oTop = ckTop + ck.h + g, oH = bot - oTop - g * 0.8;
        // 30% OFF's cap height matches the two sub lines' block
        const ssPer = HCAP / (SCAP * 2.3), gap = 0.32;     // ss per hs; gap between, per hs
        const wPer = headW('30% OFF') + gap + subW('EVERYTHING ON') * ssPer;
        const hs = Math.min((FW - 2 * m) * 0.96 / wPer, oH / (HCAP * 1.08)), ss = hs * ssPer;
        const gx = cx - (wPer * hs) / 2, base = oTop + (oH - HCAP * hs) / 2 + HCAP * hs;
        set('head', '30% OFF', HEAD, -0.05, hs, gx, base, true, 'h1');
        const sx = gx + (headW('30% OFF') + gap) * hs, sw = subW('EVERYTHING ON') * ss;
        setC('sub', 'EVERYTHING ON', SUB, -0.04, ss, sx + sw / 2, base - HCAP * hs + SCAP * ss, false, 'h2');
        setC('sub', 'THE INTERNET.', SUB, -0.04, ss, sx + sw / 2, base, false);
      }
      marquee(X0, X1, W, bTop, bH, bulbH, cx, [['BLACK FRIDAY ONLY!', bs, bTop + pad + HCAP * bs, 'p']]);
      for (const f of parts) f();
      bands(X0, FW, tick, crawlH, Y1);
    }
    render(clockT());
  }

  // ---- the clock everything moves by ----
  const t0 = performance.now(), clockT = () => (still ? 0 : Math.floor(((performance.now() - t0) / 1000) * FPS) / FPS);
  const blotch = $('.blotch'), grain = $('.static');
  function render(t) {
    for (const move of movers) move(t);
    const f = Math.round(t * FPS); blotch.setAttribute('seed', BLOTCH[Math.floor(f / 4) % 6]); grain.setAttribute('seed', STATIC[Math.floor(f / 2) % 6]);
  }

  build();
  let pending = 0;
  addEventListener('resize', () => { cancelAnimationFrame(pending); pending = requestAnimationFrame(build); });
  if (still) setInterval(() => render(0), 1000); // the countdown still counts, once a second
  else {
    let last = -1;
    const frame = () => { const t = clockT(); if (t !== last) { last = t; render(t); } requestAnimationFrame(frame); };
    requestAnimationFrame(frame);
    if ('ImageDecoder' in window) (async () => {
      try {
        const dec = new ImageDecoder({ data: await (await fetch(IMG.globe)).arrayBuffer(), type: 'image/webp' });
        await dec.tracks.ready;
        const n = dec.tracks.selectedTrack.frameCount, frames = [];
        for (let i = 0; i < n; i++) { const { image } = await dec.decode({ frameIndex: i }); frames.push(await createImageBitmap(image)); image.close(); }
        dec.close();
        if (n === 60) { globeFrames = frames; build(); }
      } catch {}
    })();
  }

  // the slow-machine fallback: if the look makes drawing slow, take it off (and put it back if that did not help)
  const frameRate = () => new Promise((resolve) => {
    let frames = 0, drawing = 0, last = 0;
    const tick = (now) => { const gap = now - last; if (last && gap < 1000) { frames++; drawing += gap; } last = now; if (drawing < 2000) requestAnimationFrame(tick); else resolve((frames * 1000) / drawing); };
    requestAnimationFrame(tick);
  });
  if (!still && !query.has('keep')) {
    await new Promise((r) => setTimeout(r, 1200));
    const withLook = await frameRate();
    if (withLook < 24) {
      p.style.filter = 'none';
      if ((await frameRate()) < withLook * 1.5) p.style.removeProperty('filter');
    }
  }
})();
</script>
</body>
</html>
