<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>30% Off EVERYTHING</title>
<meta name="description" content="A Black Friday treat for your browser: 30% off every website you visit. Black Friday only.">
<link rel="icon" href="{{img:favicon}}">
<!-- Variant "pitchman": THE REVEAL. One frame of an infomercial, read as one sentence with one climax:
     the presenter's line BUT WAIT… THERE'S LESS! in a speech caption at the top (the set-up), pointing
     down into the payoff, a giant yellow starburst: 30% OFF / EVERYTHING ON THE INTERNET. The globe turns
     behind the burst; BLACK FRIDAY ONLY! is slapped across its foot. Then the order box (ADD TO CHROME,
     the store link), the price card, the four cards; the credits bar and the crawl along the bottom.
     Wide windows: three columns (price | burst | order) or two (burst | price + order); tall: stacked.
     Everything that moves runs off one clock at 25 frames a second, through the tape filter. -->
<style>
{{fonts}}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; background: #070f9c; }
body { -webkit-font-smoothing: antialiased; }
#p { position: fixed; inset: 0; overflow: hidden; background: linear-gradient(#0a1cc4, #0a22d6 45%, #070f9c); filter: url(#tape);
     --yellow: #fff035; --shade: #0a0f66; --red: #ff1616; user-select: none; }
#p > * { position: absolute; display: block; max-width: none; }
#p img { -webkit-user-drag: none; }
.defs { position: absolute; width: 0; height: 0; }
.lines { position: fixed; inset: 0; pointer-events: none; z-index: 2;
         background: repeating-linear-gradient(rgba(0, 0, 16, 0) 0, rgba(0, 0, 16, 0.05) 1.5px, rgba(0, 0, 16, 0) 3px),
                     radial-gradient(farthest-corner at 50% 50%, rgba(0, 0, 0, 0) 0%, rgba(0, 0, 0, 0.03) 50%, rgba(0, 0, 0, 0.08) 71%, rgba(0, 0, 0, 0.13) 85%, rgba(0, 0, 0, 0.21) 100%); }

.glow { border-radius: 50%; background: radial-gradient(closest-side, #58c4ff 0%, #2a8cff 22%, #1348ee 44%, transparent 72%); }
.tiles { background-repeat: repeat; opacity: 0.095; transform: rotate(-6deg); }
.rays { border-radius: 50%; pointer-events: none;
        background: repeating-conic-gradient(rgba(170, 215, 255, 0.13) 0 5deg, rgba(170, 215, 255, 0) 5deg 10deg);
        -webkit-mask: radial-gradient(closest-side, #000 20%, rgba(0,0,0,0.5) 60%, transparent 100%); mask: radial-gradient(closest-side, #000 20%, rgba(0,0,0,0.5) 60%, transparent 100%); }

.t { white-space: nowrap; line-height: 1; }
.head { font-family: "Archivo Black", "Arial Black", sans-serif; color: var(--yellow); letter-spacing: -0.05em;
        text-shadow: 0.009em 0.009em 0 var(--shade), 0.018em 0.018em 0 var(--shade), 0.027em 0.027em 0 var(--shade),
                     0.036em 0.036em 0 var(--shade), 0.045em 0.045em 0 var(--shade), 0.054em 0.054em 0 var(--shade); }
.sub { font: italic 700 1em "Arimo", Arial, sans-serif; letter-spacing: -0.04em;
       background: linear-gradient(#fff 35%, #c5d4fb 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
       filter: drop-shadow(0.045em 0.045em 0 rgba(6, 8, 70, 0.95)); padding: 0 0.1em 0.06em 0; }

/* the burst's own lettering: red with a black edge (as the card's 70%), and navy italic */
.boom { font-family: "Archivo Black", "Arial Black", sans-serif; color: var(--red); letter-spacing: -0.05em;
        -webkit-text-stroke: 0.06em #000; paint-order: stroke fill;
        text-shadow: 0.035em 0.035em 0 var(--shade), 0.07em 0.07em 0 var(--shade); }
.navy { font: italic 700 1em "Arimo", Arial, sans-serif; letter-spacing: -0.04em; color: var(--shade); }

/* the starburst: an SVG; the red one behind turns slowly */
.burst svg { display: block; width: 100%; height: 100%; overflow: visible; }

/* the presenter's line: a speech caption with a tail pointing down into the burst */
.say { display: flex !important; align-items: center; justify-content: center; gap: 0.32em; white-space: nowrap;
       background: var(--shade); border: 0.06em solid #fff; border-radius: 0.38em; box-shadow: 0.12em 0.14em 0 rgba(3, 5, 40, 0.85); }
.say::after { content: ""; position: absolute; left: var(--tail, 62%); bottom: -0.72em; width: 0.95em; height: 0.75em;
              background: var(--shade); clip-path: polygon(0 0, 100% 0, 18% 100%); }
.say::before { content: ""; position: absolute; left: calc(var(--tail, 62%) - 0.07em); bottom: -0.86em; width: 1.11em; height: 0.86em;
               background: #fff; clip-path: polygon(0 0, 100% 0, 18% 100%); }
.say .w { font: italic 700 1em/1 "Arimo", Arial, sans-serif; color: #fff; letter-spacing: -0.03em; }
.say .l { font: 400 1em/1 "Archivo Black", "Arial Black", sans-serif; color: var(--yellow); letter-spacing: -0.04em; font-size: 0.9em; }

.glint svg { display: block; width: 100%; height: 100%; overflow: visible; fill: #fff; }
.glint path { filter: drop-shadow(0 0 0.08px #fff) drop-shadow(0 0 0.22px #9fd4ff); transform-box: fill-box; transform-origin: center; }

.ticker, .crawl { left: 0; right: 0; overflow: hidden; white-space: nowrap; pointer-events: none; }
.ticker { top: 0; font-family: "Antonio", "Arial Narrow", sans-serif; font-weight: 300; letter-spacing: 0.035em; word-spacing: 0.3em;
          color: #e9f0ff; text-shadow: 0.06em 0.06em 0 rgba(4, 8, 80, 0.85); background: rgba(4, 8, 80, 0.35); }
.ticker span { display: inline-block; }
.crawl { bottom: 0; font-family: "Archivo Black", "Arial Black", sans-serif; color: var(--yellow); letter-spacing: -0.02em; word-spacing: 0.08em;
         background: linear-gradient(#d10a0a, #a00006); border-top: 0.05em solid #000; }
.crawl span { display: inline-block; text-shadow: 0.027em 0.027em 0 #000, 0.054em 0.054em 0 #000, 0.07em 0.07em 0 #000; }

/* the order box: the link to the store. Its frame flashes by the clock; hover changes at once */
.order { display: block; text-decoration: none; cursor: pointer; background: #000; border: 0.1em solid var(--yellow); color: #fff;
         box-shadow: 0.22em 0.22em 0 rgba(4, 6, 60, 0.92); overflow: hidden; }
.order.on { border-color: #fff; }
.order .oh { display: flex; justify-content: space-between; align-items: center; background: var(--red); color: #fff46a; border-bottom: 0.08em solid #000;
             font: 600 0.62em/1.7 "Antonio", "Arial Narrow", sans-serif; letter-spacing: 0.06em; padding: 0 0.7em; white-space: nowrap; }
.order .ob { display: flex; align-items: center; justify-content: center; gap: 0.35em; white-space: nowrap;
             font: 400 1em/1 "Archivo Black", "Arial Black", sans-serif; color: var(--yellow); letter-spacing: -0.02em; padding: 0.5em 0 0.42em; }
.order.two .ob { flex-direction: column; gap: 0.12em; padding: 0.45em 0 0.4em; }
.order.two .ob span { display: flex; align-items: center; gap: 0.3em; }
.order .ob i { font: 900 1em/1 Arial, Helvetica, sans-serif; font-style: normal; display: inline-block; }
.order .of { display: flex; flex-wrap: wrap; gap: 0 1.2em; justify-content: space-between; align-items: center; white-space: nowrap; background: var(--shade); border-top: 0.08em solid #000;
             padding: 0 0.85em; font: italic 700 0.5em/2 "Arimo", Arial, sans-serif; }
.order.two .of { justify-content: center; line-height: 1.6; padding: 0.3em 0.6em; }
.order .of b { font: 300 1em/2 "Antonio", "Arial Narrow", sans-serif; letter-spacing: 0.08em; color: #b8c8ff; }
.order.on .ob { color: #fff; }
.order:hover, .order:focus-visible { outline: none; border-color: #fff; }
.order:hover .ob, .order:focus-visible .ob { background: var(--red); color: #fff; }
.order:hover .ob i, .order:focus-visible .ob i { transform: translateX(0.18em); }

/* the credits bar, over the crawl */
.by { display: flex !important; align-items: center; justify-content: center; gap: 0.9em; white-space: nowrap; background: var(--shade);
      color: #fff; font: italic 700 1em/1 "Arimo", Arial, sans-serif; letter-spacing: 0.08em; text-transform: uppercase; }
.by img { height: 1.9em; width: 3.56em; display: block; }
.by .sep { color: var(--yellow); }
.by.two { flex-direction: column; gap: 0.35em; }
.by.two .sep.first, .by.two img { display: none; }
.by .names { display: flex; gap: 0.9em; align-items: center; }
.by a { color: #fff; text-decoration: none; border-bottom: 0.12em solid var(--yellow); padding-bottom: 0.05em; }
.by a:hover, .by a:focus-visible { color: var(--yellow); outline: none; }

/* the ON AIR bug */
.air { display: flex !important; align-items: center; gap: 0.4em; font: 600 1em/1 "Antonio", "Arial Narrow", sans-serif; letter-spacing: 0.1em; color: #fff;
       background: rgba(4, 8, 80, 0.55); padding: 0.25em 0.55em; border: 0.06em solid rgba(255,255,255,0.6); }
.air i { width: 0.62em; height: 0.62em; border-radius: 50%; background: var(--red); box-shadow: 0 0 0.3em #ff5050; }
.air.off i { background: #500; box-shadow: none; }

/* the price card; only its 70% moves */
.card { width: 400px; height: 306px; background: #f3f4f6; color: #0c0c0c; border: 5px solid #000; box-shadow: 8px 8px 0 rgba(4, 6, 60, 0.92);
        transform-origin: left top; font: italic 700 50px/1 "Arimo", Arial, sans-serif; }
.card .hd { background: var(--red); color: #fff46a; font: 600 41px/57px "Antonio", "Arial Narrow", sans-serif; padding: 0 15px; border-bottom: 5px solid #000; white-space: nowrap; overflow: hidden; }
.card .ln { padding: 13px 17px 0; }
.card s { position: relative; text-decoration: none; color: #6b6f78; margin-left: 9px; }
.card s::after { content: ""; position: absolute; left: -8%; right: -8%; top: 46%; height: 8px; background: var(--red); transform: rotate(-11deg); box-shadow: 0 0 0 2px #000; }
.card .big { position: absolute; right: 9px; bottom: -54px; font: 400 165px/0.9 "Archivo Black", "Arial Black", sans-serif; color: var(--red); letter-spacing: -0.05em;
             -webkit-text-stroke: 11px #000; paint-order: stroke fill; transform: skewX(-8deg); transform-origin: 70% 80%; }

.tag { display: inline-block !important; white-space: nowrap; background: var(--red); color: var(--yellow); border: 0.07em solid #000;
       font: 400 1em/1 "Archivo Black", "Arial Black", sans-serif; letter-spacing: -0.01em; padding: 0.2em 0.42em 0.24em;
       box-shadow: 0.12em 0.12em 0 rgba(6, 8, 70, 0.9); transform-origin: center; text-shadow: 0.05em 0.05em 0 #7a0006; }

.oval { width: 7.6em; height: 3.31em; border-radius: 50%; display: grid !important; place-items: center; text-align: center;
        font: italic 700 1em/0.98 "Tinos", "Times New Roman", serif; background: radial-gradient(ellipse at 40% 30%, #fffc9a, #efe01c 72%); color: #151515;
        transform: rotate(-7deg); box-shadow: 0.143em 0.167em 0 rgba(6, 8, 70, 0.9), inset 0 0 0 0.095em rgba(170, 158, 0, 0.5); }
.cards { display: flex !important; gap: 12px; width: 436px; transform-origin: left top; font: italic 700 19px/1 "Arimo", Arial, sans-serif; letter-spacing: 0.02em; }
.cards.grid { flex-wrap: wrap; width: 212px; }
.cards i { flex: none; position: relative; display: block; width: 100px; height: 62px; border-radius: 7px; overflow: hidden; box-shadow: 3px 3px 0 rgba(6, 8, 70, 0.85); }
.cards b { position: absolute; left: 0; right: 0; bottom: 5px; text-align: center; }
.cards .c1 { background: linear-gradient(#f4f4f4 0 34%, #1c3fd1 34% 62%, #f1b400 62%); color: #111; }
.cards .c2 { background: radial-gradient(circle at 50% 40%, #ffb300 0 30%, transparent 31%), #f6f6f6; color: #111; }
.cards .c3 { background: linear-gradient(135deg, #7fd4ff, #2a79d8); color: #fff; }
.cards .c4 { background: linear-gradient(#151515, #3a2a00); color: #ffcf2e; }
.cards .c4 b { font-size: 14.5px; }
.sticker svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.sticker span { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; font: 400 1em/1.02 "Archivo Black", "Arial Black", sans-serif;
                color: #fff46a; letter-spacing: -0.02em; text-shadow: 0.06em 0.06em 0 #000; }
.label { font: 600 1em/1 "Antonio", "Arial Narrow", sans-serif; letter-spacing: 0.12em; color: #dfe8ff; white-space: nowrap; text-shadow: 0.06em 0.06em 0 rgba(4, 8, 80, 0.85); }
</style>
</head>
<body>
<main id="p" aria-label="But wait… there’s less! 30% off everything on the internet. Black Friday only."></main>
<div class="lines" aria-hidden="true"></div>
<script>
(async () => {
  const STORE = '{{link:store}}', GARRETT = '{{link:garrett}}', AUFBAU = '{{link:aufbau}}';
  const query = new URLSearchParams(location.search);
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const IMG = { globe: still ? '{{img:globe_still}}' : '{{img:globe_anim}}', tile: '{{img:tile}}', logo: '{{img:logo}}' };
  const TICKER = 'No purchase necessary! ✦ Every website, 30% off! ✦ Works like magic! ✦ As Seen On Every Website ✦ Black Friday only! ✦ ';
  const CRAWL = 'BLACK FRIDAY ONLY! ✦ ';
  const GLINT = 'M0,-1 C0.06,-0.22 0.22,-0.06 1,0 C0.22,0.06 0.06,0.22 0,1 C-0.06,0.22 -0.22,0.06 -1,0 C-0.22,-0.06 -0.06,-0.22 0,-1Z';
  const TAN9 = Math.tan((9 * Math.PI) / 180);
  const FPS = 25;

  // ---- the tape look (as on the live page) ----
  const LUMA = '0.299 0.587 0.114 0 0';
  const tint = (i, q) => `${i * 0.22} ${q * 0.2} 0 0 ${0.5 - 0.5 * (i * 0.22 + q * 0.2)}`;
  const MOTTLE = `${tint(0.956, 0.621)}  ${tint(-0.272, -0.647)}  ${tint(-1.106, 1.703)}  0 0 0 0 1`;
  const GRAIN = `${'0.7 0 0 0 -0.399  '.repeat(3)} 0 0 0 0 1`;
  const add = (extra = '') => `operator="arithmetic" k2="1" k3="1" k4="-0.5" ${extra}`;
  document.body.insertAdjacentHTML('beforeend', `
    <svg class="defs" aria-hidden="true"><filter id="tape" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB">
      <feFlood flood-color="#0a22d6"/><feMerge result="picture"><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
      <feGaussianBlur class="soft" in="picture"/><feColorMatrix type="matrix" values="${LUMA} ${LUMA} ${LUMA} 0 0 0 1 0" result="luma"/>
      <feGaussianBlur class="halo"/><feComposite in="luma" operator="arithmetic" k2="1.42" k3="-0.42" result="sharp"/>
      <feGaussianBlur class="smear" in="picture"/><feOffset class="late"/>
      <feColorMatrix type="matrix" values="0.393 -0.329 -0.064 0 0.5  -0.167 0.231 -0.064 0 0.5  -0.167 -0.329 0.496 0 0.5  0 0 0 1 0"/>
      <feComposite in2="sharp" operator="arithmetic" k2="2" k3="1" k4="-1" result="clean"/>
      <feTurbulence class="blotch" type="fractalNoise" numOctaves="1" seed="3"/>
      <feColorMatrix type="matrix" values="${MOTTLE}"/><feComposite in2="clean" ${add('result="mottled"')}/>
      <feTurbulence class="static" type="fractalNoise" numOctaves="2" seed="2"/>
      <feColorMatrix type="matrix" values="${GRAIN}"/><feComposite in2="mottled" operator="arithmetic" k2="1" k3="1" result="taped"/>
      <feComponentTransfer><feFuncR type="linear" intercept="-0.55"/><feFuncG type="linear" intercept="-0.55"/><feFuncB type="linear" intercept="-0.55"/></feComponentTransfer>
      <feGaussianBlur class="bloom"/><feComposite in2="taped" operator="arithmetic" k2="0.149" k3="0.93" k4="0.037"/>
    </filter></svg>`);
  const $ = (sel) => document.querySelector(sel);
  const BLOTCH = [3, 11, 7, 19, 5, 13], STATIC = [2, 17, 9, 23, 4, 29];

  await Promise.all(['100px "Archivo Black"', 'italic 700 100px "Arimo"', '300 50px "Antonio"', '600 50px "Antonio"', 'italic 700 50px "Tinos"'].map((f) => document.fonts.load(f)));
  const p = document.getElementById('p');
  const put = (html) => { p.insertAdjacentHTML('beforeend', html); return p.lastElementChild; };
  const place = (el, x, y, w, h) => { Object.assign(el.style, { left: x + 'px', top: y + 'px', width: w + 'px', height: h + 'px' }); return el; };
  const at = (el, x, y) => Object.assign(el.style, { left: x + 'px', top: y + 'px' });

  // measured lettering (as on the live page)
  const mc = document.createElement('canvas').getContext('2d');
  function ink(text, font, ls) {
    mc.font = font.replace('SIZE', '200px'); mc.letterSpacing = ls * 200 + 'px';
    const m = mc.measureText(text), k = 1 / 200;
    return { l: -m.actualBoundingBoxLeft * k, r: m.actualBoundingBoxRight * k - ls, cap: mc.measureText('H').actualBoundingBoxAscent * k,
             asc: m.fontBoundingBoxAscent * k, desc: m.fontBoundingBoxDescent * k };
  }
  function set(cls, text, font, ls, size, x, y, skew, tag = 'div') {
    const i = ink(text, font, ls), el = put(`<${tag} class="t ${cls}">${text}</${tag}>`);
    const base = (1 - (i.asc + i.desc)) / 2 + i.asc;
    Object.assign(el.style, { fontSize: size + 'px', left: x - i.l * size + 'px', top: y - base * size + 'px' });
    if (skew) Object.assign(el.style, { transformOrigin: `0 ${base * size}px`, transform: 'skewX(-9deg)' });
    return el;
  }
  const HEAD = 'SIZE "Archivo Black"', SUB = 'italic 700 SIZE "Arimo"';
  const width = (text, font, ls) => { const i = ink(text, font, ls); return i.r - i.l; };
  const headW = (t) => width(t, HEAD, -0.05) + ink(t, HEAD, -0.05).cap * TAN9;
  const subW = (t) => width(t, SUB, -0.04);
  const HCAP = ink('H', HEAD, -0.05).cap, SCAP = ink('H', SUB, -0.04).cap;
  // a line set centred on cx (a slanted one by its ink's middle)
  const centre = (cls, text, font, ls, size, cx, y, skew, tag) => {
    const w = width(text, font, ls) * size, lean = skew ? ink(text, font, ls).cap * size * TAN9 : 0;
    return set(cls, text, font, ls, size, cx - (w + lean) / 2 + lean, y, skew, tag);
  };

  // ---- what moves ----
  let movers = [];
  const ease = (q) => q * q * (3 - 2 * q);
  const lerp = (a, b, q) => a + (b - a) * q;
  const twinkle = (path, delay) => movers.push((t) => {
    const ph = ((t + delay) / 2.4) % 1, q = ease(ph < 0.5 ? ph * 2 : 2 - ph * 2);
    path.style.transform = `scale(${lerp(0.55, 1, q)}) rotate(${lerp(-10, 12, q)}deg)`; path.style.opacity = lerp(0.75, 1, q);
  });
  const JOLT = [[0, 1, 0], [0.12, 1.18, -5], [0.26, 0.96, 3], [0.4, 1.08, -2], [0.55, 1, 0], [1, 1, 0]];
  const joltAt = (ph) => {
    const i = JOLT.findIndex(([w], n) => ph < JOLT[n + 1]?.[0]), [w0, s0, r0] = JOLT[i], [w1, s1, r1] = JOLT[i + 1], q = ease((ph - w0) / (w1 - w0));
    return [lerp(s0, s1, q), lerp(r0, r1, q)];
  };
  const jolt = (el, period, offset = 0) => movers.push((t) => {
    const [sc, r] = joltAt(((t + offset) / period) % 1);
    el.style.transform = `skewX(-8deg) scale(${sc}) rotate(${r}deg)`;
  });
  const glint = (cls, cx, cy, r) => {
    const el = place(put(`<div class="glint ${cls}" aria-hidden="true"><svg viewBox="-1 -1 2 2"><path d="${GLINT}"/></svg></div>`), cx - r, cy - r, r * 2, r * 2);
    twinkle(el.querySelector('path'), cls === 'b' ? 1.2 : 0);
    return el;
  };
  const oval = (size, words = 'As Seen On<br>Every Website') => { const el = put(`<div class="oval"><span>${words}</span></div>`); el.style.fontSize = size + 'px'; return el; };
  const cards = (x, top, w, grid = false) => {
    const el = put(`<div class="cards${grid ? ' grid' : ''}" role="img" aria-label="Free, gratis, $0.00, no charge"><i class="c1"><b>FREE</b></i><i class="c2"><b>Gratis</b></i><i class="c3"><b>$0.00</b></i><i class="c4"><b>NO CHARGE</b></i></div>`);
    Object.assign(el.style, { left: x + 'px', top: top + 'px', transform: `scale(${w / (grid ? 212 : 436)})` });
    return el;
  };
  const card = (x, top, scale) => {
    const el = put('<div class="card" role="img" aria-label="The Internet (All Of It). Was 100%, now 70%."><div class="hd">The Internet (All Of It)</div><div class="ln">WAS: <s>100%</s></div><div class="ln">NOW:</div><div class="big">70%</div></div>');
    Object.assign(el.style, { left: x + 'px', top: top + 'px', transform: `scale(${scale}) rotate(-1.4deg)` });
    jolt(el.querySelector('.big'), 1.1);
    return el;
  };
  let globeFrames = null;
  const globe = (cx, cy, d) => {
    const k = d / 374, box = 480 * k, x = cx - 240 * k, y = cy - (47 + 187) * k;
    if (globeFrames) {
      const c = put('<canvas class="globe" aria-hidden="true"></canvas>'), dpr = Math.min(2, devicePixelRatio || 1);
      c.width = Math.round(box * dpr); c.height = Math.round(box * dpr); place(c, x, y, box, box);
      const g = c.getContext('2d'); let shown = -1;
      movers.push((t) => { const i = Math.floor(t * 15) % 60; if (i !== shown) { shown = i; g.clearRect(0, 0, c.width, c.height); g.drawImage(globeFrames[i], 0, 0, c.width, c.height); } });
    } else place(put(`<img class="globe" alt="" src="${IMG.globe}">`), x, y, box, box);
  };
  const glow = (cx, cy, d) => place(put('<div class="glow" aria-hidden="true"></div>'), cx - d * 1.3, cy - d * 1.45, d * 2.6, d * 2.9);

  // the starburst: n points, its inner corners at `inner` of the radius
  const burstPath = (n, inner) => {
    let d = '';
    for (let i = 0; i < n * 2; i++) { const a = (i * Math.PI) / n - Math.PI / 2, r = i % 2 ? inner : 1; d += `${i ? 'L' : 'M'}${(Math.cos(a) * r).toFixed(4)},${(Math.sin(a) * r).toFixed(4)}`; }
    return d + 'Z';
  };
  const BURST_FRONT = burstPath(26, 0.86), BURST_BACK = burstPath(13, 0.74);

  // ---- the hero, drawn in its own units (1060 x 1040) at scale S from (X, Y) ----
  //   the caption (set-up) at the top, pointing down into the burst (payoff); the globe behind the
  //   burst's right shoulder; BLACK FRIDAY ONLY! across its foot
  const HERO = { w: 1100, h: 1090 };
  function hero(X, Y, S) {
    const u = (v) => v * S, bx = X + u(470), by = Y + u(642), R = u(432);
    // rays from the burst, and the glow behind the globe
    const rays = place(put('<div class="rays" aria-hidden="true"></div>'), bx - R * 3, by - R * 3, R * 6, R * 6);
    movers.push((t) => { rays.style.transform = `rotate(${(t * 4) % 360}deg)`; });
    const gx = X + u(835), gy = Y + u(330), gd = u(440);
    glow(gx, gy, gd * 1.15);
    globe(gx, gy, gd);
    glint('', gx + gd * 0.42, gy - gd * 0.46, gd * 0.08);
    // the burst: a navy shadow, the red one behind (turning), the yellow one in front (pulsing)
    const b = place(put(`<div class="burst" role="img" aria-label="30% off everything on the internet."><svg viewBox="-1.2 -1.2 2.4 2.4">
        <defs><radialGradient id="bf" cx="0.42" cy="0.36" r="0.7"><stop offset="0" stop-color="#fffcc0"/><stop offset="0.45" stop-color="#fff035"/><stop offset="1" stop-color="#f2c600"/></radialGradient></defs>
        <g class="back"><path d="${BURST_BACK}" transform="translate(0.05 0.06) scale(1.12)" fill="#0a0f66"/><path d="${BURST_BACK}" transform="scale(1.12)" fill="#ff1616" stroke="#000" stroke-width="0.016" stroke-linejoin="round"/></g>
        <g class="front"><path d="${BURST_FRONT}" transform="translate(0.04 0.05)" fill="#0a0f66"/><path d="${BURST_FRONT}" fill="url(#bf)" stroke="#000" stroke-width="0.014" stroke-linejoin="round"/></g>
      </svg></div>`), bx - R * 1.2, by - R * 1.2, R * 2.4, R * 2.4);
    const back = b.querySelector('.back'), front = b.querySelector('.front');
    movers.push((t) => {
      back.setAttribute('transform', `rotate(${(-t * 9) % 360})`);
      const ph = (t / 1.6) % 1, q = ph < 0.18 ? Math.sin((ph / 0.18) * Math.PI) : 0; // a beat every 1.6 s
      front.setAttribute('transform', `scale(${1 + 0.035 * q}) rotate(${-2 * q})`);
    });
    // the payoff's lettering: 30% OFF big; EVERYTHING ON / THE INTERNET. under it
    const hw = u(690), hs = hw / headW('30% OFF'), cx = bx - u(6);
    let y = by - u(18);
    const big = centre('boom', '30% OFF', HEAD, -0.05, hs, cx, y, true, 'h1');
    movers.push((t) => {
      const ph = (t / 1.6) % 1, q = ph < 0.18 ? Math.sin((ph / 0.18) * Math.PI) : 0;
      big.style.transform = `skewX(-9deg) scale(${1 + 0.045 * q})`;
    });
    big.style.transformOrigin = '50% 70%';
    const ss = u(610) / subW('EVERYTHING ON');
    y += u(30) + SCAP * ss; centre('navy', 'EVERYTHING ON', SUB, -0.04, ss, cx + u(4), y, false, 'h2');
    y += u(14) + SCAP * ss; centre('navy', 'THE INTERNET.', SUB, -0.04, ss, cx + u(4), y, false);
    // BLACK FRIDAY ONLY! across the burst's foot
    const tf = u(62), tg = put('<div class="tag">BLACK FRIDAY ONLY!</div>');
    tg.style.fontSize = tf + 'px'; tg.style.transform = 'rotate(-5deg)';
    at(tg, bx - tg.offsetWidth / 2 + u(40), by + R * 0.66);
    // the oval on the globe
    const o = oval(u(36));
    at(o, X + u(965) - o.offsetWidth / 2, Y + u(610) - o.offsetHeight / 2);
    o.style.transform = 'rotate(8deg)';
    // the set-up: the presenter's line, in a speech caption over the burst, its tail into it
    const capF = u(54), say = put('<div class="say"><span class="w">BUT WAIT…</span><span class="l">THERE’S LESS!</span></div>');
    say.style.fontSize = capF + 'px'; say.style.padding = `${capF * 0.34}px ${capF * 0.5}px ${capF * 0.36}px`;
    say.style.setProperty('--tail', '58%');
    at(say, Math.max(X + u(10), bx - say.offsetWidth / 2 - u(40)), Y + u(14));
    glint('b', bx - R * 0.98, by - R * 0.55, u(30));
  }

  // the order box at (x, y), w wide; returns its height
  function order(x, y, w, two = false) {
    const el = put(`<a class="order${two ? ' two' : ''}" href="${STORE}"><div class="oh"><span>ACT NOW!</span><span>ITEM #030</span></div><div class="ob">${two ? '<span>ADD TO</span><span>CHROME <i aria-hidden="true">→</i></span>' : 'ADD TO CHROME <i aria-hidden="true">→</i>'}</div><div class="of"><span>No purchase necessary!</span><b>OPERATORS STANDING BY</b></div></a>`);
    // the button's words as wide as the box allows
    mc.font = '100px "Archivo Black"'; mc.letterSpacing = '-2px';
    const f = (w * (two ? 0.8 : 0.86)) / ((mc.measureText(two ? 'CHROME →' : 'ADD TO CHROME →').width + 35 + 20) / 100);
    el.style.fontSize = f + 'px'; el.style.width = w + 'px'; at(el, x, y);
    const fl = el.querySelector('.of'), fh = el.querySelector('.oh');
    // the small lines: smaller still where the box is narrow
    let n = -1;
    movers.push((t) => { const on = Math.floor(t * 2.5) % 2 === 1; if (on !== n) { n = on; el.classList.toggle('on', on); } });
    return el.offsetHeight;
  }
  // a small sticker burst (furniture: no claims), wobbling by the clock
  const sticker = (cx, cy, r, lines) => {
    const el = place(put(`<div class="sticker" aria-hidden="true"><svg viewBox="-1.1 -1.1 2.2 2.2"><path d="${burstPath(16, 0.8)}" transform="translate(0.06 0.07)" fill="#0a0f66"/><path d="${burstPath(16, 0.8)}" fill="#fff" stroke="#000" stroke-width="0.04"/><path d="${burstPath(16, 0.8)}" transform="scale(0.86)" fill="#ff1616"/></svg><span>${lines}</span></div>`), cx - r * 1.1, cy - r * 1.1, r * 2.2, r * 2.2);
    el.querySelector('span').style.fontSize = r * 0.3 + 'px';
    movers.push((t) => { el.style.transform = `rotate(${12 + 6 * Math.sin(t * 2.6)}deg)`; });
    return el;
  };
  const label = (text, x, y, size) => { const el = put(`<div class="label">${text}</div>`); el.style.fontSize = size + 'px'; at(el, x, y); return el; };

  // ---- one layout pass ----
  function build() {
    p.textContent = ''; movers = [];
    const W = p.clientWidth, H = p.clientHeight, tall = W / H < 0.95;
    const s = tall ? Math.min(W / 1080, H / 1920) * 1.0 : Math.min(W / 1280, H / 800);
    const tick = Math.max(20, (tall ? 70 : 40) * s), crawlH = Math.max(30, (tall ? 120 : 66) * s);

    $('.soft').setAttribute('stdDeviation', `${1.25 * s} ${0.5 * s}`);
    $('.halo').setAttribute('stdDeviation', `${5 * s} ${0.6 * s}`);
    $('.smear').setAttribute('stdDeviation', `${10 * s} ${1.6 * s}`);
    $('.late').setAttribute('dx', 7 * s); $('.late').setAttribute('dy', 1.7 * s);
    $('.bloom').setAttribute('stdDeviation', 14 * s);
    $('.blotch').setAttribute('baseFrequency', `${0.042 / s} ${0.167 / s}`);
    $('.static').setAttribute('baseFrequency', `${0.19 / s} ${0.71 / s}`);

    const tiles = put('<div class="tiles" aria-hidden="true"></div>');
    place(tiles, -W * 0.3, -H * 0.3, W * 1.6, H * 1.6);
    Object.assign(tiles.style, { backgroundImage: `url(${IMG.tile})`, backgroundSize: `${260 * s}px ${224 * s}px` });

    // the credits bar over the crawl: one line if it goes, two if not
    const byFont = Math.max(10.5, (tall ? 30 : 17) * s);
    const by = put(`<div class="by"><img src="${IMG.logo}" alt="Gary Mustard Enterprises"><span class="gme">Brought to you by Gary Mustard Enterprises</span><span class="sep first" aria-hidden="true">✦</span><span class="names"><a href="${GARRETT}">Garrett Musar</a><span class="sep" aria-hidden="true">✦</span><a href="${AUFBAU}">Aufbau</a></span></div>`);
    by.style.fontSize = byFont + 'px'; by.style.left = '0'; by.style.right = '0';
    const byTwo = [...by.children].reduce((a, c) => a + c.offsetWidth, 0) + byFont * 0.9 * 3 > W * 0.94;
    if (byTwo) by.classList.add('two');
    const byH = byFont * (byTwo ? 3.3 : 2.5);
    by.style.height = byH + 'px'; by.style.top = H - crawlH - byH + 'px';
    const lo = tick, hi = H - crawlH - byH, stage = hi - lo;

    // the ON AIR bug, under the ticker
    const air = put('<div class="air" aria-hidden="true"><i></i>ON AIR</div>'); air.style.fontSize = Math.max(11, (tall ? 26 : 15) * s) + 'px';
    let an = -1; movers.push((t) => { const on = Math.floor(t * 1.25) % 2 === 0; if (on !== an) { an = on; air.classList.toggle('off', !on); } });

    if (tall) layTall(W, lo, stage, s, air); else layWide(W, lo, stage, s, air);
    by.remove(); p.appendChild(by);

    const tk = put(`<div class="ticker" aria-hidden="true"><span>${TICKER.repeat(6)}</span></div>`);
    Object.assign(tk.style, { height: tick + 'px', fontSize: tick * 0.66 + 'px', lineHeight: tick + 'px' });
    const cr = put(`<div class="crawl" aria-hidden="true"><span>${CRAWL.repeat(16)}</span></div>`);
    Object.assign(cr.style, { height: crawlH + 'px', fontSize: crawlH * 0.7 + 'px', lineHeight: crawlH + 'px' });
    const tks = tk.firstElementChild, crs = cr.firstElementChild, tkRep = tks.offsetWidth / 6, crRep = crs.offsetWidth / 16;
    const tkV = tick * 1.5, crV = crawlH * 2.6;
    movers.push((t) => {
      tks.style.transform = `translateX(${-(((t + 3) * tkV) % tkRep)}px)`;
      crs.style.transform = `translateX(${-(((t + 3) * crV) % crRep)}px) skewX(-9deg)`;
    });
    render(clock());
  }

  // ---- wide: three columns where the window is wide enough (price | burst | order), else two (burst | price over order) ----
  function layWide(W, lo, stage, s, air) {
    const pad = 20 * s, avail = stage - 2 * pad, side = 34 * s;
    const COL = 470, GAP = 46;
    const three = (W - 2 * side) / avail > ((COL * 2 + GAP * 2 + HERO.w) / HERO.h) * 0.9;
    const dw = three ? COL * 2 + GAP * 2 + HERO.w : HERO.w + GAP + COL;
    const S = Math.min(avail / HERO.h, (W - 2 * side) / dw);
    const spare = W - 2 * side - dw * S, colW = COL * S;
    // spare width: half to the columns (they grow), the rest round them
    const grow = three ? Math.min(spare * 0.5 / 2, colW * 0.25) : Math.min(spare * 0.5, colW * 0.25), cw = colW + grow;
    const rest = spare - grow * (three ? 2 : 1), gap = GAP * S + rest / (three ? 4 : 3);
    const top = lo + pad + (avail - HERO.h * S) / 2;
    const heroX = side + rest / (three ? 4 : 3) + (three ? cw + gap : 0), heroR = heroX + HERO.w * S;
    const midY = top + 640 * S; // the burst's centre
    at(air, side * 0.7, lo + 12 * s);
    hero(heroX, top, S);
    const cardsAt = (x, y, w) => { const lab = 24 * S; label('WE ACCEPT:', x, y, lab); cards(x, y + lab + 10 * S, w); return lab + 10 * S + (62 * w) / 436; };
    if (three) {
      // left: the price card, level with the burst
      const lx = side + rest / 4, cs = (cw / 400) * 0.84, ch = (306 + 50) * cs;
      const cx0 = lx + (cw - 400 * cs) / 2, cy0 = midY - ch / 2 - 10 * S;
      card(cx0, cy0, cs);
      sticker(cx0 + 400 * cs + 22 * S, cy0 - 44 * S, 70 * S, 'TODAY<br>ONLY');
      // right: the order box, the cards under it
      const rx = heroR + gap, lab = 26 * S;
      const oh = order(rx, -9999, cw, true), el = p.lastElementChild, cardsH = 24 * S + 10 * S + (62 * cw) / 436;
      const total = lab + 14 * S + oh + 34 * S + cardsH;
      let y = midY - total / 2;
      label('LIMITED TIME ✦ TODAY ONLY', rx, y, lab); y += lab + 14 * S;
      el.style.top = y + 'px'; y += oh + 34 * S;
      cardsAt(rx, y, cw);
    } else {
      const rx = heroR + gap, cs = (cw / 400) * 0.9, ch = (306 + 50) * cs;
      const oh0 = order(rx, -9999, cw, true), el = p.lastElementChild;
      const cardsH = 24 * S + 10 * S + (62 * cw) / 436, total = ch + 40 * S + oh0 + 30 * S + cardsH;
      let y = top + (HERO.h * S - total) / 2;
      card(rx + 8 * S, y, cs); sticker(rx + 8 * S + 400 * cs + 18 * S, y - 34 * S, 62 * S, 'TODAY<br>ONLY'); y += ch + 40 * S;
      el.style.top = y + 'px'; y += oh0 + 30 * S;
      cardsAt(rx, y, cw);
    }
  }

  // ---- tall: the caption, the burst, then the price card beside the payment cards, then the order box ----
  function layTall(W, lo, stage, s, air) {
    const pad = 26 * s, side = 22 * s, avail = stage - 2 * pad;
    const ROW = 430, OB = 330, dh = HERO.h + 40 + ROW + 50 + OB;
    const S = Math.min((W - 2 * side) / HERO.w, avail / dh);
    const X = (W - HERO.w * S) / 2, spare = avail - dh * S;
    let y = lo + pad + spare * 0.3;
    at(air, side, lo + 10 * s);
    hero(X, y, S); y += (HERO.h + 40) * S + spare * 0.2;
    const cs = 460 / 400 * S; card(X + 10 * S, y, cs); sticker(X + 485 * S, y - 30 * S, 72 * S, 'TODAY<br>ONLY');
    cards(X + 560 * S, y + 30 * S, 470 * S, true);
    y += ROW * S + 50 * S + spare * 0.2;
    const ow = Math.min(W - 2 * side, HERO.w * S * 1.12); order((W - ow) / 2, y, ow);
  }

  const t0 = performance.now(), clock = () => (still ? 0 : Math.floor(((performance.now() - t0) / 1000) * FPS) / FPS);
  const blotch = $('.blotch'), grain = $('.static');
  function render(t) {
    for (const move of movers) move(t);
    const f = Math.round(t * FPS); blotch.setAttribute('seed', BLOTCH[Math.floor(f / 4) % 6]); grain.setAttribute('seed', STATIC[Math.floor(f / 2) % 6]);
  }

  build();
  let pending = 0;
  addEventListener('resize', () => { cancelAnimationFrame(pending); pending = requestAnimationFrame(build); });
  if (!still) {
    let last = -1;
    const frame = () => { const t = clock(); if (t !== last) { last = t; render(t); } requestAnimationFrame(frame); };
    requestAnimationFrame(frame);
    if ('ImageDecoder' in window) (async () => {
      try {
        const dec = new ImageDecoder({ data: await (await fetch(IMG.globe)).arrayBuffer(), type: 'image/webp' });
        await dec.tracks.ready;
        const n = dec.tracks.selectedTrack.frameCount, frames = [];
        for (let i = 0; i < n; i++) { const { image } = await dec.decode({ frameIndex: i }); frames.push(await createImageBitmap(image)); image.close(); }
        dec.close();
        if (n === 60) { globeFrames = frames; build(); }
      } catch {}
    })();
  }

  // the slow-machine fallback (as on the live page)
  const frameRate = () => new Promise((resolve) => {
    let frames = 0, drawing = 0, last = 0;
    const tick = (now) => { const gap = now - last; if (last && gap < 1000) { frames++; drawing += gap; } last = now; if (drawing < 2000) requestAnimationFrame(tick); else resolve((frames * 1000) / drawing); };
    requestAnimationFrame(tick);
  });
  if (!still && !query.has('keep')) {
    await new Promise((r) => setTimeout(r, 1200));
    const withLook = await frameRate();
    if (withLook < 24) {
      p.style.filter = 'none';
      if ((await frameRate()) < withLook * 1.5) p.style.removeProperty('filter');
    }
  }
})();
</script>
</body>
</html>
