<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>30% Off EVERYTHING</title>
<meta name="description" content="A Black Friday treat for your browser: 30% off every website you visit. Black Friday only.">
<link rel="icon" href="{{img:favicon}}">
<!-- Variant "title card": one frame of a classic TV spot's title card. A bevelled 4:3 safe area sits
     in the middle of the window (the blue and the faint marks carry on outside it); inside, one
     centred, symmetrical stack read top to bottom:
       GARY MUSTARD ENTERPRISES PRESENTS  ->  30% / OFF (huge, the globes as bookends)  ->
       EVERYTHING ON THE INTERNET.  ->  the BLACK FRIDAY ONLY! tag  ->  the ADD TO CHROME plate in its bulbs.
     BUT WAIT… THERE'S LESS! is not in the stack at all: it is the corner sash across the frame's top
     right, the announcer's aside, so it never competes with the headline.
     Outside the frame (beside it on wide windows, under it on tall ones): the price card and the
     As Seen On badge. Ticker on top, credits and crawl at the foot.
     Everything that moves runs off one clock at 25 frames a second; no CSS animation or transition. -->
<style>
{{fonts}}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; background: #070f9c; }
body { -webkit-font-smoothing: antialiased; }
#p { position: fixed; inset: 0; overflow: hidden; background: linear-gradient(#0a1cc4, #0a22d6 45%, #070f9c); filter: url(#tape);
     --yellow: #fff035; --shade: #0a0f66; --red: #ff1616; user-select: none; }
#p > * { position: absolute; display: block; max-width: none; }
#p img { -webkit-user-drag: none; }
.defs { position: absolute; width: 0; height: 0; }
.lines { position: fixed; inset: 0; pointer-events: none; z-index: 2;
         background: repeating-linear-gradient(rgba(0, 0, 16, 0) 0, rgba(0, 0, 16, 0.05) 1.5px, rgba(0, 0, 16, 0) 3px),
                     radial-gradient(farthest-corner at 50% 50%, rgba(0, 0, 0, 0) 0%, rgba(0, 0, 0, 0.03) 50%, rgba(0, 0, 0, 0.08) 71%, rgba(0, 0, 0, 0.13) 85%, rgba(0, 0, 0, 0.21) 100%); }

.glow { border-radius: 50%; background: radial-gradient(closest-side, #58c4ff 0%, #2a8cff 22%, #1348ee 44%, transparent 72%); }
.tiles { background-repeat: repeat; opacity: 0.095; transform: rotate(-6deg); }

/* the title card: the 4:3 safe area, bevelled, a little brighter than the blue around it */
.frame { overflow: hidden; background: radial-gradient(ellipse 70% 60% at 50% 40%, #2a5cff 0%, #1338ea 38%, #0b22cc 70%, #0716a4 100%); }
.frame > * { position: absolute; display: block; }
.burst { border-radius: 50%; background: repeating-conic-gradient(from 0deg, rgba(150, 200, 255, 0.15) 0deg 6deg, rgba(150, 200, 255, 0) 6deg 15deg); }
.spot { border-radius: 50%; background: radial-gradient(closest-side, rgba(11, 34, 204, 0) 0%, rgba(11, 34, 204, 0) 30%, rgba(8, 24, 170, 0.75) 100%); }
.rule { border: solid rgba(255, 240, 53, 0.7); }
.bug { opacity: 0.5; }
.clip { overflow: hidden; pointer-events: none; }
.clip > * { position: absolute; display: block; }
.sash { display: flex !important; flex-direction: column; align-items: center; justify-content: center; gap: 0.08em; white-space: nowrap;
        background: linear-gradient(#ff4a3a, #ff1616 50%, #c40000); color: #fff; font: italic 700 1em/1 "Arimo", Arial, sans-serif; letter-spacing: -0.02em;
        text-shadow: 0.05em 0.05em 0 #6a0004; transform: rotate(45deg); transform-origin: center; }
.sash .a { font-size: 0.7em; letter-spacing: 0.05em; color: var(--yellow); }

/* lettering, placed by baseline and ink edge (see set()) */
.t { white-space: nowrap; line-height: 1; }
.head { font-family: "Archivo Black", "Arial Black", sans-serif; color: var(--yellow); letter-spacing: -0.05em;
        text-shadow: 0.009em 0.009em 0 var(--shade), 0.018em 0.018em 0 var(--shade), 0.027em 0.027em 0 var(--shade),
                     0.036em 0.036em 0 var(--shade), 0.045em 0.045em 0 var(--shade), 0.054em 0.054em 0 var(--shade); }
.sub { font: italic 700 1em "Arimo", Arial, sans-serif; letter-spacing: -0.04em;
       background: linear-gradient(#fff 35%, #c5d4fb 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
       filter: drop-shadow(0.045em 0.045em 0 rgba(6, 8, 70, 0.95)); padding: 0 0.1em 0.06em 0; }
.pres { display: flex !important; align-items: center; gap: 0.7em; white-space: nowrap; font: 600 1em/1 "Antonio", "Arial Narrow", sans-serif;
        letter-spacing: 0.2em; color: #fff; text-shadow: 0.07em 0.07em 0 rgba(4, 8, 80, 0.9); }
.pres i { display: block; width: 2.4em; height: 0.1em; background: var(--yellow); box-shadow: 0.07em 0.07em 0 rgba(4, 8, 80, 0.9); }

.glint svg { display: block; width: 100%; height: 100%; overflow: visible; fill: #fff; }
.glint path { filter: drop-shadow(0 0 0.08px #fff) drop-shadow(0 0 0.22px #9fd4ff); transform-box: fill-box; transform-origin: center; }

.ticker, .crawl { left: 0; right: 0; overflow: hidden; white-space: nowrap; pointer-events: none; }
.ticker { top: 0; font-family: "Antonio", "Arial Narrow", sans-serif; font-weight: 300; letter-spacing: 0.035em; word-spacing: 0.3em;
          color: #e9f0ff; text-shadow: 0.06em 0.06em 0 rgba(4, 8, 80, 0.85); background: rgba(4, 8, 90, 0.45); }
.ticker span { display: inline-block; }
.crawl { bottom: 0; font-family: "Archivo Black", "Arial Black", sans-serif; color: var(--yellow); letter-spacing: -0.02em; word-spacing: 0.08em; }
.crawl span { display: inline-block; text-shadow: 0.027em 0.027em 0 var(--shade), 0.054em 0.054em 0 var(--shade), 0.08em 0.08em 0 var(--shade); }
.bug2 { display: flex !important; align-items: center; gap: 0.35em; white-space: nowrap; font: 600 1em/1 "Antonio", "Arial Narrow", sans-serif; letter-spacing: 0.12em;
        padding: 0 0.55em; color: #fff; }
.bug2.red { background: var(--red); box-shadow: 0.12em 0.12em 0 rgba(4, 8, 80, 0.9); }
.bug2.navy { background: var(--shade); color: var(--yellow); box-shadow: 0.12em 0.12em 0 rgba(4, 8, 80, 0.9); }
.dot { display: block; width: 0.5em; height: 0.5em; border-radius: 50%; background: #fff; }

/* the credits: a level navy band at the foot */
.strip { display: flex !important; align-items: center; justify-content: center; white-space: nowrap; font: italic 700 1em "Arimo", Arial, sans-serif; }
.by { background: var(--shade); color: #fff; letter-spacing: 0.08em; text-transform: uppercase; box-shadow: 0 -0.12em 0 rgba(255, 240, 53, 0.85); }
.by .sep { margin: 0 0.9em; color: var(--yellow); }
.by a { color: #fff; text-decoration: none; border-bottom: 0.12em solid var(--yellow); padding-bottom: 0.05em; }
.by a:hover, .by a:focus-visible { color: var(--yellow); outline: none; }

/* the order plate: the link to the store, in a ring of chasing bulbs */
.bulbs { background-color: #08104f; box-shadow: 0 0 0 0.25em #000; }
.order { display: flex !important; flex-direction: column; align-items: center; justify-content: center; text-decoration: none; color: #111; cursor: pointer;
         background: linear-gradient(#fffdc0, #fff035 45%, #e9d40c); border: 0.06em solid #000; white-space: nowrap;
         box-shadow: inset 0 0.07em 0 rgba(255, 255, 255, 0.8), inset 0 -0.08em 0 rgba(150, 130, 0, 0.7); }
.order .go { display: flex; align-items: center; gap: 0.32em; font: 400 1em/1 "Archivo Black", "Arial Black", sans-serif; letter-spacing: -0.02em; }
.order .go i { font: 900 1em/1 Arial, Helvetica, sans-serif; font-style: normal; display: inline-block; }
.order .fine { font: italic 700 0.46em/1 "Arimo", Arial, sans-serif; letter-spacing: 0.08em; margin-top: 0.34em; color: #8a0008; }
/* hover: at once, no easing in */
.order:hover, .order:focus-visible { outline: none; background: linear-gradient(#ff6a5a, #ff1616 50%, #c40000); color: #fff; }
.order:hover .fine, .order:focus-visible .fine { color: var(--yellow); }
.order:hover .go i, .order:focus-visible .go i { transform: translateX(0.18em); }
.order:focus-visible { box-shadow: 0 0 0 0.08em #fff; }

/* the price card; only its 70% moves */
.card { width: 400px; height: 306px; background: #f3f4f6; color: #0c0c0c; border: 5px solid #000; box-shadow: 8px 8px 0 rgba(4, 6, 60, 0.92);
        transform-origin: left top; font: italic 700 50px/1 "Arimo", Arial, sans-serif; }
.card .hd { background: var(--red); color: #fff46a; font: 600 41px/57px "Antonio", "Arial Narrow", sans-serif; padding: 0 15px; border-bottom: 5px solid #000; white-space: nowrap; overflow: hidden; }
.card .ln { padding: 13px 17px 0; }
.card s { position: relative; text-decoration: none; color: #6b6f78; margin-left: 9px; }
.card s::after { content: ""; position: absolute; left: -8%; right: -8%; top: 46%; height: 8px; background: var(--red); transform: rotate(-11deg); box-shadow: 0 0 0 2px #000; }
.card .big { position: absolute; right: 9px; bottom: -54px; font: 400 165px/0.9 "Archivo Black", "Arial Black", sans-serif; color: var(--red); letter-spacing: -0.05em;
             -webkit-text-stroke: 11px #000; paint-order: stroke fill; transform: skewX(-8deg); transform-origin: 70% 80%; }

/* BLACK FRIDAY ONLY!, as a red tag */
.tag { display: inline-block !important; white-space: nowrap; background: var(--red); color: var(--yellow); border: 0.07em solid #000;
       font: 400 1em/1 "Archivo Black", "Arial Black", sans-serif; letter-spacing: -0.01em; padding: 0.2em 0.42em 0.24em;
       box-shadow: 0.12em 0.12em 0 rgba(6, 8, 70, 0.9); transform: rotate(-2deg); transform-origin: center; text-shadow: 0.05em 0.05em 0 #7a0006; }

/* the As Seen On badge and the four cards (laid out 436 x 62, then scaled) */
.oval { width: 7.6em; height: 3.31em; border-radius: 50%; display: grid !important; place-items: center; text-align: center;
        font: italic 700 1em/0.98 "Tinos", "Times New Roman", serif; background: radial-gradient(ellipse at 40% 30%, #fffc9a, #efe01c 72%); color: #151515;
        transform: rotate(-7deg); box-shadow: 0.143em 0.167em 0 rgba(6, 8, 70, 0.9), inset 0 0 0 0.095em rgba(170, 158, 0, 0.5); }
.cards { display: flex !important; gap: 12px; width: 436px; transform-origin: left top; font: italic 700 19px/1 "Arimo", Arial, sans-serif; letter-spacing: 0.02em; }
.pair { width: 212px; }
.cards i { flex: none; position: relative; display: block; width: 100px; height: 62px; border-radius: 7px; overflow: hidden; box-shadow: 3px 3px 0 rgba(6, 8, 70, 0.85); }
.cards b { position: absolute; left: 0; right: 0; bottom: 5px; text-align: center; }
.cards .c1 { background: linear-gradient(#f4f4f4 0 34%, #1c3fd1 34% 62%, #f1b400 62%); color: #111; }
.cards .c2 { background: radial-gradient(circle at 50% 40%, #ffb300 0 30%, transparent 31%), #f6f6f6; color: #111; }
.cards .c3 { background: linear-gradient(135deg, #7fd4ff, #2a79d8); color: #fff; }
.cards .c4 { background: linear-gradient(#151515, #3a2a00); color: #ffcf2e; }
.cards .c4 b { font-size: 14.5px; }
.say { font: italic 700 1em/1.05 "Arimo", Arial, sans-serif; color: #fff; text-align: center; white-space: nowrap; letter-spacing: -0.02em;
       text-shadow: 0.06em 0.06em 0 rgba(4, 8, 80, 0.95); }
.label { display: flex !important; align-items: center; gap: 0.4em; white-space: nowrap; font: 600 1em/1 "Antonio", "Arial Narrow", sans-serif; letter-spacing: 0.14em;
         color: #fff; }
.label b { font-weight: 600; background: var(--shade); color: var(--yellow); padding: 0.22em 0.45em; box-shadow: 0.1em 0.1em 0 rgba(0, 0, 0, 0.5); }
</style>
</head>
<body>
<main id="p" aria-label="30% Off EVERYTHING: 30% off every website. Black Friday only."></main>
<div class="lines" aria-hidden="true"></div>
<script>
(async () => {
  const STORE = '{{link:store}}', GARRETT = '{{link:garrett}}', AUFBAU = '{{link:aufbau}}';
  const query = new URLSearchParams(location.search);
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const IMG = { globe: still ? '{{img:globe_still}}' : '{{img:globe_anim}}', tile: '{{img:tile}}', logo: '{{img:logo}}' };
  const TICKER = 'No purchase necessary! ✦ Every website, 30% off! ✦ Works like magic! ✦ 30% off the entire internet. ✦ Black Friday only! ✦ ';
  const CRAWL = 'BLACK FRIDAY ONLY! ✦ EVERY SITE 30% OFF! ✦ ';
  const GLINT = 'M0,-1 C0.06,-0.22 0.22,-0.06 1,0 C0.22,0.06 0.06,0.22 0,1 C-0.06,0.22 -0.22,0.06 -1,0 C-0.22,-0.06 -0.06,-0.22 0,-1Z';
  const TAN9 = Math.tan((9 * Math.PI) / 180), R2 = Math.SQRT2;
  const FPS = 25; // the clock everything moves by: a PAL picture's rate

  // ---- the tape look: the live banner's filter (src/content.js), distances set in build(), the noise moved on by the clock ----
  const LUMA = '0.299 0.587 0.114 0 0';
  const tint = (i, q) => `${i * 0.22} ${q * 0.2} 0 0 ${0.5 - 0.5 * (i * 0.22 + q * 0.2)}`;
  const MOTTLE = `${tint(0.956, 0.621)}  ${tint(-0.272, -0.647)}  ${tint(-1.106, 1.703)}  0 0 0 0 1`;
  const GRAIN = `${'0.7 0 0 0 -0.399  '.repeat(3)} 0 0 0 0 1`;
  const add = (extra = '') => `operator="arithmetic" k2="1" k3="1" k4="-0.5" ${extra}`;
  document.body.insertAdjacentHTML('beforeend', `
    <svg class="defs" aria-hidden="true"><filter id="tape" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB">
      <feFlood flood-color="#0a22d6"/><feMerge result="picture"><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
      <feGaussianBlur class="soft" in="picture"/><feColorMatrix type="matrix" values="${LUMA} ${LUMA} ${LUMA} 0 0 0 1 0" result="luma"/>
      <feGaussianBlur class="halo"/><feComposite in="luma" operator="arithmetic" k2="1.42" k3="-0.42" result="sharp"/>
      <feGaussianBlur class="smear" in="picture"/><feOffset class="late"/>
      <feColorMatrix type="matrix" values="0.393 -0.329 -0.064 0 0.5  -0.167 0.231 -0.064 0 0.5  -0.167 -0.329 0.496 0 0.5  0 0 0 1 0"/>
      <feComposite in2="sharp" operator="arithmetic" k2="2" k3="1" k4="-1" result="clean"/>
      <feTurbulence class="blotch" type="fractalNoise" numOctaves="1" seed="3"/>
      <feColorMatrix type="matrix" values="${MOTTLE}"/><feComposite in2="clean" ${add('result="mottled"')}/>
      <feTurbulence class="static" type="fractalNoise" numOctaves="2" seed="2"/>
      <feColorMatrix type="matrix" values="${GRAIN}"/><feComposite in2="mottled" operator="arithmetic" k2="1" k3="1" result="taped"/>
      <feComponentTransfer><feFuncR type="linear" intercept="-0.55"/><feFuncG type="linear" intercept="-0.55"/><feFuncB type="linear" intercept="-0.55"/></feComponentTransfer>
      <feGaussianBlur class="bloom"/><feComposite in2="taped" operator="arithmetic" k2="0.149" k3="0.93" k4="0.037"/>
    </filter></svg>`);
  const $ = (sel) => document.querySelector(sel);
  // the noise: the colour blotches change 6 times a second, the static 12 (every fourth and every other frame)
  const BLOTCH = [3, 11, 7, 19, 5, 13], STATIC = [2, 17, 9, 23, 4, 29];

  await Promise.all(['100px "Archivo Black"', 'italic 700 100px "Arimo"', '300 50px "Antonio"', '600 50px "Antonio"', 'italic 700 50px "Tinos"'].map((f) => document.fonts.load(f)));
  const p = document.getElementById('p');
  const put = (html, into = p) => { into.insertAdjacentHTML('beforeend', html); return into.lastElementChild; };
  const place = (el, x, y, w, h) => (Object.assign(el.style, { left: x + 'px', top: y + 'px', width: w + 'px', height: h + 'px' }), el);
  const at = (el, x, y) => (Object.assign(el.style, { left: x + 'px', top: y + 'px' }), el);

  // Lettering is measured, not guessed: the ink's edges and the cap height of a string, per 1px of type.
  const mc = document.createElement('canvas').getContext('2d');
  function ink(text, font, ls) {
    mc.font = font.replace('SIZE', '200px'); mc.letterSpacing = ls * 200 + 'px';
    const m = mc.measureText(text), k = 1 / 200;
    return { l: -m.actualBoundingBoxLeft * k, r: m.actualBoundingBoxRight * k - ls, cap: mc.measureText('H').actualBoundingBoxAscent * k,
             asc: m.fontBoundingBoxAscent * k, desc: m.fontBoundingBoxDescent * k };
  }
  // Set a line of type with its ink's left edge at x and its baseline at y. skew: the headline's slant.
  function set(cls, text, font, ls, size, x, y, skew, tag = 'div') {
    const i = ink(text, font, ls), el = put(`<${tag} class="t ${cls}">${text}</${tag}>`);
    const base = (1 - (i.asc + i.desc)) / 2 + i.asc;
    Object.assign(el.style, { fontSize: size + 'px', left: x - i.l * size + 'px', top: y - base * size + 'px' });
    if (skew) Object.assign(el.style, { transformOrigin: `0 ${base * size}px`, transform: 'skewX(-9deg)' });
    return el;
  }
  const HEAD = 'SIZE "Archivo Black"', SUB = 'italic 700 SIZE "Arimo"', ANT = '600 SIZE "Antonio"';
  const width = (text, font, ls) => { const i = ink(text, font, ls); return i.r - i.l; };
  const headW = (t) => width(t, HEAD, -0.05) + ink(t, HEAD, -0.05).cap * TAN9; // per 1px of type, slant included
  const subW = (t) => width(t, SUB, -0.04);
  const HCAP = ink('H', HEAD, -0.05).cap, SCAP = ink('H', SUB, -0.04).cap, ACAP = ink('H', ANT, 0).cap;
  const across = (text, font, size, ls) => { mc.font = `${font} ${size}px ${font.includes('700') ? '"Arimo"' : '"Archivo Black"'}`; mc.letterSpacing = ls * size + 'px'; return mc.measureText(text).width; };
  // a line centred on cx, baseline at y (the slant's lean shared either side)
  const mid = (cls, text, font, ls, size, cx, y, skew, tag) => {
    const w = width(text, font, ls) * size, lean = skew ? ink(text, font, ls).cap * size * TAN9 : 0;
    return set(cls, text, font, ls, size, cx - (w + lean) / 2, y, skew, tag);
  };
  // an element centred on cx, its top at y
  const centre = (el, cx, y) => at(el, cx - el.offsetWidth / 2, y);

  // ---- what moves, and how, at time t (seconds) ----
  let movers = [];
  const ease = (q) => q * q * (3 - 2 * q);
  const lerp = (a, b, q) => a + (b - a) * q;
  const twinkle = (path, delay) => movers.push((t) => {
    const ph = ((t + delay) / 2.4) % 1, q = ease(ph < 0.5 ? ph * 2 : 2 - ph * 2);
    path.style.transform = `scale(${lerp(0.55, 1, q)}) rotate(${lerp(-10, 12, q)}deg)`; path.style.opacity = lerp(0.75, 1, q);
  });
  const JOLT = [[0, 1, 0], [0.12, 1.18, -5], [0.26, 0.96, 3], [0.4, 1.08, -2], [0.55, 1, 0], [1, 1, 0]]; // when, scale, turn
  const jolt = (el, period) => movers.push((t) => {
    const ph = (t / period) % 1, i = JOLT.findIndex(([w], n) => ph < JOLT[n + 1]?.[0]), [w0, s0, r0] = JOLT[i], [w1, s1, r1] = JOLT[i + 1];
    const q = ease((ph - w0) / (w1 - w0));
    el.style.transform = `skewX(-8deg) scale(${lerp(s0, s1, q)}) rotate(${lerp(r0, r1, q)}deg)`;
  });
  const blink = (el, period, on = 0.5) => movers.push((t) => { el.style.visibility = (t / period) % 1 < on ? 'visible' : 'hidden'; });

  const glint = (cls, cx, cy, r, delay = 0) => {
    const el = place(put(`<div class="glint ${cls}" aria-hidden="true"><svg viewBox="-1 -1 2 2"><path d="${GLINT}"/></svg></div>`), cx - r, cy - r, r * 2, r * 2);
    twinkle(el.querySelector('path'), delay);
    return el;
  };
  const oval = (size, words) => { const el = put(`<div class="oval"><span>${words}</span></div>`); el.style.fontSize = size + 'px'; return el; };
  // the four cards; `split` lays them as two pairs (for either side of the plate)
  const pair = (x, top, h, a, b) => {
    const el = put(`<div class="cards pair" aria-hidden="true">${a}${b}</div>`), k = h / 62;
    Object.assign(el.style, { left: x + 'px', top: top + 'px', transform: `scale(${k})` });
    return 212 * k;
  };
  const C = ['<i class="c1"><b>FREE</b></i>', '<i class="c2"><b>Gratis</b></i>', '<i class="c3"><b>$0.00</b></i>', '<i class="c4"><b>NO CHARGE</b></i>'];
  const cards = (x, top, w) => {
    const el = put(`<div class="cards" aria-hidden="true">${C.join('')}</div>`);
    Object.assign(el.style, { left: x + 'px', top: top + 'px', transform: `scale(${w / 436})` });
    return (62 * w) / 436;
  };
  const card = (x, top, scale) => {
    const el = put('<div class="card" role="img" aria-label="The Internet (All Of It). Was 100%, now 70%."><div class="hd">The Internet (All Of It)</div><div class="ln">WAS: <s>100%</s></div><div class="ln">NOW:</div><div class="big">70%</div></div>');
    Object.assign(el.style, { left: x + 'px', top: top + 'px', transform: `scale(${scale}) rotate(-1.4deg)` });
    jolt(el.querySelector('.big'), 1.1);
    return top + (306 + 54) * scale;
  };
  // The globe: its 60 frames drawn onto a canvas by the clock (decoded once from the moving picture);
  // until they are ready, a picture. Several globes share the frames.
  let globeFrames = null;
  const globe = (cx, cy, d, offset = 0) => {
    const k = d / 374, box = 480 * k, x = cx - 240 * k, y = cy - (47 + 187) * k;
    if (globeFrames) {
      const c = put('<canvas class="globe" aria-hidden="true"></canvas>'), dpr = Math.min(2, devicePixelRatio || 1);
      c.width = Math.round(box * dpr); c.height = Math.round(box * dpr); place(c, x, y, box, box);
      const g = c.getContext('2d'); let shown = -1;
      movers.push((t) => { const i = (Math.floor(t * 15) + offset) % 60; if (i !== shown) { shown = i; g.clearRect(0, 0, c.width, c.height); g.drawImage(globeFrames[i], 0, 0, c.width, c.height); } });
    } else {
      place(put(`<img class="globe" alt="" src="${IMG.globe}">`), x, y, box, box);
    }
  };
  const glow = (cx, cy, d) => place(put('<div class="glow" aria-hidden="true"></div>'), cx - d * 1.3, cy - d * 1.45, d * 2.6, d * 2.9);

  // ---- one layout pass, for the window as it is ----
  function build() {
    p.textContent = ''; movers = [];
    const W = p.clientWidth, H = p.clientHeight, tall = W / H < 0.92;
    const s = tall ? Math.min(W / 1080, H / 1920) * 1.08 : Math.min(W / 1280, H / 800);

    // the tape filter's distances, in step with the composition's size
    $('.soft').setAttribute('stdDeviation', `${1.25 * s} ${0.5 * s}`);
    $('.halo').setAttribute('stdDeviation', `${5 * s} ${0.6 * s}`);
    $('.smear').setAttribute('stdDeviation', `${10 * s} ${1.6 * s}`);
    $('.late').setAttribute('dx', 7 * s); $('.late').setAttribute('dy', 1.7 * s);
    $('.bloom').setAttribute('stdDeviation', 14 * s);
    $('.blotch').setAttribute('baseFrequency', `${0.042 / s} ${0.167 / s}`);
    $('.static').setAttribute('baseFrequency', `${0.19 / s} ${0.71 / s}`);

    // the ground of marks
    const tiles = put('<div class="tiles" aria-hidden="true"></div>');
    place(tiles, -W * 0.3, -H * 0.3, W * 1.6, H * 1.6);
    Object.assign(tiles.style, { backgroundImage: `url(${IMG.tile})`, backgroundSize: `${260 * s}px ${224 * s}px` });

    // the bands: ticker on top; at the foot the credits, then the crawl
    const tick = Math.max(18, (tall ? 64 : 40) * s), crawlH = Math.max(26, (tall ? 104 : 66) * s);
    const byFont = Math.max(10.5, (tall ? 30 : 17) * s);
    const credit = 'BROUGHT TO YOU BY GARY MUSTARD ENTERPRISES ✦ GARRETT MUSAR ✦ AUFBAU';
    const shortBy = across(credit, 'italic 700', byFont, 0.08) + 3.6 * byFont > W * 0.94;
    const byH = byFont * 2.1, byTop = H - crawlH - byH;
    const g = Math.max(14, (tall ? 44 : 26) * s);                       // the gutter
    const zTop = tick + g * 0.75, zBot = byTop - g * 0.7, zH = zBot - zTop;

    // ---- the frame: 4:3 in the middle on a wide window; on a tall one as wide as it can be, the extras under it ----
    let FW, FH, fx, fy, below = null;
    if (!tall) {
      FH = zH; FW = Math.min(FH * 4 / 3, W - 2 * g); FH = Math.min(FH, FW * 0.9);
      fx = (W - FW) / 2; fy = zTop + (zH - FH) / 2;
    } else {
      FW = W - 2 * g;
      const cs = Math.min((FW * 0.5) / 410, 1.1 * s * 1.2), exH = 360 * cs + 0.06 * FW;  // the price card under the frame
      FH = Math.max(FW * 0.75, Math.min(FW * 1.55, zH - exH - g * 0.6));
      if (zH - FH - g * 0.6 < exH * 0.9) FH = Math.min(FW * 1.55, zH); else below = { cs, top: zTop + FH + g * 0.6, h: zH - FH - g * 0.6 };

    const bev = Math.max(4, FW * 0.009), rad = FW * 0.035;

      boxShadow: [`inset ${bev * 0.6}px ${bev * 0.6}px 0 rgba(160, 190, 255, 0.55)`, `inset ${-bev * 0.6}px ${-bev * 0.6}px 0 rgba(2, 6, 60, 0.6)`,
                  `0 0 0 ${bev}px #c9d5ff`, `0 0 0 ${bev * 1.5}px #6f86e8`, `0 0 0 ${bev * 2.1}px #050a55`,
                  `${bev * 2.6}px ${bev * 2.6}px 0 ${bev * 2.1}px rgba(3, 5, 50, 0.75)`].join(', ') });

    const u = FW;                                                     // everything is sized off the frame's width

    const sashEdge = (x) => x - (u - 2 * sash.c) + sash.h * 0.72;    // the sash's lower edge, frame-local y at frame-local x
    const headLines = ['30%', 'OFF'], hW = Math.max(...headLines.map(headW));
    const subLines = narrow ? ['EVERYTHING ON', 'THE INTERNET.'] : ['EVERYTHING ON THE INTERNET.'], sW = Math.max(...subLines.map(subW));
    const presText = narrow ? 'PRESENTS' : 'GARY MUSTARD ENTERPRISES PRESENTS', presW = width(presText, ANT, 0.2) + 2 * (2.4 + 0.7);
    const gd = (narrow ? 0.17 : 0.17) * u;                                  // the bookend globes' size
    const N = {                                                       // natural sizes (k = 1), frame-local px
      pres: Math.min((u * (narrow ? 0.88 : 0.5)) / presW, (u * (narrow ? 0.032 : 0.021)) / ACAP), logo: u * 0.36,
      head: (u * (narrow ? 0.8 : 0.56)) / hW,
      sub: (u * (narrow ? 0.86 : 0.76)) / sW,
      tag: u * (narrow ? 0.56 : 0.42),
      plateW: u * (narrow ? 0.82 : 0.44), plateH: u * (narrow ? 0.21 : 0.11),

    };

    // lay the stack at k from y0 (frame-local); dry: only measure. Returns the bottom and the lines' tops and half-widths.
    function stack(k, y0, gapK, dry) {
      const X = fx + u / 2, rows = []; let y = y0;
      const row = (top, hw) => rows.push([top, hw]);
      if (narrow) {                                             // a narrow card: the company's mark, centred, over PRESENTS
        const lw = N.logo * k, lh = (lw * 610) / 1142;
        row(y, lw / 2);
        if (!dry) place(put(`<img class="mark" alt="Gary Mustard Enterprises" src="${IMG.logo}">`), X - lw / 2, fy + y, lw, lh);
        y += lh + 0.02 * u * k * gapK;
      }
      const ps = N.pres * k, pw = presW * ps;
      row(y, pw / 2);
      if (!dry) { const el = put(`<div class="pres"><i></i><span>${presText}</span><i></i></div>`); el.style.fontSize = ps + 'px'; el.style.height = ps + 'px'; centre(el, X, fy + y); }
      y += ps + 0.034 * u * k * gapK;
      const hs = N.head * k, headTop = y;

      y += 0.036 * u * k * gapK;

      if (!dry) { const el = put('<div class="tag">BLACK FRIDAY ONLY!</div>'); el.style.fontSize = tf + 'px'; centre(el, X, fy + y); }
      y += tf * 1.5;
      y += 0.05 * u * k * gapK;
      const plW = N.plateW * k, plH = N.plateH * k, plTop = y;

      y += plH;
      if (narrow) { y += 0.035 * u * k * gapK; y += (62 * N.cardsW * k) / 436; }
      return { bottom: y, rows, headTop, headBot, tagTop, tf, plW, plH, plTop, ps, hs };
    }
    // fit: shrink until it goes in under the sash, then share the spare height out among the gaps
    const pad = 0.045 * u, room = FH - 2 * pad;
    let k = 1, y0 = pad, gapK = 1;
    for (let n = 0; n < 8; n++) {
      const r = stack(k, 0, 1, true), clear = Math.max(0, ...r.rows.map(([top, hw]) => sashEdge(u / 2 + hw) + 0.012 * u - top));
      y0 = Math.max(pad, clear);

    }
    {
      const r = stack(k, 0, 1, true), gaps = (0.034 + 0.04 + 0.036 + 0.05 + (narrow ? 0.035 : 0)) * u * k;

      y0 = Math.max(y0, clear);
    }
    const L = stack(k, y0, gapK, true);

    // inside the frame: the sunburst behind the headline, the keyline, the station's mark
    const X = fx + u / 2, hcY = (L.headTop + L.headBot) / 2;
    const bd = Math.hypot(FW, FH) * 1.25;
    const burst = place(put('<div class="burst"></div>', frame), u / 2 - bd / 2, hcY - bd / 2, bd, bd);
    movers.push((t) => { burst.style.transform = `rotate(${(t * 4) % 360}deg)`; });
    place(put('<div class="spot"></div>', frame), u / 2 - bd * 0.42, hcY - bd * 0.42, bd * 0.84, bd * 0.84);
    const ri = u * 0.02, rule = place(put('<div class="rule"></div>', frame), ri, ri, FW - 2 * ri, FH - 2 * ri);
    Object.assign(rule.style, { borderWidth: Math.max(1.5, u * 0.0028) + 'px', borderRadius: rad * 0.7 + 'px' });
    const bh = u * 0.05; if (!narrow) place(put(`<img class="bug" alt="" src="${IMG.logo}">`, frame), u * 0.045, u * 0.04, bh * 1142 / 610, bh);

    const offSide = (u - headW('OFF') * L.hs) / 2, offD = Math.min(u * 0.2, offSide - u * 0.035);
    const gk = narrow ? 1 : Math.min(1, ((L.headBot - L.headTop) * 0.95) / gd);
    const gD = narrow ? offD : gd * gk;
    const gx = narrow ? Math.max(gD / 2 + u * 0.03, offSide / 2) : u * 0.105;
    let gy = narrow ? L.headBot - HCAP * L.hs * 0.5 : hcY;
    if (!narrow) gy = Math.max(gy, sashEdge(u - gx + gD * 0.35) + gD * 0.55);

      const cx = X + side * (u / 2 - gx);

    }
    for (const side of [-1, 1]) {
      const cx = X + side * (u / 2 - gx);

    }

    // the plate, its bulbs, and the cards (two pairs beside it on a wide frame, a row under it on a narrow one)
    const plX = X - L.plW / 2, plY = fy + L.plTop, e = L.plH * 0.2;
    const bulbs = place(put('<div class="bulbs" aria-hidden="true"></div>'), plX - e, plY - e, L.plW + 2 * e, L.plH + 2 * e);
    const nx = Math.max(4, Math.round((L.plW + 2 * e) / e)), ny = Math.max(2, Math.round((L.plH + 2 * e) / e));
    const bx = (L.plW + 2 * e) / nx, byy = (L.plH + 2 * e) / ny;
    const dot = (c) => `radial-gradient(circle closest-side, ${c} 0 38%, rgba(0,0,0,0) 62%)`;
    Object.assign(bulbs.style, { borderRadius: e * 0.9 + 'px', backgroundSize: `${bx}px ${byy}px, ${bx}px ${byy}px`, fontSize: e + 'px' });
    movers.push((t) => {
      const on = Math.floor(t * 5) % 2;
      bulbs.style.backgroundImage = on ? `${dot('#fffbd0')}, ${dot('rgba(0,0,0,0)')}` : `${dot('#ffd21a')}, ${dot('rgba(0,0,0,0)')}`;
      bulbs.style.backgroundPosition = on ? '0 0, 0 0' : `${bx / 2}px ${byy / 2}px, 0 0`;
    });

    const order = place(put(`<a class="order" href="${STORE}"><span class="go">ADD TO CHROME <i aria-hidden="true">→</i></span><span class="fine">NO PURCHASE NECESSARY!</span></a>`), plX, plY, L.plW, L.plH);
    Object.assign(order.style, { fontSize: pf + 'px', borderRadius: e * 0.6 + 'px' });

    Object.assign(sa.style, { fontSize: sf + 'px', boxShadow: `0 ${sash.h * 0.07}px 0 var(--yellow), 0 ${-sash.h * 0.07}px 0 var(--yellow), 0 ${sash.h * 0.16}px 0 rgba(3, 5, 50, 0.6)` });

    function extras(x0, y0, w, h, sideBySide) {

        const lw = w * 0.56, cs = Math.min((lw * 0.92) / 410, (h * 0.9) / 380), cH = 360 * cs, lf = Math.max(9, cs * 30);
        const lab = put('<div class="label"><b>ITEM #30</b><span>LIMITED TIME</span></div>'); lab.style.fontSize = lf + 'px';
        const top = y0 + (h - cH - lf * 1.9) / 2;

        const rx = x0 + lw + w * 0.04, rw = w - lw - w * 0.04, of = Math.min(rw / 8.2, h / 5.2);

        const sy = put('<div class="say">Works like magic!</div>'); sy.style.fontSize = sayF + 'px'; centre(sy, rx + rw / 2, top + lf * 0.6 + o.offsetHeight + of * 0.5);
        const st = put('<div class="label"><span class="dot"></span><span>OPERATORS STANDING BY</span></div>');
        st.style.fontSize = Math.min(lf * 0.95, rw / 13) + 'px'; centre(st, rx + rw / 2, sy.offsetTop + sy.offsetHeight + of * 0.35);

      }

      const lf = Math.max(9, w * 0.058), cs = Math.min((w * 0.9) / 410, (h * 0.5) / 380), cH = 360 * cs;
      const of = Math.min((w * 0.86) / 7.9, h * 0.07), oH = of * 3.6, sayF = Math.min(of * 0.7, (w * 0.95) / (across('Works like magic!', 'italic 700', 100, -0.02) / 100));
      const total = lf * 1.9 + cH + h * 0.07 + oH + sayF * 1.6 + lf * 1.8, gap = Math.max(0, (h - total) / 4);

      y += lf * 1.9; card(x0 + (w - 408 * cs) / 2, y, cs); y += cH + h * 0.07 + gap;
      const o = oval(of, 'As Seen On<br>Every Website'); centre(o, x0 + w / 2, y); y += oH;
      glint('b', x0 + w / 2 + o.offsetWidth * 0.48, y - oH * 0.9, of * 0.55, 0.6);
      const sy = put('<div class="say">Works like magic!</div>'); sy.style.fontSize = sayF + 'px'; centre(sy, x0 + w / 2, y); y += sayF * 1.6 + gap * 0.6;
      const st = put('<div class="label"><span class="dot"></span><span>OPERATORS STANDING BY</span></div>'); st.style.fontSize = Math.min(lf * 0.9, w / 14) + 'px'; centre(st, x0 + w / 2, y);

      const pw = fx - g * 0.75 + u * 0.035;

        const lab = put('<div class="label"><b>ITEM #30</b><span>LIMITED TIME</span></div>'); lab.style.fontSize = lf + 'px';

        const rx = W - g * 0.75 - pw, of = Math.min((pw * 0.92) / 7.9, zH * 0.09), oH = of * 3.6;
        const sayF = Math.min(of * 0.72, (pw * 0.95) / (across('Works like magic!', 'italic 700', 100, -0.02) / 100));

        glint('b', rx + pw / 2 + o.offsetWidth * 0.45, ry + oH * 0.08, of * 0.55, 0.6);
        const sy = put('<div class="say">Works like magic!</div>'); sy.style.fontSize = sayF + 'px'; centre(sy, rx + pw / 2, ry + oH + of * 0.2);
        const st = put('<div class="label"><span class="dot"></span><span>OPERATORS STANDING BY</span></div>');
        const outR = fx + FW + bev * 3; st.style.fontSize = Math.min(lf * 1.05, (W - outR - g * 0.5) / 12.5) + 'px'; centre(st, (outR + W - g * 0.3) / 2, ry + oH + of * 0.2 + sayF * 1.5);

    } else if (below) {

    }

    // ---- the credits, level along the foot ----
    const by = put(`<div class="strip by"><span class="gme">${shortBy ? 'Gary Mustard Enterprises' : 'Brought to you by Gary Mustard Enterprises'}</span><span class="sep" aria-hidden="true">✦</span><a href="${GARRETT}">Garrett Musar</a><span class="sep" aria-hidden="true">✦</span><a href="${AUFBAU}">Aufbau</a></div>`);
    place(by, 0, byTop, W, byH); by.style.fontSize = byFont + 'px';

    // ---- the tickers: the lines along the top, the crawl along the bottom; the bugs on the ticker's ends ----
    const tk = put(`<div class="ticker" aria-hidden="true"><span>${TICKER.repeat(6)}</span></div>`);
    Object.assign(tk.style, { height: tick + 'px', fontSize: tick * 0.64 + 'px', lineHeight: tick + 'px' });
    const cr = put(`<div class="crawl" aria-hidden="true"><span>${CRAWL.repeat(10)}</span></div>`);
    Object.assign(cr.style, { height: crawlH + 'px', fontSize: crawlH * 0.72 + 'px', lineHeight: crawlH + 'px' });
    const bf = tick * 0.56;
    const air = put('<div class="bug2 red" aria-hidden="true"><span class="dot"></span><span>ON AIR</span></div>');

    blink(air.querySelector('.dot'), 1.0, 0.6);

    const tks = tk.firstElementChild, crs = cr.firstElementChild, tkRep = tks.offsetWidth / 6, crRep = crs.offsetWidth / 10;

  // ---- the clock ----
  const t0 = performance.now(), clock = () => (still ? 0 : Math.floor(((performance.now() - t0) / 1000) * FPS) / FPS);

  function render(t) {
    for (const move of movers) move(t);
    const f = Math.round(t * FPS); blotch.setAttribute('seed', BLOTCH[Math.floor(f / 4) % 6]); grain.setAttribute('seed', STATIC[Math.floor(f / 2) % 6]);
  }

  build();
  let pending = 0;
  addEventListener('resize', () => { cancelAnimationFrame(pending); pending = requestAnimationFrame(build); });
  if (!still) {
    let last = -1;
    const frame = () => { const t = clock(); if (t !== last) { last = t; render(t); } requestAnimationFrame(frame); };
    requestAnimationFrame(frame);
    // the globe's frames, decoded once (on the side), then drawn by the clock in step with everything else
    if ('ImageDecoder' in window) (async () => {
      try {
        const dec = new ImageDecoder({ data: await (await fetch(IMG.globe)).arrayBuffer(), type: 'image/webp' });
        await dec.tracks.ready;
        const n = dec.tracks.selectedTrack.frameCount, frames = [];
        for (let i = 0; i < n; i++) { const { image } = await dec.decode({ frameIndex: i }); frames.push(await createImageBitmap(image)); image.close(); }
        dec.close();
        if (n === 60) { globeFrames = frames; build(); }
      } catch {}
    })();
  }

  // The tape look costs little on a graphics card and a great deal without one: once the page is up,
  // see how fast it draws; if slowly, take the look off, and if that made no difference, put it back.
  const frameRate = () => new Promise((resolve) => {
    let frames = 0, drawing = 0, last = 0;
    const tick = (now) => { const gap = now - last; if (last && gap < 1000) { frames++; drawing += gap; } last = now; if (drawing < 2000) requestAnimationFrame(tick); else resolve((frames * 1000) / drawing); };
    requestAnimationFrame(tick);
  });
  if (!still && !query.has('keep')) {
    await new Promise((r) => setTimeout(r, 1200));
    const withLook = await frameRate();
    if (withLook < 24) {
      p.style.filter = 'none';
      if ((await frameRate()) < withLook * 1.5) p.style.removeProperty('filter');
    }
  }
})();
</script>
</body>
</html>
