<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>30% Off EVERYTHING</title>
<meta name="description" content="A Black Friday treat for your browser: 30% off every website you visit. Black Friday only.">
<link rel="icon" href="{{img:favicon}}">
<!-- Variant "split-sequence": a two-beat storyboard in one frame. A diagonal yellow tape (BLACK FRIDAY
     ONLY! running along it) cuts the frame in two. Above and to the left, beat one, the set-up: the
     globe and 30% OFF / EVERYTHING ON THE INTERNET., as large as the frame allows. Below and to the
     right, beat two, the payoff, in a presenter's caption register: BUT WAIT… THERE'S LESS!, the price
     card that shows it, and the ORDER panel that is the link to the store. The tape is the cut between
     the two. Everything that moves runs off one clock at 25 frames a second. -->
<style>
{{fonts}}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; background: #070f9c; }
body { -webkit-font-smoothing: antialiased; }
#p { position: fixed; inset: 0; overflow: hidden; background: linear-gradient(#0a1cc4, #0a22d6 45%, #070f9c); filter: url(#tape);
     --yellow: #fff035; --shade: #0a0f66; --red: #ff1616; user-select: none; }
#p > * { position: absolute; display: block; max-width: none; }
#p img { -webkit-user-drag: none; }
.defs { position: absolute; width: 0; height: 0; }
.lines { position: fixed; inset: 0; pointer-events: none; z-index: 2;
         background: repeating-linear-gradient(rgba(0, 0, 16, 0) 0, rgba(0, 0, 16, 0.05) 1.5px, rgba(0, 0, 16, 0) 3px),
                     radial-gradient(farthest-corner at 50% 50%, rgba(0, 0, 0, 0) 0%, rgba(0, 0, 0, 0.03) 50%, rgba(0, 0, 0, 0.08) 71%, rgba(0, 0, 0, 0.13) 85%, rgba(0, 0, 0, 0.21) 100%); }

.glow { border-radius: 50%; background: radial-gradient(closest-side, #58c4ff 0%, #2a8cff 22%, #1348ee 44%, transparent 72%); }
.tiles { background-repeat: repeat; opacity: 0.095; transform: rotate(-6deg); }
/* beat two sits on a darker ground: the far side of the cut */
.dusk { background: linear-gradient(rgba(4, 8, 90, 0.55), rgba(3, 6, 70, 0.8)); }

.t { white-space: nowrap; line-height: 1; }
.head { font-family: "Archivo Black", "Arial Black", sans-serif; color: var(--yellow); letter-spacing: -0.05em;
        text-shadow: 0.009em 0.009em 0 var(--shade), 0.018em 0.018em 0 var(--shade), 0.027em 0.027em 0 var(--shade),
                     0.036em 0.036em 0 var(--shade), 0.045em 0.045em 0 var(--shade), 0.054em 0.054em 0 var(--shade); }
.sub { font: italic 700 1em "Arimo", Arial, sans-serif; letter-spacing: -0.04em;
       background: linear-gradient(#fff 35%, #c5d4fb 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
       filter: drop-shadow(0.045em 0.045em 0 rgba(6, 8, 70, 0.95)); padding: 0 0.1em 0.06em 0; }

.glint svg { display: block; width: 100%; height: 100%; overflow: visible; fill: #fff; }
.glint path { filter: drop-shadow(0 0 0.08px #fff) drop-shadow(0 0 0.22px #9fd4ff); transform-box: fill-box; transform-origin: center; }

.ticker { left: 0; right: 0; top: 0; overflow: hidden; white-space: nowrap; pointer-events: none;
          font-family: "Antonio", "Arial Narrow", sans-serif; font-weight: 300; letter-spacing: 0.035em; word-spacing: 0.3em;
          color: #e9f0ff; text-shadow: 0.06em 0.06em 0 rgba(4, 8, 80, 0.85); background: rgba(3, 6, 60, 0.35); }
.ticker span { display: inline-block; }
/* the ON AIR bug over the ticker's left end */
.onair { display: flex !important; align-items: center; gap: 0.35em; padding: 0 0.55em; background: #0b0b0b; color: #fff;
         font: 600 1em/1 "Antonio", "Arial Narrow", sans-serif; letter-spacing: 0.12em; border-right: 0.12em solid var(--red); }
.onair b { display: inline-block; width: 0.62em; height: 0.62em; border-radius: 50%; background: var(--red); box-shadow: 0 0 0.3em var(--red); }
.bug { opacity: 0.6; }

/* the cut: the yellow tape and the navy band under it; their words run along them */
.seam, .band { overflow: hidden; white-space: nowrap; transform-origin: center; pointer-events: none; }
.seam { background: linear-gradient(#fffb86, #f0e11c); color: #111; display: flex !important; align-items: center;
        font: 400 1em/1 "Archivo Black", "Arial Black", sans-serif; letter-spacing: -0.01em; }
.seam span, .band span { display: inline-block; }
.band { background: var(--shade); color: #fff; display: flex !important; align-items: center;
        font: 600 1em/1 "Antonio", "Arial Narrow", sans-serif; letter-spacing: 0.16em; }
.band em { font-style: normal; color: var(--yellow); margin: 0 0.8em; }

/* beat two: the presenter's caption */
.caption { white-space: nowrap; display: flex !important; flex-direction: column; align-items: flex-end; }
.caption .tab { display: inline-block; background: var(--yellow); color: #111; font: italic 700 0.4em/1 "Arimo", Arial, sans-serif;
                letter-spacing: 0.02em; padding: 0.16em 0.55em 0.18em; transform: skewX(-9deg); margin-right: 0.2em;
                box-shadow: 0.12em 0.12em 0 rgba(6, 8, 70, 0.9); }
.caption .say { display: block; padding: 0.05em 0.28em 0.1em 0.34em; background: linear-gradient(90deg, rgba(3, 6, 50, 0.4), rgba(3, 6, 50, 0.86));
                border-left: 0.09em solid var(--yellow); border-bottom: 0.03em solid rgba(255, 240, 53, 0.55); }
.caption .say span { display: block; font: italic 700 1em/1.02 "Arimo", Arial, sans-serif; letter-spacing: -0.04em;
                     background: linear-gradient(#fff 35%, #c5d4fb 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
                     filter: drop-shadow(0.045em 0.045em 0 rgba(6, 8, 70, 0.95)); padding: 0 0.06em 0.06em 0; }

/* the order panel: the link to the store */
.order { display: flex !important; flex-direction: column; align-items: stretch; text-decoration: none; cursor: pointer; }
.order .lbl { align-self: flex-start; background: #0b0b0b; color: #fff; font: 600 0.34em/1 "Antonio", "Arial Narrow", sans-serif; letter-spacing: 0.14em;
              padding: 0.32em 0.7em 0.3em; white-space: nowrap; }
.order .lbl b { color: var(--yellow); font-weight: 600; }
.order .btn { display: flex; align-items: center; justify-content: center; gap: 0.38em; white-space: nowrap;
              background: linear-gradient(#ff3a2a, #e00c0c); color: var(--yellow); border: 0.07em solid #000;
              font: 400 1em/1 "Archivo Black", "Arial Black", sans-serif; letter-spacing: -0.02em; padding: 0.34em 0.62em 0.38em;
              box-shadow: inset 0 0.08em 0 rgba(255, 255, 255, 0.35), 0.16em 0.16em 0 rgba(6, 8, 70, 0.92); text-shadow: 0.05em 0.05em 0 #7a0006; }
.order .btn i { font: 900 1em/1 Arial, Helvetica, sans-serif; font-style: normal; display: inline-block; }
.order.lit .btn { color: #fff; }
.order:hover .btn, .order:focus-visible .btn { background: linear-gradient(#fffdb8, #fff035); color: #111; text-shadow: none; }
.order:hover .btn i, .order:focus-visible .btn i { transform: translateX(0.18em); }
.order:focus-visible { outline: none; }
.order:focus-visible .btn { outline: 0.06em solid #fff; outline-offset: 0.06em; }

/* ACT NOW!, a starburst on the panel's corner */
.burst { display: grid !important; place-items: center; text-align: center; pointer-events: none;
         font: 400 1em/0.9 "Archivo Black", "Arial Black", sans-serif; color: var(--red); letter-spacing: -0.03em; }
.burst::before, .burst::after { content: ""; position: absolute; inset: 0; clip-path: var(--star); }
.burst::before { background: #000; transform: translate(0.12em, 0.12em); }
.burst::after { inset: 0.08em; background: radial-gradient(#fffde0, var(--yellow) 60%); }
.burst span { position: relative; z-index: 1; transform: rotate(-12deg); }

/* the credits: a lower third along the foot */
.by { display: flex !important; align-items: center; justify-content: center; gap: 0; white-space: nowrap; left: 0; right: 0; bottom: 0;
      background: var(--shade); color: #fff; font: italic 700 1em/1 "Arimo", Arial, sans-serif; letter-spacing: 0.08em; text-transform: uppercase;
      border-top: 0.12em solid var(--yellow); }
.by .sep { margin: 0 0.9em; color: var(--yellow); }
.by .item { font: 600 1em/1 "Antonio", "Arial Narrow", sans-serif; letter-spacing: 0.14em; color: var(--yellow); margin-right: 1.4em; }
.by a { color: #fff; text-decoration: none; border-bottom: 0.12em solid var(--yellow); padding-bottom: 0.05em; }
.by a:hover, .by a:focus-visible { color: var(--yellow); outline: none; }

/* the price card; only its 70% moves */
.card { width: 400px; height: 306px; background: #f3f4f6; color: #0c0c0c; border: 5px solid #000; box-shadow: 8px 8px 0 rgba(4, 6, 60, 0.92);
        transform-origin: left top; font: italic 700 50px/1 "Arimo", Arial, sans-serif; }
.card .hd { background: var(--red); color: #fff46a; font: 600 41px/57px "Antonio", "Arial Narrow", sans-serif; padding: 0 15px; border-bottom: 5px solid #000; white-space: nowrap; overflow: hidden; }
.card .ln { padding: 13px 17px 0; }
.card s { position: relative; text-decoration: none; color: #6b6f78; margin-left: 9px; }
.card s::after { content: ""; position: absolute; left: -8%; right: -8%; top: 46%; height: 8px; background: var(--red); transform: rotate(-11deg); box-shadow: 0 0 0 2px #000; }
.card .big { position: absolute; right: 9px; bottom: -54px; font: 400 165px/0.9 "Archivo Black", "Arial Black", sans-serif; color: var(--red); letter-spacing: -0.05em;
             -webkit-text-stroke: 11px #000; paint-order: stroke fill; transform: skewX(-8deg); transform-origin: 70% 80%; }

.oval { width: 7.6em; height: 3.31em; border-radius: 50%; display: grid !important; place-items: center; text-align: center;
        font: italic 700 1em/0.98 "Tinos", "Times New Roman", serif; background: radial-gradient(ellipse at 40% 30%, #fffc9a, #efe01c 72%); color: #151515;
        transform: rotate(-7deg); box-shadow: 0.143em 0.167em 0 rgba(6, 8, 70, 0.9), inset 0 0 0 0.095em rgba(170, 158, 0, 0.5); }
.cards { display: flex !important; gap: 12px; width: 436px; transform-origin: left top; font: italic 700 19px/1 "Arimo", Arial, sans-serif; letter-spacing: 0.02em; }
.cards i { flex: none; position: relative; display: block; width: 100px; height: 62px; border-radius: 7px; overflow: hidden; box-shadow: 3px 3px 0 rgba(6, 8, 70, 0.85); }
.cards b { position: absolute; left: 0; right: 0; bottom: 5px; text-align: center; }
.cards .c1 { background: linear-gradient(#f4f4f4 0 34%, #1c3fd1 34% 62%, #f1b400 62%); color: #111; }
.cards .c2 { background: radial-gradient(circle at 50% 40%, #ffb300 0 30%, transparent 31%), #f6f6f6; color: #111; }
.cards .c3 { background: linear-gradient(135deg, #7fd4ff, #2a79d8); color: #fff; }
.cards .c4 { background: linear-gradient(#151515, #3a2a00); color: #ffcf2e; }
.cards .c4 b { font-size: 14.5px; }
</style>
</head>
<body>
<main id="p" aria-label="30% Off EVERYTHING: 30% off every website. Black Friday only."></main>
<div class="lines" aria-hidden="true"></div>
<script>
(async () => {
  const STORE = '{{link:store}}', GARRETT = '{{link:garrett}}', AUFBAU = '{{link:aufbau}}';
  const query = new URLSearchParams(location.search);
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const IMG = { globe: still ? '{{img:globe_still}}' : '{{img:globe_anim}}', tile: '{{img:tile}}', logo: '{{img:logo}}' };
  const TICKER = 'No purchase necessary! ✦ Every website, 30% off! ✦ Works like magic! ✦ As Seen On Every Website ✦ 30% off the entire internet. ✦ ';
  const SEAM = 'BLACK FRIDAY ONLY! ✦ ';
  const BAND = 'TODAY ONLY<em>✦</em>LIMITED TIME<em>✦</em>ACT NOW<em>✦</em>';
  const GLINT = 'M0,-1 C0.06,-0.22 0.22,-0.06 1,0 C0.22,0.06 0.06,0.22 0,1 C-0.06,0.22 -0.22,0.06 -1,0 C-0.22,-0.06 -0.06,-0.22 0,-1Z';
  const TAN9 = Math.tan((9 * Math.PI) / 180);
  const STAR = 'polygon(' + Array.from({ length: 32 }, (_, i) => { const a = (i / 32) * 2 * Math.PI - Math.PI / 2, r = i % 2 ? 36 : 50; return `${(50 + r * Math.cos(a)).toFixed(2)}% ${(50 + r * Math.sin(a)).toFixed(2)}%`; }).join(',') + ')';
  const FPS = 25;

  // ---- the tape look (as on the live page) ----
  const LUMA = '0.299 0.587 0.114 0 0';
  const tint = (i, q) => `${i * 0.22} ${q * 0.2} 0 0 ${0.5 - 0.5 * (i * 0.22 + q * 0.2)}`;
  const MOTTLE = `${tint(0.956, 0.621)}  ${tint(-0.272, -0.647)}  ${tint(-1.106, 1.703)}  0 0 0 0 1`;
  const GRAIN = `${'0.7 0 0 0 -0.399  '.repeat(3)} 0 0 0 0 1`;
  const add = (extra = '') => `operator="arithmetic" k2="1" k3="1" k4="-0.5" ${extra}`;
  document.body.insertAdjacentHTML('beforeend', `
    <svg class="defs" aria-hidden="true"><filter id="tape" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB">
      <feFlood flood-color="#0a22d6"/><feMerge result="picture"><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
      <feGaussianBlur class="soft" in="picture"/><feColorMatrix type="matrix" values="${LUMA} ${LUMA} ${LUMA} 0 0 0 1 0" result="luma"/>
      <feGaussianBlur class="halo"/><feComposite in="luma" operator="arithmetic" k2="1.42" k3="-0.42" result="sharp"/>
      <feGaussianBlur class="smear" in="picture"/><feOffset class="late"/>
      <feColorMatrix type="matrix" values="0.393 -0.329 -0.064 0 0.5  -0.167 0.231 -0.064 0 0.5  -0.167 -0.329 0.496 0 0.5  0 0 0 1 0"/>
      <feComposite in2="sharp" operator="arithmetic" k2="2" k3="1" k4="-1" result="clean"/>
      <feTurbulence class="blotch" type="fractalNoise" numOctaves="1" seed="3"/>
      <feColorMatrix type="matrix" values="${MOTTLE}"/><feComposite in2="clean" ${add('result="mottled"')}/>
      <feTurbulence class="static" type="fractalNoise" numOctaves="2" seed="2"/>
      <feColorMatrix type="matrix" values="${GRAIN}"/><feComposite in2="mottled" operator="arithmetic" k2="1" k3="1" result="taped"/>
      <feComponentTransfer><feFuncR type="linear" intercept="-0.55"/><feFuncG type="linear" intercept="-0.55"/><feFuncB type="linear" intercept="-0.55"/></feComponentTransfer>
      <feGaussianBlur class="bloom"/><feComposite in2="taped" operator="arithmetic" k2="0.149" k3="0.93" k4="0.037"/>
    </filter></svg>`);
  const $ = (sel) => document.querySelector(sel);
  const BLOTCH = [3, 11, 7, 19, 5, 13], STATIC = [2, 17, 9, 23, 4, 29];

  await Promise.all(['100px "Archivo Black"', 'italic 700 100px "Arimo"', '300 50px "Antonio"', '600 50px "Antonio"', 'italic 700 50px "Tinos"'].map((f) => document.fonts.load(f)));
  const p = document.getElementById('p');
  const put = (html) => { p.insertAdjacentHTML('beforeend', html); return p.lastElementChild; };
  const place = (el, x, y, w, h) => Object.assign(el.style, { left: x + 'px', top: y + 'px', width: w + 'px', height: h + 'px' });
  const at = (el, x, y) => Object.assign(el.style, { left: x + 'px', top: y + 'px' });

  const mc = document.createElement('canvas').getContext('2d');
  function ink(text, font, ls) {
    mc.font = font.replace('SIZE', '200px'); mc.letterSpacing = ls * 200 + 'px';
    const m = mc.measureText(text), k = 1 / 200;
    return { l: -m.actualBoundingBoxLeft * k, r: m.actualBoundingBoxRight * k - ls, cap: mc.measureText('H').actualBoundingBoxAscent * k,
             asc: m.fontBoundingBoxAscent * k, desc: m.fontBoundingBoxDescent * k };
  }
  function set(cls, text, font, ls, size, x, y, skew, tag = 'div') {
    const i = ink(text, font, ls), el = put(`<${tag} class="t ${cls}">${text}</${tag}>`);
    const base = (1 - (i.asc + i.desc)) / 2 + i.asc;
    Object.assign(el.style, { fontSize: size + 'px', left: x - i.l * size + 'px', top: y - base * size + 'px' });
    if (skew) Object.assign(el.style, { transformOrigin: `0 ${base * size}px`, transform: 'skewX(-9deg)' });
    return el;
  }
  const HEAD = 'SIZE "Archivo Black"', SUB = 'italic 700 SIZE "Arimo"';
  const width = (text, font, ls) => { const i = ink(text, font, ls); return i.r - i.l; };
  const headW = (t) => width(t, HEAD, -0.05) + ink(t, HEAD, -0.05).cap * TAN9;
  const subW = (t) => width(t, SUB, -0.04);
  const HCAP = ink('H', HEAD, -0.05).cap, SCAP = ink('H', SUB, -0.04).cap;

  // ---- what moves ----
  let movers = [];
  const ease = (q) => q * q * (3 - 2 * q);
  const lerp = (a, b, q) => a + (b - a) * q;
  const twinkle = (path, delay) => movers.push((t) => {
    const ph = ((t + delay) / 2.4) % 1, q = ease(ph < 0.5 ? ph * 2 : 2 - ph * 2);
    path.style.transform = `scale(${lerp(0.55, 1, q)}) rotate(${lerp(-10, 12, q)}deg)`; path.style.opacity = lerp(0.75, 1, q);
  });
  const JOLT = [[0, 1, 0], [0.12, 1.18, -5], [0.26, 0.96, 3], [0.4, 1.08, -2], [0.55, 1, 0], [1, 1, 0]];
  const jolt = (el, period) => movers.push((t) => {
    const ph = (t / period) % 1, i = JOLT.findIndex(([w], n) => ph < JOLT[n + 1]?.[0]), [w0, s0, r0] = JOLT[i], [w1, s1, r1] = JOLT[i + 1];
    const q = ease((ph - w0) / (w1 - w0));
    el.style.transform = `skewX(-8deg) scale(${lerp(s0, s1, q)}) rotate(${lerp(r0, r1, q)}deg)`;
  });
  const glint = (cls, cx, cy, r) => {
    const el = put(`<div class="glint ${cls}" aria-hidden="true"><svg viewBox="-1 -1 2 2"><path d="${GLINT}"/></svg></div>`);
    place(el, cx - r, cy - r, r * 2, r * 2);
    twinkle(el.querySelector('path'), cls === 'b' ? 1.2 : 0);
    return el;
  };
  const oval = (size) => { const el = put('<div class="oval" aria-hidden="true"><span>As Seen On<br>Every Website</span></div>'); el.style.fontSize = size + 'px'; return el; };
  const cards = (x, top, w) => {
    const el = put('<div class="cards" aria-hidden="true"><i class="c1"><b>FREE</b></i><i class="c2"><b>Gratis</b></i><i class="c3"><b>$0.00</b></i><i class="c4"><b>NO CHARGE</b></i></div>');
    Object.assign(el.style, { left: x + 'px', top: top + 'px', transform: `scale(${w / 436})` });
    return el;
  };
  const card = (x, top, scale, turn = -3) => {
    const el = put('<div class="card" role="img" aria-label="The Internet (All Of It). Was 100%, now 70%."><div class="hd">The Internet (All Of It)</div><div class="ln">WAS: <s>100%</s></div><div class="ln">NOW:</div><div class="big">70%</div></div>');
    Object.assign(el.style, { left: x + 'px', top: top + 'px', transform: `scale(${scale}) rotate(${turn}deg)` });
    jolt(el.querySelector('.big'), 1.1);
    return el;
  };
  let globeFrames = null;
  const globe = (cx, cy, d) => {
    const k = d / 374, box = 480 * k, x = cx - 240 * k, y = cy - (47 + 187) * k;
    if (globeFrames) {
      const c = put('<canvas class="globe" aria-hidden="true"></canvas>'), dpr = Math.min(2, devicePixelRatio || 1);
      c.width = Math.round(box * dpr); c.height = Math.round(box * dpr); place(c, x, y, box, box);
      const g = c.getContext('2d'); let shown = -1;
      movers.push((t) => { const i = Math.floor(t * 15) % 60; if (i !== shown) { shown = i; g.clearRect(0, 0, c.width, c.height); g.drawImage(globeFrames[i], 0, 0, c.width, c.height); } });
    } else {
      place(put(`<img class="globe" alt="" src="${IMG.globe}">`), x, y, box, box);
    }
  };
  const glow = (cx, cy, d) => place(put('<div class="glow" aria-hidden="true"></div>'), cx - d * 1.3, cy - d * 1.45, d * 2.6, d * 2.9);

  // ---- one layout pass ----
  function build() {
    p.textContent = ''; movers = [];
    const W = p.clientWidth, H = p.clientHeight, tall = W / H < 0.95;
    const REF = tall ? [390, 844] : [1440, 900];
    const s = Math.min(W / REF[0], H / REF[1]);
    const fs = tall ? Math.min(W / 1080, H / 1920) * 1.6 : Math.min(W / 1280, H / 800);  // the filter's scale, as on the live page
    $('.soft').setAttribute('stdDeviation', `${1.25 * fs} ${0.5 * fs}`);
    $('.halo').setAttribute('stdDeviation', `${5 * fs} ${0.6 * fs}`);
    $('.smear').setAttribute('stdDeviation', `${10 * fs} ${1.6 * fs}`);
    $('.late').setAttribute('dx', 7 * fs); $('.late').setAttribute('dy', 1.7 * fs);
    $('.bloom').setAttribute('stdDeviation', 14 * fs);
    $('.blotch').setAttribute('baseFrequency', `${0.042 / fs} ${0.167 / fs}`);
    $('.static').setAttribute('baseFrequency', `${0.19 / fs} ${0.71 / fs}`);

    const m = (tall ? 18 : 44) * s;                                   // the side margin
    const tick = (tall ? 26 : 38) * s;                                // the ticker
    const footH = Math.max(tall ? 30 : 26, (tall ? 40 : 46) * s);     // the credits along the foot
    const footTop = H - footH;

    // ---- the cut: a line from the lower left up to the right, through the frame's working height ----
    const room = footTop - tick;
    const yL = tick + room * (tall ? 0.56 : 0.84), yR = tick + room * (tall ? 0.45 : 0.33);
    const a = Math.min(Math.atan((yL - yR) / W), (24 * Math.PI) / 180), TA = Math.tan(a), CA = Math.cos(a), SA = Math.sin(a);
    const cx0 = W / 2, cy0 = (yL + yR) / 2;
    const T = (tall ? 46 : 70) * s, NB = (tall ? 20 : 28) * s;       // the yellow tape's and the navy band's widths
    const line = (x) => cy0 - (x - cx0) * TA;                         // the tape's centre line at x
    const above = (x) => line(x) - T / 2 / CA;                        // its upper edge
    const below = (x) => line(x) + (T / 2 + NB) / CA;                 // the navy band's lower edge

    // the ground: the tiles, and beat two's darker side
    const tiles = put('<div class="tiles" aria-hidden="true"></div>');
    place(tiles, -W * 0.3, -H * 0.3, W * 1.6, H * 1.6);
    Object.assign(tiles.style, { backgroundImage: `url(${IMG.tile})`, backgroundSize: `${(tall ? 120 : 260) * s}px ${(tall ? 103 : 224) * s}px` });
    const dusk = put('<div class="dusk" aria-hidden="true"></div>');
    place(dusk, 0, 0, W, H);
    dusk.style.clipPath = `polygon(0 ${line(0)}px, ${W}px ${line(W)}px, ${W}px ${H}px, 0 ${H}px)`;

    (tall ? tallBeats : wideBeats)();

    // ---- beat one (wide): the globe large at the left, the headline beside it, all over the cut ----
    function wideBeats() {
      const top = tick + 24 * s;
      // the globe: as big as the room over the tape allows (the tape may cross its lower right)
      let d = Math.min(0.34 * W, 480 * s);
      for (; d > 160 * s; d -= 4 * s) { const gx = m + d * 0.5, gb = top + d; if (gb <= above(gx + d * 0.32) + d * 0.2) break; }
      const gcx = m + d * 0.5 - d * 0.02, gcy = top + d * 0.5 + 6 * s;
      glow(gcx, gcy, d * 1.25);
      // the headline: 30% OFF / EVERYTHING ON / THE INTERNET., left-aligned beside the globe, as wide as fits over the tape
      const x0 = gcx + d * 0.5 + 34 * s, maxW = W - m - 70 * s - x0;
      const stack = (w) => { const hs = w / headW('30% OFF'), l = (w * 0.985) / subW('EVERYTHING ON');
                             return { hs, l, h: HCAP * hs + 26 * s + SCAP * l + 14 * s + SCAP * l + 0.22 * l }; };
      let hw = maxW;
      for (; hw > 200 * s; hw -= 4 * s) if (top + 8 * s + stack(hw).h <= above(x0 + hw) - 22 * s) break;
      const st = stack(hw);
      const free = above(x0 + hw) - 22 * s - (top + 8 * s) - st.h;        // spare height over the tape
      let y = top + 8 * s + Math.max(0, free) * 0.45 + HCAP * st.hs;
      set('head', '30% OFF', HEAD, -0.05, st.hs, x0, y, true, 'h1');
      y += 26 * s + SCAP * st.l; set('sub', 'EVERYTHING ON', SUB, -0.04, st.l, x0, y, false, 'h2');
      y += 14 * s + SCAP * st.l; set('sub', 'THE INTERNET.', SUB, -0.04, st.l, x0, y);
      globe(gcx, gcy, d);
      const r = d / 2, o = oval(30 * s * Math.min(1.2, d / (400 * s)));
      at(o, gcx - r * 0.95 - 10 * s, gcy - r * 0.98 - o.offsetHeight * 0.2);
      glint('', gcx + r * 0.86, gcy - r * 0.8, d * 0.07);
      glint('b', x0 + hw * 0.98, top + 14 * s, d * 0.04);
      // the channel's bug, top right, over the cut
      const bw = 104 * s, bug = put(`<img class="bug" alt="" src="${IMG.logo}">`);
      place(bug, W - m * 0.7 - bw, tick + 16 * s, bw, bw * 610 / 1142);

      seam();

      // ---- beat two (wide): right-aligned down from the tape, at the frame's right ----
      const R = W - m, gap = 22 * s;
      const capEl = put('<div class="caption"><div class="tab">BUT WAIT…</div><div class="say"><span>THERE’S LESS!</span></div></div>');
      const ord = put(`<a class="order" href="${STORE}"><span class="lbl">ORDER NOW <b>✦</b> OPERATORS STANDING BY</span><span class="btn">ADD TO CHROME <i aria-hidden="true">→</i></span></a>`);
      // natural sizes at a font size of 100px, scaled down until beat two fits between the tape and the foot
      capEl.style.fontSize = '100px'; ord.style.fontSize = '100px';
      const C = { w: capEl.offsetWidth / 100, h: capEl.offsetHeight / 100 }, O = { w: ord.offsetWidth / 100, h: ord.offsetHeight / 100 };
      const plan = (k) => {
        const cf = 74 * s * k, of = 50 * s * k;                       // the caption's and the panel's type
        const cw = C.w * cf, ch = C.h * cf, ow = O.w * of, oh = O.h * of;
        const cy = below(R - cw) + gap;                                 // under the tape at the caption's left edge
        const oy = Math.max(cy + ch + oh * 0.42, below(R - ow) + gap);
        return { cf, of, cw, ch, ow, oh, cy, oy, bottom: oy + oh };
      };
      let k = 1.25;
      for (; k > 0.4; k -= 0.01) if (plan(k).bottom <= footTop - 26 * s) break;
      const P = plan(k);
      capEl.style.fontSize = P.cf + 'px'; at(capEl, R - P.cw, P.cy);
      ord.style.fontSize = P.of + 'px'; at(ord, R - P.ow, P.oy);
      // ACT NOW! on the panel's top right corner, pulsing
      const bd = P.oh * 1.05, bu = put('<div class="burst" aria-hidden="true"><span>ACT<br>NOW!</span></div>');
      bu.style.setProperty('--star', STAR);
      place(bu, R - bd * 0.5, P.oy - bd * 0.5, bd, bd); bu.style.fontSize = bd * 0.24 + 'px';
      movers.push((t) => { const ph = (t * 2) % 1; bu.style.transform = `rotate(${ph < 0.5 ? 8 : -4}deg) scale(${ph < 0.5 ? 1.08 : 1})`; });
      movers.push((t) => ord.classList.toggle('lit', (t * 2.5) % 1 < 0.5));
      // the price card: beat two's picture of less, left of the panel, standing on the foot
      const cardRight = R - P.ow - 34 * s, cardBottom = footTop - 18 * s;
      let cs = Math.min(0.75 * s * k, (cardBottom - (P.cy + P.ch * 0.4)) / 372);
      for (; cs > 0.25 * s; cs -= 0.01 * s) if (cardBottom - 372 * cs >= below(cardRight - 410 * cs) + gap) break;
      if (cs > 0.3 * s) card(cardRight - 400 * cs, cardBottom - 360 * cs, cs, -3);
      // the free cards and No purchase necessary! under the caption, left of the panel, if there is room
      const nf = 26 * s * k, nw = subW('No purchase necessary!') * nf;
      const ny = P.cy + P.ch + 10 * s;
      if (ny + nf * 1.2 < P.oy - 4 * s) set('sub', 'No purchase necessary!', SUB, -0.04, nf, R - nw - 6 * s, ny + SCAP * nf);
      // the left foot, under the tape: the free cards, as far as they go
      const fw = Math.min(380 * s, (cardRight - 410 * cs) - m - 30 * s), fh = 62 * fw / 436, fy = footTop - 18 * s - fh;
      if (fw > 160 * s && fy >= below(m) + gap) cards(m, fy, fw);
    }

    // ---- tall (phones): beat one on top, left-aligned; the tape; beat two right-aligned under it ----
    function tallBeats() {
      const top = tick + 20 * s, cw = W - 2 * m;
      // the headline across the width
      const hs = (cw * 0.97) / headW('30% OFF'), l = (cw * 0.985) / subW('EVERYTHING ON');
      let y = top + HCAP * hs;
      const hh = HCAP * hs + 14 * s + SCAP * l + 8 * s + SCAP * l + 0.2 * l;
      // the globe in what is left over the tape, its lower part under it
      const gTop = top + hh + 12 * s;
      let d = cw * 0.9;
      for (; d > 80 * s; d -= 2 * s) if (gTop + d <= above(W * 0.38) + d * 0.22) break;
      const gcx = W * 0.4, gcy = gTop + d / 2;
      glow(gcx, gcy, d * 1.25);
      globe(gcx, gcy, d);
      set('head', '30% OFF', HEAD, -0.05, hs, m, y, true, 'h1');
      y += 14 * s + SCAP * l; set('sub', 'EVERYTHING ON', SUB, -0.04, l, m, y, false, 'h2');
      y += 8 * s + SCAP * l; set('sub', 'THE INTERNET.', SUB, -0.04, l, m, y);
      const r = d / 2, o = oval(17 * s);
      at(o, Math.min(W - m - o.offsetWidth, gcx + r * 0.55), gcy - r * 0.4);
      glint('', gcx - r * 0.85, gcy - r * 0.7, d * 0.08);
      glint('b', W - m - 8 * s, top + HCAP * hs * 0.2, d * 0.05);

      seam();

      const R = W - m, gap = 14 * s;
      const capEl = put('<div class="caption"><div class="tab">BUT WAIT…</div><div class="say"><span>THERE’S LESS!</span></div></div>');
      const ord = put(`<a class="order" href="${STORE}"><span class="lbl">ORDER NOW <b>✦</b> OPERATORS STANDING BY</span><span class="btn">ADD TO CHROME <i aria-hidden="true">→</i></span></a>`);
      capEl.style.fontSize = '100px'; ord.style.fontSize = '100px';
      const C = { w: capEl.offsetWidth / 100, h: capEl.offsetHeight / 100 }, O = { w: ord.offsetWidth / 100, h: ord.offsetHeight / 100 };
      const cf = Math.min((cw * 0.84) / C.w, 44 * s), of = Math.min(cw / O.w, 40 * s);
      const cwid = C.w * cf, ch = C.h * cf, ow = O.w * of, oh = O.h * of;
      const cy = below(R - cwid) + gap;
      capEl.style.fontSize = cf + 'px'; at(capEl, R - cwid, cy);
      const oy = footTop - 16 * s - oh;
      ord.style.fontSize = of + 'px'; at(ord, R - ow, oy);
      // between the caption and the panel: the price card at the left, the free cards
      const midTop = cy + ch + 14 * s, midBot = oy - 18 * s;
      let cs = Math.min((midBot - midTop) / 372, (cw * 0.6) / 410);
      if (cs > 0.22) card(m + 4 * s, midTop + 10 * s, cs, -3);
      const cardsW = cw - 400 * cs - 20 * s;
      const nf = 15 * s, nw = subW('No purchase necessary!') * nf;
      if (cs > 0.22 && cardsW > 120 * s) {
        const cx1 = m + 410 * cs + 14 * s, cwd = R - cx1;
        // two rows of two: the cards set narrower
        cards(cx1, midTop + 30 * s, cwd);
      }
      const bd = oh * 0.95, bu = put('<div class="burst" aria-hidden="true"><span>ACT<br>NOW!</span></div>');
      bu.style.setProperty('--star', STAR);
      place(bu, R - bd * 0.7, oy - bd * 0.6, bd, bd); bu.style.fontSize = bd * 0.24 + 'px';
      movers.push((t) => { const ph = (t * 2) % 1; bu.style.transform = `rotate(${ph < 0.5 ? 8 : -4}deg) scale(${ph < 0.5 ? 1.08 : 1})`; });
      movers.push((t) => ord.classList.toggle('lit', (t * 2.5) % 1 < 0.5));
    }

    // ---- the tape and its band, laid along the cut ----
    function seam() {
      const len = Math.hypot(W, H) * 1.5, deg = (-a * 180) / Math.PI;
      const band = put(`<div class="band" aria-hidden="true"><span>${BAND.repeat(14)}</span></div>`);
      const off = T / 2 + NB / 2 - 1;
      place(band, cx0 + SA * off - len / 2, cy0 + CA * off - NB / 2, len, NB);
      Object.assign(band.style, { transform: `rotate(${deg}deg)`, fontSize: NB * 0.56 + 'px' });
      const tape = put(`<div class="seam" role="img" aria-label="Black Friday only!"><span>${SEAM.repeat(24)}</span></div>`);
      place(tape, cx0 - len / 2, cy0 - T / 2, len, T);
      Object.assign(tape.style, { transform: `rotate(${deg}deg)`, fontSize: T * 0.56 + 'px',
                                  boxShadow: `inset 0 ${3 * s}px 0 rgba(170,158,0,0.6), inset 0 ${-3 * s}px 0 rgba(170,158,0,0.6), 0 ${-8 * s}px ${14 * s}px rgba(6,8,70,0.35)` });
      const ts = tape.firstElementChild, bs = band.firstElementChild, tRep = ts.offsetWidth / 24, bRep = bs.offsetWidth / 14;
      movers.push((t) => {
        ts.style.transform = `translateX(${-((t * T * 2.2) % tRep)}px) skewX(-9deg)`;
        bs.style.transform = `translateX(${-bRep + ((t * NB * 3) % bRep)}px)`;
      });
    }

    // ---- the ticker along the top, with the ON AIR bug ----
    const tk = put(`<div class="ticker" aria-hidden="true"><span>${TICKER.repeat(6)}</span></div>`);
    Object.assign(tk.style, { height: tick + 'px', fontSize: tick * 0.66 + 'px', lineHeight: tick + 'px' });
    const air = put('<div class="onair" aria-hidden="true"><b></b>ON AIR</div>');
    Object.assign(air.style, { left: 0, top: 0, height: tick + 'px' }); air.style.fontSize = tick * 0.5 + 'px';
    const dot = air.firstElementChild;
    movers.push((t) => { dot.style.opacity = (t % 1) < 0.6 ? 1 : 0.15; });
    const tks = tk.firstElementChild, tkRep = tks.offsetWidth / 6;
    movers.push((t) => { tks.style.transform = `translateX(${-(((t + 3) * tick * 1.5) % tkRep)}px)`; });

    // ---- the credits along the foot ----
    const byF = footH * 0.36;
    const by = put(`<div class="by"><span class="item">ITEM # 30-OFF</span><span class="gme">Brought to you by Gary Mustard Enterprises</span><span class="sep" aria-hidden="true">✦</span><a href="${GARRETT}">Garrett Musar</a><span class="sep" aria-hidden="true">✦</span><a href="${AUFBAU}">Aufbau</a></div>`);
    Object.assign(by.style, { height: footH + 'px', fontSize: byF + 'px', top: 'auto', width: 'auto' });
    by.style.justifyContent = 'flex-start';
    const byW = () => by.lastElementChild.getBoundingClientRect().right;   // where the credits end, set from the left
    if (byW() > W * 0.94) by.querySelector('.item').remove();
    if (byW() > W * 0.94) by.querySelector('.gme').textContent = 'Gary Mustard Enterprises';
    if (byW() > W * 0.94) by.style.fontSize = (byF * W * 0.92) / byW() + 'px';
    by.style.justifyContent = '';

    render(clock());
  }

  // ---- the clock ----
  const t0 = performance.now(), clock = () => (still ? 0 : Math.floor(((performance.now() - t0) / 1000) * FPS) / FPS);
  const blotch = $('.blotch'), grain = $('.static');
  function render(t) {
    for (const move of movers) move(t);
    const f = Math.round(t * FPS); blotch.setAttribute('seed', BLOTCH[Math.floor(f / 4) % 6]); grain.setAttribute('seed', STATIC[Math.floor(f / 2) % 6]);
  }

  build();
  let pending = 0;
  addEventListener('resize', () => { cancelAnimationFrame(pending); pending = requestAnimationFrame(build); });
  if (!still) {
    let last = -1;
    const frame = () => { const t = clock(); if (t !== last) { last = t; render(t); } requestAnimationFrame(frame); };
    requestAnimationFrame(frame);
    if ('ImageDecoder' in window) (async () => {
      try {
        const dec = new ImageDecoder({ data: await (await fetch(IMG.globe)).arrayBuffer(), type: 'image/webp' });
        await dec.tracks.ready;
        const n = dec.tracks.selectedTrack.frameCount, frames = [];
        for (let i = 0; i < n; i++) { const { image } = await dec.decode({ frameIndex: i }); frames.push(await createImageBitmap(image)); image.close(); }
        dec.close();
        if (n === 60) { globeFrames = frames; build(); }
      } catch {}
    })();
  }

  const frameRate = () => new Promise((resolve) => {
    let frames = 0, drawing = 0, last = 0;
    const tick = (now) => { const gap = now - last; if (last && gap < 1000) { frames++; drawing += gap; } last = now; if (drawing < 2000) requestAnimationFrame(tick); else resolve((frames * 1000) / drawing); };
    requestAnimationFrame(tick);
  });
  if (!still && !query.has('keep')) {
    await new Promise((r) => setTimeout(r, 1200));
    const withLook = await frameRate();
    if (withLook < 24) {
      p.style.filter = 'none';
      if ((await frameRate()) < withLook * 1.5) p.style.removeProperty('filter');
    }
  }
})();
</script>
</body>
</html>
