<title>Black Friday Banner Lineup</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600&display=swap">
<style>
  /* Layout: one control bar, then the chosen banner shown on a real-looking page, then a line on what it is. */
  :root {
    --bg: #eef0f6; --panel: #ffffff; --ink: #12142a; --muted: #5a5f78; --line: #d5d9e6;
    --accent: #0a22d6; --accent-ink: #ffffff; --chrome: #dfe2ec;
    --display: "Archivo Black", "Arial Black", Arial, sans-serif;
    --body: "Inter", "Helvetica Neue", Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg: #0d0f1c; --panel: #171a2e; --ink: #eef0fa; --muted: #9aa0bd; --line: #2b2f4a;
    --accent: #3a5bff; --accent-ink: #ffffff; --chrome: #23263d; color-scheme: dark } }
  :root[data-theme="dark"] {
    --bg: #0d0f1c; --panel: #171a2e; --ink: #eef0fa; --muted: #9aa0bd; --line: #2b2f4a;
    --accent: #3a5bff; --accent-ink: #ffffff; --chrome: #23263d; color-scheme: dark }

  body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--body); }
  .wrap {
    max-width: 1120px; margin: 0 auto; display: grid; gap: 20px;
    padding-block: 24px 40px;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  h1 { font: 400 clamp(22px, 3.2vw, 30px)/1.1 var(--display); letter-spacing: -0.01em; text-wrap: balance; margin: 0; }
  .controls { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; }
  .group { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .label { font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  .seg { display: inline-flex; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 3px; gap: 2px; flex-wrap: wrap; }
  .seg button {
    font: 500 14px/1 var(--body); color: var(--ink); background: transparent; border: 0; border-radius: 999px;
    padding: 9px 14px; cursor: pointer; white-space: nowrap;
  }
  .seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
  .seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .stage { display: grid; place-items: center; }

  /* the desktop: a browser window at 1280 x 800, the banner down the right 30% */
  .browser { width: 100%; max-width: 1120px; border-radius: 10px; overflow: hidden; border: 1px solid var(--line); background: var(--chrome); box-shadow: 0 12px 40px rgba(10, 16, 60, 0.18); }
  .browser .bar { height: 30px; display: flex; align-items: center; gap: 7px; padding: 0 12px; }
  .browser .bar i { width: 11px; height: 11px; border-radius: 50%; background: var(--line); display: block; }
  .screen { position: relative; overflow: hidden; background: #fff; }
  .browser .screen { aspect-ratio: 1280 / 800; }
  .screen > img { position: absolute; display: block; max-width: none; }
  .screen .page { inset: 0; width: 100%; height: 100%; }
  .browser .banner { top: 0; right: 0; width: 30%; height: 100%; }

  /* the phone: 390 x 844, the banner across the top third */
  .phone { height: min(76vh, 760px); aspect-ratio: 390 / 844; max-width: 100%; border-radius: 38px; padding: 12px; background: #0b0c12; box-shadow: 0 12px 40px rgba(10, 16, 60, 0.25); }
  .phone .screen { width: 100%; height: 100%; border-radius: 28px; }
  .phone .banner { top: 0; left: 0; width: 100%; height: 33%; }
  .banner { image-rendering: auto; }
  .banner.pixel { image-rendering: pixelated; }

  .note { max-width: 65ch; color: var(--muted); margin: 0; }
  .note b { color: var(--ink); font-weight: 600; }
</style>

<div class="wrap">
  <h1>30% Off Everything: banner lineup</h1>

  <div class="controls">
    <div class="group" role="group" aria-labelledby="l-banner">
      <span class="label" id="l-banner">Banner</span>
      <div class="seg" id="banner-seg">
        <button type="button" id="b-v17" data-banner="v17">v1.7, tidied</button>
        <button type="button" id="b-8bit" data-banner="8bit">8-bit</button>
        <button type="button" id="b-tv" data-banner="tv">Channel, newest</button>
      </div>
    </div>
    <div class="group" role="group" aria-labelledby="l-screen">
      <span class="label" id="l-screen">Screen</span>
      <div class="seg" id="screen-seg">
        <button type="button" id="s-desktop" data-screen="desktop">Desktop</button>
        <button type="button" id="s-phone" data-screen="phone">Phone</button>
      </div>
    </div>
  </div>

  <div class="stage" id="stage"></div>

  <p class="note" id="note"></p>
</div>

<script>
  const BANNERS = {
    v17: { pixel: false, note: '<b>v1.7, tidied.</b> The banner that went to the store as 1.7, with the Gary Mustard Enterprises logo taken off the top and the four cards removed. Recorded from the extension itself.' },
    '8bit': { pixel: true, note: '<b>8-bit.</b> The animated-GIF version: the globe hovering on its chrome column, the coupon edge with gold trim, and the yellow strip with the Gary Mustard Enterprises sub-banner on desktop.' },
    tv: { pixel: false, note: '<b>Channel, newest.</b> The same layout as the 8-bit one, drawn in the old Channel look: smooth chrome, heavy italic type, no tape grain.' },
  };
  const state = { banner: 'v17', screen: 'desktop' };

  function readHash() {
    const m = /^#(v17|8bit|tv)-(desktop|phone)$/.exec(location.hash);
    if (m) { state.banner = m[1]; state.screen = m[2]; }
  }

  function render() {
    const { banner, screen } = state;
    const b = BANNERS[banner];
    const page = `<img class="page" alt="" src="media/page-${screen}.jpg">`;
    const art = `<img class="banner${b.pixel ? ' pixel' : ''}" alt="The ${banner} banner on ${screen}" src="media/${banner}-${screen}.webp">`;
    document.getElementById('stage').innerHTML = screen === 'desktop'
      ? `<div class="browser"><div class="bar"><i></i><i></i><i></i></div><div class="screen">${page}${art}</div></div>`
      : `<div class="phone"><div class="screen">${page}${art}</div></div>`;
    document.getElementById('note').innerHTML = b.note;
    for (const el of document.querySelectorAll('[data-banner]')) el.setAttribute('aria-pressed', String(el.dataset.banner === banner));
    for (const el of document.querySelectorAll('[data-screen]')) el.setAttribute('aria-pressed', String(el.dataset.screen === screen));
    const hash = `#${banner}-${screen}`;
    if (location.hash !== hash) history.replaceState(null, '', hash);
  }

  document.getElementById('banner-seg').addEventListener('click', (e) => {
    const b = e.target.closest('[data-banner]'); if (!b) return; state.banner = b.dataset.banner; render();
  });
  document.getElementById('screen-seg').addEventListener('click', (e) => {
    const s = e.target.closest('[data-screen]'); if (!s) return; state.screen = s.dataset.screen; render();
  });
  window.addEventListener('hashchange', () => { readHash(); render(); });

  // warm the cache so switching is instant
  for (const k of Object.keys(BANNERS)) for (const s of ['desktop', 'phone']) { const i = new Image(); i.src = `media/${k}-${s}.webp`; }

  readHash();
  render();
</script>
