<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Black Friday, 6:00</title>
<link rel="stylesheet" href="./fonts.css">
<link rel="stylesheet" href="./gme-x-lockscreen.css">
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script>
</head>
<body>
<div id="stage">
  <!-- the wallpaper: A4's sky -->
  <div class="sky"></div>
  <div class="halo" id="halo"></div>

  <!-- status bar -->
  <header class="status" id="status">
    <div class="carrier"><i class="bars"><b></b><b></b><b></b><b></b></i><span>GME</span></div>
    <div class="right"><svg class="wifi" viewBox="0 0 24 18"><path d="M12 17.2 8.6 13.4a5 5 0 0 1 6.8 0zM5.3 10.1a9.7 9.7 0 0 1 13.4 0l-1.9 2.1a7 7 0 0 0-9.6 0zM2 6.7a14.4 14.4 0 0 1 20 0l-1.9 2.1a11.6 11.6 0 0 0-16.2 0z" fill="currentColor"/></svg><span class="pct">70%</span><i class="batt"><b></b></i></div>
  </header>

  <svg class="lock" id="lock" viewBox="0 0 24 30"><path d="M6.5 13V9a5.5 5.5 0 0 1 11 0v4" fill="none" stroke="currentColor" stroke-width="2.6"/><rect x="3" y="13" width="18" height="15" rx="3.2" fill="currentColor"/></svg>
  <div class="date" id="date"></div>
  <div class="clock" id="clock">6:00</div>

  <!-- the specimen, in front of the clock (depth effect) -->
  <canvas id="gl"></canvas>
  <div id="glint"></div>
  <svg class="leaders" id="leaders"></svg>
  <div class="label" id="lab-core"></div>
  <div class="label fig" id="lab-fig"></div>

  <!-- the sale -->
  <div class="sale" id="sale">
    <div class="bf" id="bf"></div>
    <div class="off-wrap"><div class="off glow" id="off-glow"></div><div class="off" id="off"></div></div>
  </div>

  <!-- live activity: the scroll, on GME paper -->
  <div class="live" id="live">
    <i class="live-mark"></i>
    <div class="band"><div class="win"><div class="track" id="track"></div></div></div>
    <div class="ends" id="ends"><small>Ends in</small><b id="count">23:59:59</b></div>
  </div>

  <!-- notifications -->
  <div class="notifs" id="notifs"></div>

  <!-- lock screen foot -->
  <footer class="foot" id="foot">
    <i class="btn torch"><svg viewBox="0 0 24 24"><path d="M8 2h8v4l-2 4v11a2 2 0 0 1-4 0V10L8 6z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="12" cy="13.5" r="1.3" fill="currentColor"/></svg></i>
    <p class="swipe" id="swipe"></p>
    <i class="btn cam"><svg viewBox="0 0 24 24"><path d="M3 8a2 2 0 0 1 2-2h2.4l1.6-2h6l1.6 2H19a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="12" cy="12.5" r="3.6" fill="none" stroke="currentColor" stroke-width="1.8"/></svg></i>
    <i class="home"></i>
  </footer>

  <canvas id="dust"></canvas>
  <div class="grain" id="grain"></div>
</div>
<script type="module" src="./gme-x-lockscreen.js"></script>
</body>
</html>
