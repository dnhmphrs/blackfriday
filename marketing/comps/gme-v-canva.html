<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Black Friday Post</title>
<link rel="stylesheet" href="./fonts.css">
<link rel="stylesheet" href="./gme-v-canva.css">
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script>
</head>
<body>
<div id="stage">
  <div class="bg" id="bg"></div>
  <div class="rays" id="rays"></div>
  <div class="halo" id="halo"></div>
  <div class="sparks back" id="sparks-back"></div>

  <div class="logo" id="logo"></div>
  <h1 class="bf" id="bf"><span class="l" id="bf1">BLACK</span><span class="l" id="bf2">FRIDAY</span></h1>

  <canvas id="gl"></canvas>

  <div class="sparks front" id="sparks-front"></div>

  <div class="ticker" id="ticker"><div class="run" id="run"></div></div>

  <div class="burst" id="burst">
    <svg viewBox="-1.1 -1.1 2.2 2.2"><polygon class="b0" id="b0"/><polygon class="b1" id="b1"/><polygon class="b2" id="b2"/></svg>
    <div class="burst-txt" id="burst-txt"></div>
  </div>

  <div class="sticker" id="sticker">
    <svg viewBox="-1.15 -1.15 2.3 2.3">
      <defs>
        <linearGradient id="sg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00d4ff"/><stop offset="0.5" stop-color="#1a5cff"/><stop offset="1" stop-color="#3a10e0"/></linearGradient>
        <linearGradient id="shine" x1="0" y1="0" x2="1" y2="1"><stop offset="0.18" stop-color="#fff" stop-opacity="0"/><stop offset="0.3" stop-color="#fff" stop-opacity="0.38"/><stop offset="0.4" stop-color="#fff" stop-opacity="0"/></linearGradient>
        <linearGradient id="backg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="0.6" stop-color="#e4e6ea"/><stop offset="1" stop-color="#b9bcc4"/></linearGradient>
        <linearGradient id="lift" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.32"/></linearGradient>
        <clipPath id="sclip"><path id="sclip-path"/></clipPath>
      </defs>
      <g clip-path="url(#sclip)">
        <circle r="1" fill="url(#sg)"/>
        <circle r="0.9" fill="none" stroke="#fff" stroke-width="0.035" stroke-dasharray="0.06 0.05" opacity="0.85"/>
        <circle r="1" fill="url(#shine)"/>
        <rect id="lift-rect" x="-1.2" y="-1.2" width="2.4" height="2.4" fill="url(#lift)"/>
      </g>
      <path id="flap" fill="url(#backg)"/>
    </svg>
    <div class="sticker-txt" id="sticker-txt"><b>30%</b><i>OFF</i><small>EVERYTHING</small></div>
  </div>

  <div class="off" id="off">
    <span class="o0" id="o0"></span><span class="o1" id="o1"></span><span class="o2" id="o2"></span>
  </div>
  <div class="scope" id="scope"><span id="scope-txt"></span></div>
  <div class="foot" id="foot"></div>
</div>
<script type="module" src="./gme-v-canva.js"></script>
</body>
</html>
