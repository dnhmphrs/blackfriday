<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Neon Sale Sign</title>
<link rel="stylesheet" href="./fonts.css">
<link rel="stylesheet" href="./gme-bf-neon.css">
</head>
<body>
<div id="stage">
  <canvas id="room"></canvas>
  <div class="glass">
    <div class="leaf" id="leaf"><i class="mark"></i><p id="leaf-line"></p></div>
    <div class="sheen"></div>
    <div class="sticker" id="sticker">
      <i class="mark"></i>
      <p class="s1" id="st-1"></p>
      <p class="s2" id="st-2"></p>
    </div>
  </div>
  <canvas id="ledge"></canvas>
  <div class="card" id="card">
    <p class="k1" id="cd-1"></p>
    <p class="k2" id="cd-2"></p>
    <p class="k3" id="cd-3"></p>
  </div>
  <p class="lip" id="lip"></p>
  <div class="grain" id="grain"></div>
</div>
<script type="module" src="./gme-bf-neon.js"></script>
</body>
</html>
