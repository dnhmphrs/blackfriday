<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>30% Off EVERYTHING</title>
<meta name="description" content="A Black Friday treat for your browser: 30% off every website you visit. Black Friday only.">
<link rel="icon" href="{{img:favicon}}">
<!-- Variant "there-is-less": the page as one frame of a late-night spot that leads with the joke.
     Read in this order:
       1. BUT WAIT… THERE'S LESS!   the pitchman's line, the headline, as big as the frame allows
       2. the price card             The Internet (All Of It) WAS 100% NOW 70%: the proof, large and central
       3. ADD TO CHROME              the order panel (operators standing by), the one link to the store
     The offer itself is demoted to a lower-third strap (30% OFF EVERYTHING ON THE INTERNET.) with BLACK
     FRIDAY ONLY! as its tag, so the two lines the page loves are a set-up and its explanation rather
     than two headlines. Everything that moves runs off one clock at 25 frames a second. -->
<style>
{{fonts}}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; background: #070f9c; }
body { -webkit-font-smoothing: antialiased; }
#p { position: fixed; inset: 0; overflow: hidden; background: linear-gradient(#0a1cc4, #0a22d6 45%, #070f9c); filter: url(#tape);
     --yellow: #fff035; --shade: #0a0f66; --red: #ff1616; user-select: none; }
#p > * { position: absolute; display: block; max-width: none; z-index: 1; }
#p > .tiles, #p > .glow, #p > .beam { z-index: 0; }
#p img { -webkit-user-drag: none; }
.defs { position: absolute; width: 0; height: 0; }
.lines { position: fixed; inset: 0; pointer-events: none; z-index: 2;
         background: repeating-linear-gradient(rgba(0, 0, 16, 0) 0, rgba(0, 0, 16, 0.05) 1.5px, rgba(0, 0, 16, 0) 3px),
                     radial-gradient(farthest-corner at 50% 50%, rgba(0, 0, 0, 0) 0%, rgba(0, 0, 0, 0.03) 50%, rgba(0, 0, 0, 0.08) 71%, rgba(0, 0, 0, 0.13) 85%, rgba(0, 0, 0, 0.21) 100%); }

.glow { border-radius: 50%; background: radial-gradient(closest-side, #58c4ff 0%, #2a8cff 22%, #1348ee 44%, transparent 72%); }
.tiles { background-repeat: repeat; opacity: 0.095; transform: rotate(-6deg); }
/* the spotlight behind the headline */
.beam { background: radial-gradient(closest-side, rgba(120, 200, 255, 0.55), rgba(42, 140, 255, 0.25) 45%, transparent 100%); border-radius: 50%; }

.t { white-space: nowrap; line-height: 1; }
.head { font-family: "Archivo Black", "Arial Black", sans-serif; color: var(--yellow); letter-spacing: -0.05em;
        text-shadow: 0.009em 0.009em 0 var(--shade), 0.018em 0.018em 0 var(--shade), 0.027em 0.027em 0 var(--shade),
                     0.036em 0.036em 0 var(--shade), 0.045em 0.045em 0 var(--shade), 0.054em 0.054em 0 var(--shade); }
.sub { font: italic 700 1em "Arimo", Arial, sans-serif; letter-spacing: -0.04em;
       background: linear-gradient(#fff 35%, #c5d4fb 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
       filter: drop-shadow(0.045em 0.045em 0 rgba(6, 8, 70, 0.95)); padding: 0 0.1em 0.06em 0; }

.glint svg { display: block; width: 100%; height: 100%; overflow: visible; fill: #fff; }
.glint path { filter: drop-shadow(0 0 0.08px #fff) drop-shadow(0 0 0.22px #9fd4ff); transform-box: fill-box; transform-origin: center; }

.ticker, .crawl { left: 0; right: 0; overflow: hidden; white-space: nowrap; pointer-events: none; }
.ticker { top: 0; font-family: "Antonio", "Arial Narrow", sans-serif; font-weight: 300; letter-spacing: 0.035em; word-spacing: 0.3em;
          color: #e9f0ff; text-shadow: 0.06em 0.06em 0 rgba(4, 8, 80, 0.85); background: rgba(4, 8, 90, 0.35); }
.ticker span { display: inline-block; }
.crawl { bottom: 0; font-family: "Archivo Black", "Arial Black", sans-serif; color: var(--yellow); letter-spacing: -0.02em; word-spacing: 0.08em; background: #111; }
.crawl span { display: inline-block; text-shadow: 0.04em 0.04em 0 #7a0006; }

/* ON AIR: the channel's bug, at the head of the ticker */
.bug { display: flex !important; align-items: center; gap: 0.32em; background: var(--red); color: #fff; font: 600 1em/1 "Antonio", "Arial Narrow", sans-serif;
       letter-spacing: 0.1em; padding: 0 0.6em 0 0.5em; z-index: 2; box-shadow: 0.1em 0 0 #000; }
.bug i { width: 0.5em; height: 0.5em; border-radius: 50%; background: #fff; display: block; }
.bug i.off { background: #7a0006; }

/* the credits: a flat navy bar over the crawl */
.by { display: flex !important; align-items: center; justify-content: center; white-space: nowrap; background: var(--shade); color: #fff;
      font: italic 700 1em/1 "Arimo", Arial, sans-serif; letter-spacing: 0.08em; text-transform: uppercase; border-top: 0.12em solid var(--yellow); }
.by .logo { height: 1.9em; width: auto; margin-right: 0.9em; position: static; }
.by .sep { margin: 0 0.9em; color: var(--yellow); }
.by.two { flex-direction: column; gap: 0.4em; }
.by.two .sep.first { display: none; }
.by a { color: #fff; text-decoration: none; border-bottom: 0.12em solid var(--yellow); padding-bottom: 0.05em; }
.by a:hover, .by a:focus-visible { color: var(--yellow); outline: none; }

/* the price card (the proof); only its 70% moves */
.card { width: 400px; height: 306px; background: #f3f4f6; color: #0c0c0c; border: 5px solid #000; box-shadow: 10px 10px 0 rgba(4, 6, 60, 0.92);
        transform-origin: left top; font: italic 700 50px/1 "Arimo", Arial, sans-serif; }
.card .hd { background: var(--red); color: #fff46a; font: 600 41px/57px "Antonio", "Arial Narrow", sans-serif; padding: 0 15px; border-bottom: 5px solid #000; white-space: nowrap; overflow: hidden; }
.card .ln { padding: 13px 17px 0; }
.card s { position: relative; text-decoration: none; color: #6b6f78; margin-left: 9px; }
.card s::after { content: ""; position: absolute; left: -8%; right: -8%; top: 46%; height: 8px; background: var(--red); transform: rotate(-11deg); box-shadow: 0 0 0 2px #000; }
.card .big { position: absolute; right: 9px; bottom: -54px; font: 400 165px/0.9 "Archivo Black", "Arial Black", sans-serif; color: var(--red); letter-spacing: -0.05em;
             -webkit-text-stroke: 11px #000; paint-order: stroke fill; transform: skewX(-8deg); transform-origin: 70% 80%; }

/* the lower third: the offer as a strap, ITEM # tab on it, BLACK FRIDAY ONLY! as its tag */
.strap { display: flex !important; align-items: center; white-space: nowrap; background: linear-gradient(#ffffff, #dde4fa); color: var(--shade);
         font: italic 700 1em/1 "Arimo", Arial, sans-serif; letter-spacing: -0.02em; padding: 0 0.55em; border-left: 0.32em solid var(--red);
         box-shadow: 0.14em 0.14em 0 rgba(6, 8, 70, 0.9); }
.strap.two { flex-direction: column; align-items: flex-start; justify-content: center; gap: 0.14em; }
.strap b { color: var(--red); font: 400 1.08em/1 "Archivo Black", "Arial Black", sans-serif; letter-spacing: -0.03em; margin-right: 0.3em; }
.strap.two b { margin-right: 0; }
.item { display: flex !important; align-items: center; background: var(--shade); color: var(--yellow); font: 600 1em/1 "Antonio", "Arial Narrow", sans-serif;
        letter-spacing: 0.1em; padding: 0 0.6em; white-space: nowrap; }
.item b { color: #fff; font-weight: 600; margin-left: 0.4em; }
.tag { display: inline-block !important; white-space: nowrap; background: var(--red); color: var(--yellow); border: 0.07em solid #000;
       font: 400 1em/1 "Archivo Black", "Arial Black", sans-serif; letter-spacing: -0.01em; padding: 0.2em 0.42em 0.24em;
       box-shadow: 0.12em 0.12em 0 rgba(6, 8, 70, 0.9); transform: rotate(-3deg); transform-origin: center; text-shadow: 0.05em 0.05em 0 #7a0006; }

/* the As Seen On badge and the four cards */
.oval { width: 7.6em; height: 3.31em; border-radius: 50%; display: grid !important; place-items: center; text-align: center;
        font: italic 700 1em/0.98 "Tinos", "Times New Roman", serif; background: radial-gradient(ellipse at 40% 30%, #fffc9a, #efe01c 72%); color: #151515;
        transform: rotate(-7deg); box-shadow: 0.143em 0.167em 0 rgba(6, 8, 70, 0.9), inset 0 0 0 0.095em rgba(170, 158, 0, 0.5); }
.cards { display: flex !important; gap: 12px; width: 436px; transform-origin: left top; font: italic 700 19px/1 "Arimo", Arial, sans-serif; letter-spacing: 0.02em; }
.cards i { flex: none; position: relative; display: block; width: 100px; height: 62px; border-radius: 7px; overflow: hidden; box-shadow: 3px 3px 0 rgba(6, 8, 70, 0.85); }
.cards b { position: absolute; left: 0; right: 0; bottom: 5px; text-align: center; }
.cards .c1 { background: linear-gradient(#f4f4f4 0 34%, #1c3fd1 34% 62%, #f1b400 62%); color: #111; }
.cards .c2 { background: radial-gradient(circle at 50% 40%, #ffb300 0 30%, transparent 31%), #f6f6f6; color: #111; }
.cards .c3 { background: linear-gradient(135deg, #7fd4ff, #2a79d8); color: #fff; }
.cards .c4 { background: linear-gradient(#151515, #3a2a00); color: #ffcf2e; }
.cards .c4 b { font-size: 14.5px; }

/* the starburst sticker */
.burst { display: grid !important; place-items: center; text-align: center; pointer-events: none; }
.burst svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.burst span { position: relative; font: 400 1em/0.92 "Archivo Black", "Arial Black", sans-serif; color: var(--yellow); letter-spacing: -0.03em;
              text-shadow: 0.05em 0.05em 0 #7a0006; transform: rotate(-12deg); }

/* the order panel: the one link to the store. Its header flashes by the clock; hover changes at once */
.order { display: flex !important; flex-direction: column; text-decoration: none; color: #111; cursor: pointer;
         background: linear-gradient(#fffb86, #f0e11c); border: 0.07em solid #000; box-shadow: 0.16em 0.16em 0 rgba(6, 8, 70, 0.92), inset 0 -0.08em 0 rgba(170, 158, 0, 0.6); }
.order .oh { display: flex; align-items: center; justify-content: center; gap: 0.5em; background: var(--red); color: #fff46a; border-bottom: 0.07em solid #000;
             font: 600 0.4em/1 "Antonio", "Arial Narrow", sans-serif; letter-spacing: 0.14em; padding: 0.36em 0 0.32em; white-space: nowrap; }
.order .oh.off { background: #111; color: var(--yellow); }
.order .ob { flex: 1; display: flex; flex-wrap: wrap; align-content: center; align-items: center; justify-content: center; column-gap: 0.28em; row-gap: 0.04em; font: 400 1em/1 "Archivo Black", "Arial Black", sans-serif;
             letter-spacing: -0.02em; white-space: nowrap; }
.order .ob.two { flex-direction: column; flex-wrap: nowrap; }
.order .ob.two > span { display: flex; align-items: center; gap: 0.28em; }
.order .ob i { display: inline-block; width: 0.82em; height: 0.66em; background: var(--red); margin-left: 0.08em;
               clip-path: polygon(0 34%, 52% 34%, 52% 0, 100% 50%, 52% 100%, 52% 66%, 0 66%); }
.order .os { display: flex; justify-content: center; font: italic 700 0.34em/1 "Arimo", Arial, sans-serif; letter-spacing: 0.02em; padding-bottom: 0.55em; text-transform: uppercase; }
.order:hover, .order:focus-visible { outline: none; background: var(--red); color: #fff; }
.order:hover .oh, .order:focus-visible .oh { background: #111; color: var(--yellow); }
.order:hover .ob i, .order:focus-visible .ob i { background: var(--yellow); transform: translateX(0.18em); }
.order:focus-visible { outline: 0.06em solid #fff; outline-offset: 0.06em; }
</style>
</head>
<body>
<main id="p" aria-label="But wait… there’s less! 30% off everything on the internet. Black Friday only."></main>
<div class="lines" aria-hidden="true"></div>
<script>
(async () => {
  const STORE = '{{link:store}}', GARRETT = '{{link:garrett}}', AUFBAU = '{{link:aufbau}}';
  const query = new URLSearchParams(location.search);
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const IMG = { globe: still ? '{{img:globe_still}}' : '{{img:globe_anim}}', tile: '{{img:tile}}', logo: '{{img:logo}}' };
  const TICKER = 'No purchase necessary! ✦ Every website, 30% off! ✦ Works like magic! ✦ As Seen On Every Website ✦ 30% off the entire internet. ✦ ';
  const CRAWL = 'BLACK FRIDAY ONLY! ✦ ACT NOW ✦ ';
  const GLINT = 'M0,-1 C0.06,-0.22 0.22,-0.06 1,0 C0.22,0.06 0.06,0.22 0,1 C-0.06,0.22 -0.22,0.06 -1,0 C-0.22,-0.06 -0.06,-0.22 0,-1Z';
  const TAN9 = Math.tan((9 * Math.PI) / 180);
  const FPS = 25; // the clock everything moves by: a PAL picture's rate

  // ---- the tape look: the live banner's filter, distances set in build(), the noise moved on by the clock ----
  const LUMA = '0.299 0.587 0.114 0 0';
  const tint = (i, q) => `${i * 0.22} ${q * 0.2} 0 0 ${0.5 - 0.5 * (i * 0.22 + q * 0.2)}`;
  const MOTTLE = `${tint(0.956, 0.621)}  ${tint(-0.272, -0.647)}  ${tint(-1.106, 1.703)}  0 0 0 0 1`;
  const GRAIN = `${'0.7 0 0 0 -0.399  '.repeat(3)} 0 0 0 0 1`;
  const add = (extra = '') => `operator="arithmetic" k2="1" k3="1" k4="-0.5" ${extra}`;
  document.body.insertAdjacentHTML('beforeend', `
    <svg class="defs" aria-hidden="true"><filter id="tape" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB">
      <feFlood flood-color="#0a22d6"/><feMerge result="picture"><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
      <feGaussianBlur class="soft" in="picture"/><feColorMatrix type="matrix" values="${LUMA} ${LUMA} ${LUMA} 0 0 0 1 0" result="luma"/>
      <feGaussianBlur class="halo"/><feComposite in="luma" operator="arithmetic" k2="1.42" k3="-0.42" result="sharp"/>
      <feGaussianBlur class="smear" in="picture"/><feOffset class="late"/>
      <feColorMatrix type="matrix" values="0.393 -0.329 -0.064 0 0.5  -0.167 0.231 -0.064 0 0.5  -0.167 -0.329 0.496 0 0.5  0 0 0 1 0"/>
      <feComposite in2="sharp" operator="arithmetic" k2="2" k3="1" k4="-1" result="clean"/>
      <feTurbulence class="blotch" type="fractalNoise" numOctaves="1" seed="3"/>
      <feColorMatrix type="matrix" values="${MOTTLE}"/><feComposite in2="clean" ${add('result="mottled"')}/>
      <feTurbulence class="static" type="fractalNoise" numOctaves="2" seed="2"/>
      <feColorMatrix type="matrix" values="${GRAIN}"/><feComposite in2="mottled" operator="arithmetic" k2="1" k3="1" result="taped"/>
      <feComponentTransfer><feFuncR type="linear" intercept="-0.55"/><feFuncG type="linear" intercept="-0.55"/><feFuncB type="linear" intercept="-0.55"/></feComponentTransfer>
      <feGaussianBlur class="bloom"/><feComposite in2="taped" operator="arithmetic" k2="0.149" k3="0.93" k4="0.037"/>
    </filter></svg>`);
  const $ = (sel) => document.querySelector(sel);
  // the noise: the colour blotches change 6 times a second, the static 12 (every fourth and every other frame)
  const BLOTCH = [3, 11, 7, 19, 5, 13], STATIC = [2, 17, 9, 23, 4, 29];

  await Promise.all(['100px "Archivo Black"', 'italic 700 100px "Arimo"', '300 50px "Antonio"', '600 50px "Antonio"', 'italic 700 50px "Tinos"'].map((f) => document.fonts.load(f)));
  const p = document.getElementById('p');
  const put = (html) => { p.insertAdjacentHTML('beforeend', html); return p.lastElementChild; };
  const place = (el, x, y, w, h) => Object.assign(el.style, { left: x + 'px', top: y + 'px', width: w + 'px', height: h + 'px' });
  const at = (el, x, y) => Object.assign(el.style, { left: x + 'px', top: y + 'px' });

  // Lettering is measured, not guessed: the ink's edges and the cap height of a string, per 1px of type.
  const mc = document.createElement('canvas').getContext('2d');
  function ink(text, font, ls) {
    mc.font = font.replace('SIZE', '200px'); mc.letterSpacing = ls * 200 + 'px';
    const m = mc.measureText(text), k = 1 / 200;
    return { l: -m.actualBoundingBoxLeft * k, r: m.actualBoundingBoxRight * k - ls, cap: mc.measureText('H').actualBoundingBoxAscent * k,
             asc: m.fontBoundingBoxAscent * k, desc: m.fontBoundingBoxDescent * k };
  }
  // Set a line of type with its ink's left edge at x and its baseline at y. skew: the headline's slant.
  function set(cls, text, font, ls, size, x, y, skew, tag = 'div') {
    const i = ink(text, font, ls), el = put(`<${tag} class="t ${cls}">${text}</${tag}>`);
    const base = (1 - (i.asc + i.desc)) / 2 + i.asc;
    Object.assign(el.style, { fontSize: size + 'px', left: x - i.l * size + 'px', top: y - base * size + 'px' });
    if (skew) Object.assign(el.style, { transformOrigin: `0 ${base * size}px`, transform: 'skewX(-9deg)' });
    return el;
  }
  const HEAD = 'SIZE "Archivo Black"', SUB = 'italic 700 SIZE "Arimo"';
  const width = (text, font, ls) => { const i = ink(text, font, ls); return i.r - i.l; };
  const headW = (t) => width(t, HEAD, -0.05) + ink(t, HEAD, -0.05).cap * TAN9; // per 1px of type, slant included
  const subW = (t) => width(t, SUB, -0.04);
  const HCAP = ink('H', HEAD, -0.05).cap, SCAP = ink('H', SUB, -0.04).cap;
  // the advance of a string at a size: font is '400' (Archivo Black), 'italic 700' (Arimo) or '600' (Antonio)
  const across = (text, font, size, ls) => {
    mc.font = `${font} ${size}px ${font.includes('700') ? '"Arimo"' : font === '600' ? '"Antonio"' : '"Archivo Black"'}`;
    mc.letterSpacing = ls * size + 'px'; return mc.measureText(text).width;
  };

  // ---- what moves, and how, at time t (seconds) ----
  let movers = [];
  const ease = (q) => q * q * (3 - 2 * q);
  const lerp = (a, b, q) => a + (b - a) * q;
  const twinkle = (path, delay) => movers.push((t) => {
    const ph = ((t + delay) / 2.4) % 1, q = ease(ph < 0.5 ? ph * 2 : 2 - ph * 2);
    path.style.transform = `scale(${lerp(0.55, 1, q)}) rotate(${lerp(-10, 12, q)}deg)`; path.style.opacity = lerp(0.75, 1, q);
  });
  const JOLT = [[0, 1, 0], [0.12, 1.18, -5], [0.26, 0.96, 3], [0.4, 1.08, -2], [0.55, 1, 0], [1, 1, 0]]; // when, scale, turn
  const jolt = (el, period, skew = -8, delay = 0) => movers.push((t) => {
    const ph = ((t + delay) / period) % 1, i = JOLT.findIndex(([w], n) => ph < JOLT[n + 1]?.[0]), [w0, s0, r0] = JOLT[i], [w1, s1, r1] = JOLT[i + 1];
    const q = ease((ph - w0) / (w1 - w0));
    el.style.transform = `skewX(${skew}deg) scale(${lerp(s0, s1, q)}) rotate(${lerp(r0, r1, q)}deg)`;
  });

  const glint = (cls, cx, cy, r) => {
    const el = place(put(`<div class="glint ${cls}" aria-hidden="true"><svg viewBox="-1 -1 2 2"><path d="${GLINT}"/></svg></div>`), cx - r, cy - r, r * 2, r * 2);
    twinkle(p.lastElementChild.querySelector('path'), cls === 'b' ? 1.2 : 0);
    return el;
  };
  const oval = (size, words = 'As Seen On<br>Every Website') => {
    const el = put(`<div class="oval"><span>${words}</span></div>`); el.style.fontSize = size + 'px'; return el;
  };
  const cards = (x, top, w) => {
    const el = put('<div class="cards" aria-hidden="true"><i class="c1"><b>FREE</b></i><i class="c2"><b>Gratis</b></i><i class="c3"><b>$0.00</b></i><i class="c4"><b>NO CHARGE</b></i></div>');
    Object.assign(el.style, { left: x + 'px', top: top + 'px', transform: `scale(${w / 436})` });
    return (62 * w) / 436;
  };
  // the price card, 400 x 306 (and its 70% 54 below that) at scale
  const CARD_H = 306 + 44;
  const card = (x, top, scale, turn = -1.4) => {
    const el = put('<div class="card" role="img" aria-label="The Internet (All Of It). Was 100%, now 70%."><div class="hd">The Internet (All Of It)</div><div class="ln">WAS: <s>100%</s></div><div class="ln">NOW:</div><div class="big">70%</div></div>');
    Object.assign(el.style, { left: x + 'px', top: top + 'px', transform: `scale(${scale}) rotate(${turn}deg)` });
    jolt(el.querySelector('.big'), 1.1);
    return el;
  };
  let globeFrames = null;
  const globe = (cx, cy, d) => {
    const k = d / 374, box = 480 * k, x = cx - 240 * k, y = cy - (47 + 187) * k;
    if (globeFrames) {
      const c = put('<canvas class="globe" aria-hidden="true"></canvas>'), dpr = Math.min(2, devicePixelRatio || 1);
      c.width = Math.round(box * dpr); c.height = Math.round(box * dpr); place(c, x, y, box, box);
      const g = c.getContext('2d'); let shown = -1;
      movers.push((t) => { const i = Math.floor(t * 15) % 60; if (i !== shown) { shown = i; g.clearRect(0, 0, c.width, c.height); g.drawImage(globeFrames[i], 0, 0, c.width, c.height); } });
    } else {
      place(put(`<img class="globe" alt="" src="${IMG.globe}">`), x, y, box, box);
    }
  };
  const glow = (cx, cy, d) => place(put('<div class="glow" aria-hidden="true"></div>'), cx - d * 1.3, cy - d * 1.45, d * 2.6, d * 2.9);
  // a starburst sticker of radius r: its points turn slowly by the clock, its words stay put
  const burst = (cx, cy, r, html, fill = '#ff1616') => {
    const n = 18, pts = [];
    for (let i = 0; i < n * 2; i++) { const a = (i * Math.PI) / n, rr = i % 2 ? 0.78 : 1; pts.push(`${(Math.cos(a) * rr).toFixed(3)},${(Math.sin(a) * rr).toFixed(3)}`); }
    const el = put(`<div class="burst" aria-hidden="true"><svg viewBox="-1.1 -1.1 2.2 2.2"><g><polygon points="${pts.join(' ')}" fill="rgba(6,8,70,0.9)" transform="translate(0.08 0.09)"/><polygon points="${pts.join(' ')}" fill="${fill}" stroke="#000" stroke-width="0.045" stroke-linejoin="round"/></g></svg><span>${html}</span></div>`);
    place(el, cx - r, cy - r, r * 2, r * 2); el.style.fontSize = r * 0.3 + 'px';
    const g = el.querySelector('g'); movers.push((t) => g.setAttribute('transform', `rotate(${(t * 9) % 360})`));
    return el;
  };

  // ---- one layout pass, for the window as it is ----
  function build() {
    p.textContent = ''; movers = [];
    const W = p.clientWidth, H = p.clientHeight, tall = W / H < 0.85;
    const fs = tall ? Math.min(W / 1080, H / 1920) : Math.min(W / 1280, H / 800); // the filter's scale, as on the live page
    $('.soft').setAttribute('stdDeviation', `${1.25 * fs} ${0.5 * fs}`);
    $('.halo').setAttribute('stdDeviation', `${5 * fs} ${0.6 * fs}`);
    $('.smear').setAttribute('stdDeviation', `${10 * fs} ${1.6 * fs}`);
    $('.late').setAttribute('dx', 7 * fs); $('.late').setAttribute('dy', 1.7 * fs);
    $('.bloom').setAttribute('stdDeviation', 14 * fs);
    $('.blotch').setAttribute('baseFrequency', `${0.042 / fs} ${0.167 / fs}`);
    $('.static').setAttribute('baseFrequency', `${0.19 / fs} ${0.71 / fs}`);

    const tiles = put('<div class="tiles" aria-hidden="true"></div>');
    place(tiles, -W * 0.3, -H * 0.3, W * 1.6, H * 1.6);
    Object.assign(tiles.style, { backgroundImage: `url(${IMG.tile})`, backgroundSize: `${260 * fs}px ${224 * fs}px` });

    // ---- the pieces ----
    // the ticker along the top, with the ON AIR bug at its head; the crawl along the bottom
    const ticker = (h) => {
      const tk = put(`<div class="ticker" aria-hidden="true"><span>${TICKER.repeat(5)}</span></div>`);
      Object.assign(tk.style, { height: h + 'px', fontSize: h * 0.66 + 'px', lineHeight: h + 'px' });
      const bug = put('<div class="bug" aria-hidden="true"><i></i>ON AIR</div>');
      Object.assign(bug.style, { left: 0, top: 0, height: h + 'px', fontSize: h * 0.56 + 'px' });
      const dot = bug.firstElementChild, tks = tk.firstElementChild, rep = tks.offsetWidth / 5, v = h * 1.5;
      movers.push((t) => { tks.style.transform = `translateX(${-(((t + 3) * v) % rep)}px)`; dot.className = Math.floor(t * 1.25) % 2 ? 'off' : ''; });
    };
    const crawl = (h) => {
      const cr = put(`<div class="crawl" aria-hidden="true"><span>${CRAWL.repeat(14)}</span></div>`);
      Object.assign(cr.style, { height: h + 'px', fontSize: h * 0.68 + 'px', lineHeight: h + 'px' });
      const crs = cr.firstElementChild, rep = crs.offsetWidth / 14, v = h * 2.6;
      movers.push((t) => { crs.style.transform = `translateX(${-(((t + 3) * v) % rep)}px) skewX(-9deg)`; });
    };
    // the credits bar; on one line with the lockup where it goes, else on two
    const credits = (top, h) => {
      const line = 'BROUGHT TO YOU BY GARY MUSTARD ENTERPRISES ✦ GARRETT MUSAR ✦ AUFBAU';
      let f = h * 0.36, two = false;
      const oneW = (ff) => across(line, 'italic 700', ff, 0.08) + 4.6 * ff;
      if (oneW(f) > W * 0.94) { f = Math.max(h * 0.25, (W * 0.94) / (oneW(100) / 100)); if (oneW(f) > W * 0.94) { two = true; f = h * 0.24; } }
      const el = put(`<div class="by${two ? ' two' : ''}">${two ? '' : `<img class="logo" alt="" src="${IMG.logo}">`}<span class="gme">Brought to you by Gary Mustard Enterprises</span><span class="sep first" aria-hidden="true">✦</span><span class="names"><a href="${GARRETT}">Garrett Musar</a><span class="sep" aria-hidden="true">✦</span><a href="${AUFBAU}">Aufbau</a></span></div>`);
      place(el, 0, top, W, h); el.style.fontSize = f + 'px';
      if (two && across('BROUGHT TO YOU BY GARY MUSTARD ENTERPRISES', 'italic 700', f, 0.08) > W * 0.92) f = (W * 0.92) / (across('BROUGHT TO YOU BY GARY MUSTARD ENTERPRISES', 'italic 700', 100, 0.08) / 100), el.style.fontSize = f + 'px';
    };
    // the order panel, w wide; returns its height for a width (dry) or places it
    // on one line (ADD TO CHROME →) or two (ADD TO / CHROME →), the type as big as the width allows
    const ORDER_W = [(across('ADD TO CHROME', '400', 100, -0.02) + 90 + 28) / 100,
                     (across('CHROME', '400', 100, -0.02) + 90 + 28) / 100]; // per 1px of type
    const orderF = (w, two) => (w * 0.86) / ORDER_W[two ? 1 : 0];
    const orderH = (w, two) => orderF(w, two) * (0.4 * 1.68 + (two ? 2.04 : 1) + 0.5 + 0.34 * 1.55 + 0.14);
    const order = (x, y, w, two = false) => {
      const f = orderF(w, two), el = put(`<a class="order" href="${STORE}"><span class="oh"><span aria-hidden="true">✦</span>OPERATORS STANDING BY<span aria-hidden="true">✦</span></span>${two ? '<span class="ob two"><span>ADD TO</span><span>CHROME<i aria-hidden="true"></i></span></span>' : '<span class="ob">ADD TO CHROME<i aria-hidden="true"></i></span>'}<span class="os">No purchase necessary!</span></a>`);
      place(el, x, y, w, orderH(w, two)); el.style.fontSize = f + 'px';
      const oh = el.firstElementChild; movers.push((t) => { oh.className = Math.floor(t * 2.5) % 2 ? 'oh off' : 'oh'; });
      return el;
    };
    // the lower third: the strap, ITEM # on it, BLACK FRIDAY ONLY! hanging off its end. lines: one or two
    const STRAP1 = '<b>30% OFF</b> EVERYTHING ON THE INTERNET.';
    const strapTextW = (two) => two ? Math.max(across('30% OFF', '400', 108, -0.03), across('EVERYTHING ON THE INTERNET.', 'italic 700', 100, -0.02)) / 100
                                    : (across('30% OFF', '400', 108, -0.03) + 30 + across('EVERYTHING ON THE INTERNET.', 'italic 700', 100, -0.02)) / 100;
    const TAG_W = (across('BLACK FRIDAY ONLY!', '400', 100, -0.01) + 84 + 14) / 100;
    const strap = (x, y, w, h, two) => {
      const tagF = Math.min(h * (two ? 0.34 : 0.5), (w * 0.42) / TAG_W), tagW = tagF * TAG_W;
      const sw = w - tagW * 0.62;
      const f = Math.min(h * (two ? 0.34 : 0.56), (sw - h * 0.5) / strapTextW(two));
      const el = put(`<h2 class="strap${two ? ' two' : ''}">${two ? '<b>30% OFF</b><span>EVERYTHING ON THE INTERNET.</span>' : STRAP1}</h2>`);
      place(el, x, y, sw, h); el.style.fontSize = f + 'px';
      const it = put('<div class="item" aria-hidden="true">ITEM #<b>100–70</b></div>'), ih = Math.max(14, h * (two ? 0.22 : 0.4));
      place(it, x, y - ih, 'auto', ih); it.style.width = ''; Object.assign(it.style, { fontSize: ih * 0.62 + 'px' });
      const tg = put('<div class="tag">BLACK FRIDAY ONLY!</div>'); tg.style.fontSize = tagF + 'px';
      at(tg, x + w - tagW, y + h - tagF * 1.38 + (two ? tagF * 0.55 : tagF * 0.42));
    };

    if (tall) tallFrame(); else wideFrame();

    // ---- wide: the headline across the top; under it the globe, the price card, the order panel; the strap ----
    function wideFrame() {
      const s = Math.min(W / 1280, H / 800), mx = Math.max(16, 44 * s), Wc = W - 2 * mx;
      const tick = Math.max(16, 36 * s), crawlH = Math.max(18, 46 * s), byH = Math.max(24, 42 * s);
      const byTop = H - crawlH - byH, strapH = Math.max(26, 64 * s), strapTop = byTop - 20 * s - strapH;
      // the headline: BUT WAIT… as the set-up, THERE'S LESS! as wide as the frame allows
      const HL = 'THERE’S LESS!', hs = Math.min((Wc * 0.97) / headW(HL), (H * 0.17) / HCAP), hw = headW(HL) * hs, hx = (W - hw) / 2;
      const bws = (hs * HCAP * 0.42) / SCAP;
      const beam = put('<div class="beam" aria-hidden="true"></div>'); place(beam, hx - hw * 0.08, tick - hs * 0.5, hw * 1.16, hs * 1.9);
      let y = tick + 18 * s + SCAP * bws;
      const bw = set('sub', 'BUT WAIT…', SUB, -0.04, bws, hx + hs * 0.06, y, false, 'div');
      bw.style.transform = 'rotate(-3deg)'; bw.style.transformOrigin = 'left bottom';
      y += 12 * s + HCAP * hs;
      set('head', HL, HEAD, -0.05, hs, hx, y, true, 'h1');
      glint('', hx - hs * 0.02, y - HCAP * hs * 0.95, hs * 0.2);
      glint('b', hx + hw * 0.995, y - HCAP * hs * 0.06, hs * 0.12);

      // the band: globe | price card | order panel
      const top = y + hs * 0.08 + 24 * s, bot = strapTop - 18 * s, band = bot - top, g = 30 * s;
      // the three side by side, centred: the right column no wider than a little more than the card, so the card stays the bigger thing
      const cs = Math.min(band / CARD_H, (Wc * (W / H < 1.5 ? 0.41 : 0.36)) / 400), cw = 400 * cs, cTop = top + (band - CARD_H * cs) / 2;
      const gW = Math.min(band * 1.2, Wc * 0.25), rwMax = Math.min(Wc * 0.36, cw * 1.25);
      const off = Math.max(0, (Wc - (gW + g * 0.6 + cw + g + 14 * s + rwMax)) / 2), cx = mx + off + gW + g * 0.6;
      const gl = mx + off, gr = cx - g * 0.4, gd = Math.min(band * 1.04, (gr - gl) * 1.02), gcx = (gl + gr) / 2, gcy = top + band * 0.52;
      glow(gcx, gcy, gd * 1.15);
      globe(gcx, gcy, gd);
      const o = oval(gd * 0.105); at(o, gcx + gd * 0.12 - o.offsetWidth / 2, Math.max(top - 6 * s, gcy - gd * 0.48 - o.offsetHeight / 2));
      glint('', gcx - gd * 0.4, gcy + gd * 0.36, gd * 0.06);
      card(cx, cTop, cs);
      // the right column: the four cards over the order panel (on two lines where the height allows)
      const rx = cx + cw + g + 14 * s, rw = Math.min(rwMax, W - mx - rx), cg = 22 * s;
      const chh = (62 * rw) / 436, two = chh + cg + orderH(rw, true) <= band * 1.02, need = chh + cg + orderH(rw, two), k = Math.min(1, band / need);
      const ry = top + (band - need * k) / 2;
      cards(rx + (rw - rw * k) / 2, ry, rw * k);
      order(rx + (rw - rw * k) / 2, ry + (chh + cg) * k, rw * k, two);
      const br = Math.min(68 * s, cs * 70);
      burst(cx + cw + br * 0.3, cTop - br * 0.02, br, 'WORKS<br>LIKE<br>MAGIC!');

      strap(mx, strapTop, Wc, strapH, false);
      credits(byTop, byH);
      ticker(tick); crawl(crawlH);
    }

    // ---- tall: the same frame stacked: headline, price card with the globe behind, strap, cards, order panel ----
    function tallFrame() {
      const s = Math.min(W / 400, H / 860), mx = Math.max(16, 18 * s), Wc = W - 2 * mx;
      const tick = Math.max(16, 28 * s), crawlH = Math.max(18, 36 * s), byH = Math.max(40, 56 * s);
      const byTop = H - crawlH - byH, lo = tick + 10 * s, hi = byTop - 16 * s, room = hi - lo;
      const L1 = 'THERE’S', L2 = 'LESS!';
      // natural sizes, from the width
      const hs0 = (Wc * 0.96) / headW(L1), bws0 = (hs0 * HCAP * 0.36) / SCAP;
      const cs0 = (Wc * 0.7) / 400, strapH0 = Wc * 0.2, chW0 = Wc * 0.9, orW0 = Wc * 0.94;
      const blocks = [
        ['bw', SCAP * bws0 * 1.1], ['l1', HCAP * hs0], ['l2', HCAP * hs0], ['card', CARD_H * cs0],
        ['strap', strapH0], ['cards', (62 * chW0) / 436], ['order', orderH(orW0)],
      ];
      const gaps = [8, 12, 26, 26, 18, 16].map((v) => v * s);
      const natural = blocks.reduce((a, b) => a + b[1], 0) + gaps.reduce((a, b) => a + b, 0);
      const k = Math.min(1, room / natural), spare = room - natural * k;
      let y = lo + spare * 0.15;
      const step = (n) => { y += gaps[n] * k + (spare * 0.7) / gaps.length; };
      const hs = hs0 * k, bws = bws0 * k;
      // the set-up and the headline, centred
      const w1 = headW(L1) * hs, w2 = headW(L2) * hs, x1 = (W - w1) / 2;
      const beam = put('<div class="beam" aria-hidden="true"></div>'); place(beam, x1 - w1 * 0.15, y - hs * 0.2, w1 * 1.3, hs * 2.2);
      y += SCAP * bws * 1.1;
      const bw = set('sub', 'BUT WAIT…', SUB, -0.04, bws, x1 + hs * 0.04, y, false);
      bw.style.transform = 'rotate(-3deg)'; bw.style.transformOrigin = 'left bottom';
      const br = SCAP * bws * 2.1;
      const brY = y - SCAP * bws * 0.75;
      step(0); y += HCAP * hs; set('head', L1, HEAD, -0.05, hs, x1, y, true, 'h1');
      step(1); y += HCAP * hs; set('head', L2, HEAD, -0.05, hs, (W - w2) / 2, y, true);
      burst(W - mx - br * 0.85, brY, br, 'WORKS<br>LIKE<br>MAGIC!');
      glint('', (W - w2) / 2 - hs * 0.25, y - HCAP * hs * 0.6, hs * 0.16);
      step(2);
      // the price card, a little left; the globe behind it on the right with its badge
      const cs = cs0 * k, cw = 400 * cs, cx = mx + (Wc - cw) * 0.04, ch = CARD_H * cs;
      const gd = Math.min(Wc * 0.56, ch * 1.05), gcx = W - mx - gd * 0.46, gcy = y + ch * 0.5;
      glow(gcx, gcy, gd * 1.1); globe(gcx, gcy, gd);
      card(cx, y, cs, -2);
      const o = oval(gd * 0.088); at(o, W - mx - o.offsetWidth * 0.98, gcy - gd * 0.5 - o.offsetHeight * 0.4);
      y += ch; step(3);
      strap(mx, y, Wc, strapH0 * k, true); y += strapH0 * k; step(4);
      const chW = chW0 * k; cards((W - chW) / 2, y, chW); y += (62 * chW) / 436; step(5);
      const orW = orW0 * k; order((W - orW) / 2, y, orW);
      credits(byTop, byH);
      ticker(tick); crawl(crawlH);
    }
    render(clock());
  }

  // ---- the clock ----
  const t0 = performance.now(), clock = () => (still ? 0 : Math.floor(((performance.now() - t0) / 1000) * FPS) / FPS);
  const blotch = $('.blotch'), grain = $('.static');
  function render(t) {
    for (const move of movers) move(t);
    const f = Math.round(t * FPS); blotch.setAttribute('seed', BLOTCH[Math.floor(f / 4) % 6]); grain.setAttribute('seed', STATIC[Math.floor(f / 2) % 6]);
  }

  build();
  let pending = 0;
  addEventListener('resize', () => { cancelAnimationFrame(pending); pending = requestAnimationFrame(build); });
  if (!still) {
    let last = -1;
    const frame = () => { const t = clock(); if (t !== last) { last = t; render(t); } requestAnimationFrame(frame); };
    requestAnimationFrame(frame);
    // the globe's frames, decoded once (on the side), then drawn by the clock in step with everything else
    if ('ImageDecoder' in window) (async () => {
      try {
        const dec = new ImageDecoder({ data: await (await fetch(IMG.globe)).arrayBuffer(), type: 'image/webp' });
        await dec.tracks.ready;
        const n = dec.tracks.selectedTrack.frameCount, frames = [];
        for (let i = 0; i < n; i++) { const { image } = await dec.decode({ frameIndex: i }); frames.push(await createImageBitmap(image)); image.close(); }
        dec.close();
        if (n === 60) { globeFrames = frames; build(); }
      } catch {}
    })();
  }

  // The tape look costs little on a graphics card and a great deal without one: once the page is up,
  // see how fast it draws; if slowly, take the look off, and if that made no difference, put it back.
  const frameRate = () => new Promise((resolve) => {
    let frames = 0, drawing = 0, last = 0;
    const tick = (now) => { const gap = now - last; if (last && gap < 1000) { frames++; drawing += gap; } last = now; if (drawing < 2000) requestAnimationFrame(tick); else resolve((frames * 1000) / drawing); };
    requestAnimationFrame(tick);
  });
  if (!still && !query.has('keep')) {
    await new Promise((r) => setTimeout(r, 1200));
    const withLook = await frameRate();
    if (withLook < 24) {
      p.style.filter = 'none';
      if ((await frameRate()) < withLook * 1.5) p.style.removeProperty('filter');
    }
  }
})();
</script>
</body>
</html>
