<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>30% Off EVERYTHING</title>
<meta name="description" content="A Black Friday treat for your browser: 30% off every website you visit. Black Friday only.">
<link rel="icon" href="{{img:favicon}}">
<!-- Variant "countdown": the last five seconds of a sale spot. BLACK FRIDAY ONLY! leads, as a giant red
     marquee banner with chasing bulbs, and hanging from it a live countdown clock to Black Friday
     (midnight, the visitor's own time; on the day it reads TODAY ONLY! and counts the day out, to the
     frame). Second: 30% OFF EVERYTHING ON THE INTERNET. beside (or under) a large globe. Third: the
     flashing ADD TO CHROME order bar. BUT WAIT… THERE'S LESS! lives only in the news ticker, in another
     register, so the two key phrases never meet at the same weight.
     Everything that moves runs off one clock at 25 frames a second (no CSS animation or transition). -->
<style>
{{fonts}}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; background: #070f9c; }
body { -webkit-font-smoothing: antialiased; }
#p { position: fixed; inset: 0; overflow: hidden; background: linear-gradient(#0a1cc4, #0a22d6 45%, #070f9c); filter: url(#tape);
     --yellow: #fff035; --shade: #0a0f66; --red: #ff1616; user-select: none; }
#p > * { position: absolute; display: block; max-width: none; }
#p img { -webkit-user-drag: none; }
.defs { position: absolute; width: 0; height: 0; }
.lines { position: fixed; inset: 0; pointer-events: none; z-index: 2;
         background: repeating-linear-gradient(rgba(0, 0, 16, 0) 0, rgba(0, 0, 16, 0.05) 1.5px, rgba(0, 0, 16, 0) 3px),
                     radial-gradient(farthest-corner at 50% 50%, rgba(0, 0, 0, 0) 0%, rgba(0, 0, 0, 0.03) 50%, rgba(0, 0, 0, 0.08) 71%, rgba(0, 0, 0, 0.13) 85%, rgba(0, 0, 0, 0.21) 100%); }

.glow { border-radius: 50%; background: radial-gradient(closest-side, #58c4ff 0%, #2a8cff 22%, #1348ee 44%, transparent 72%); }
.tiles { background-repeat: repeat; opacity: 0.095; transform: rotate(-6deg); }

.t { white-space: nowrap; line-height: 1; }
.head { font-family: "Archivo Black", "Arial Black", sans-serif; color: var(--yellow); letter-spacing: -0.05em;
        text-shadow: 0.009em 0.009em 0 var(--shade), 0.018em 0.018em 0 var(--shade), 0.027em 0.027em 0 var(--shade),
                     0.036em 0.036em 0 var(--shade), 0.045em 0.045em 0 var(--shade), 0.054em 0.054em 0 var(--shade); }
/* the banner's lettering: the same yellow, its stacked shadow in oxblood on the red */
.head.bf { --shade: #4a0004; }
.sub { font: italic 700 1em "Arimo", Arial, sans-serif; letter-spacing: -0.04em;
       background: linear-gradient(#fff 35%, #c5d4fb 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
       filter: drop-shadow(0.045em 0.045em 0 rgba(6, 8, 70, 0.95)); padding: 0 0.1em 0.06em 0; }

.glint svg { display: block; width: 100%; height: 100%; overflow: visible; fill: #fff; }
.glint path { filter: drop-shadow(0 0 0.08px #fff) drop-shadow(0 0 0.22px #9fd4ff); transform-box: fill-box; transform-origin: center; }

/* the marquee banner: red, with a row of chasing bulbs along each edge */
.band { background: linear-gradient(#ff3b2e, #ec0d0d 55%, #b30007); box-shadow: 0 0 0 0.25em #000, 0 1.1em 0 rgba(6, 8, 70, 0.85); font-size: 10px; }
.bulbs { background-repeat: repeat-x; }

/* the countdown clock: split-flap digits in a black case hanging from the banner */
.clock { display: flex !important; flex-direction: column; align-items: stretch; background: linear-gradient(#1b1b26, #07070c); color: var(--yellow);
         border: 0.07em solid var(--yellow); box-shadow: 0 0 0 0.05em #000, 0.16em 0.16em 0 rgba(6, 8, 70, 0.9); white-space: nowrap; }
.clock .ch { display: flex; align-items: center; justify-content: center; gap: 0.5em; background: var(--yellow); color: #0b0b12;
             font: 600 0.34em/1 "Antonio", "Arial Narrow", sans-serif; letter-spacing: 0.16em; padding: 0.22em 0.6em 0.24em; text-transform: uppercase; }
.clock .ch .dot { width: 0.62em; height: 0.62em; border-radius: 50%; background: var(--red); box-shadow: 0 0 0 0.12em #0b0b12; }
.clock .ch .dot.off { background: #5a1010; }
.clock .row { display: flex; align-items: flex-start; justify-content: center; padding: 0.16em 0.2em 0.12em; }
.clock .u { display: flex; flex-direction: column; align-items: center; }
.clock .dd { display: flex; gap: 0.05em; }
.clock em { display: grid; place-items: center; width: 0.8em; height: 1.08em; font: normal 400 1em/1 "Archivo Black", "Arial Black", sans-serif;
            background: linear-gradient(#2e2e3b 0 49%, #000 49% 52%, #1d1d27 52%); border-radius: 0.07em; color: var(--yellow);
            box-shadow: inset 0 0 0 0.02em rgba(255, 255, 255, 0.08); }
.clock .u.fr em { color: #ff4a3a; }
.clock .u i { font: 600 0.2em/1 "Antonio", "Arial Narrow", sans-serif; letter-spacing: 0.2em; color: #fff; margin-top: 0.3em; font-style: normal; }
.clock .colon { font: 400 0.7em/1.45 "Archivo Black", "Arial Black", sans-serif; color: var(--yellow); padding: 0 0.06em; }

/* the ACT NOW! starburst */
.burst { display: grid !important; place-items: center; }
.burst svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.burst span { position: relative; font: 400 1em/0.9 "Archivo Black", "Arial Black", sans-serif; color: var(--red); text-align: center; letter-spacing: -0.03em;
              text-shadow: 0.04em 0.04em 0 #4a0004; }

/* the news ticker along the top: an ON AIR tab, then Garrett's lines */
.ticker { left: 0; right: 0; overflow: hidden; white-space: nowrap; pointer-events: none; background: rgba(4, 8, 70, 0.72);
          font-family: "Antonio", "Arial Narrow", sans-serif; font-weight: 300; letter-spacing: 0.035em; word-spacing: 0.3em;
          color: #e9f0ff; text-shadow: 0.06em 0.06em 0 rgba(4, 8, 80, 0.85); }
.ticker > span { display: inline-block; }
.ticker b { font-weight: 600; color: var(--yellow); }
.onair { display: flex !important; align-items: center; gap: 0.4em; background: var(--red); color: #fff; font: 600 1em/1 "Antonio", "Arial Narrow", sans-serif;
         letter-spacing: 0.14em; padding: 0 0.7em 0 0.6em; white-space: nowrap; pointer-events: none; box-shadow: 0.25em 0 0 #000; }
.onair i { width: 0.5em; height: 0.5em; border-radius: 50%; background: #fff; display: block; }
.onair i.off { background: #8a0a0a; }

.crawl { left: 0; right: 0; overflow: hidden; white-space: nowrap; pointer-events: none; background: #05050c;
         font-family: "Archivo Black", "Arial Black", sans-serif; color: var(--yellow); letter-spacing: -0.02em; word-spacing: 0.08em; }
.crawl span { display: inline-block; }
.crawl b { font-weight: 400; color: var(--red); }

/* the order bar: the link to the store. Its button flashes by the clock; hover changes it at once */
.order { display: flex !important; align-items: center; justify-content: center; gap: 0.9em; white-space: nowrap; text-decoration: none; cursor: pointer; color: #111;
         background: linear-gradient(#fffb86, #f0e11c); box-shadow: inset 0 0.07em 0 rgba(170, 158, 0, 0.6), inset 0 -0.07em 0 rgba(170, 158, 0, 0.6); }
.order .lead { display: flex; flex-direction: column; align-items: flex-end; gap: 0.16em; }
.order .op { font: 600 0.42em/1 "Antonio", "Arial Narrow", sans-serif; letter-spacing: 0.2em; color: #1a1a1a; }
.order .np { font: italic 700 0.62em/1 "Arimo", Arial, sans-serif; letter-spacing: -0.02em; }
.order .go { display: inline-flex; align-items: center; gap: 0.36em; padding: 0.2em 0.62em 0.24em; background: #111; color: var(--yellow);
             font: 400 1em/1 "Archivo Black", "Arial Black", sans-serif; letter-spacing: -0.01em; box-shadow: 0.1em 0.1em 0 rgba(6, 8, 70, 0.9); }
.order .go.lit { background: var(--red); color: var(--yellow); }
.order .go i { font: 900 1em/1 Arial, Helvetica, sans-serif; font-style: normal; display: inline-block; }
.order .item { font: 600 0.42em/1.15 "Antonio", "Arial Narrow", sans-serif; letter-spacing: 0.16em; color: #1a1a1a; text-align: left; }
.order:hover, .order:focus-visible { outline: none; background: linear-gradient(#fffdb8, #fff035); }
.order:hover .go, .order:focus-visible .go, .order:hover .go.lit, .order:focus-visible .go.lit { background: #fff; color: var(--red); outline: 0.08em solid #111; }
.order:hover .go i, .order:focus-visible .go i { transform: translateX(0.18em); }

/* the credits */
.by { display: flex !important; align-items: center; justify-content: center; white-space: nowrap; font: italic 700 1em/1 "Arimo", Arial, sans-serif;
      background: var(--shade); color: #fff; letter-spacing: 0.08em; text-transform: uppercase; }
.by .sep { margin: 0 0.9em; color: var(--yellow); }
.by.two { flex-direction: column; gap: 0.35em; }
.by.two .sep.first { display: none; }
.by a { color: #fff; text-decoration: none; border-bottom: 0.12em solid var(--yellow); padding-bottom: 0.05em; }
.by a:hover, .by a:focus-visible { color: var(--yellow); outline: none; }

/* the price card; only its 70% moves */
.card { width: 400px; height: 306px; background: #f3f4f6; color: #0c0c0c; border: 5px solid #000; box-shadow: 8px 8px 0 rgba(4, 6, 60, 0.92);
        transform-origin: left top; font: italic 700 50px/1 "Arimo", Arial, sans-serif; }
.card .hd { background: var(--red); color: #fff46a; font: 600 41px/57px "Antonio", "Arial Narrow", sans-serif; padding: 0 15px; border-bottom: 5px solid #000; white-space: nowrap; overflow: hidden; }
.card .ln { padding: 13px 17px 0; }
.card s { position: relative; text-decoration: none; color: #6b6f78; margin-left: 9px; }
.card s::after { content: ""; position: absolute; left: -8%; right: -8%; top: 46%; height: 8px; background: var(--red); transform: rotate(-11deg); box-shadow: 0 0 0 2px #000; }
.card .big { position: absolute; right: 9px; bottom: -54px; font: 400 165px/0.9 "Archivo Black", "Arial Black", sans-serif; color: var(--red); letter-spacing: -0.05em;
             -webkit-text-stroke: 11px #000; paint-order: stroke fill; transform: skewX(-8deg); transform-origin: 70% 80%; }

.oval { width: 7.6em; height: 3.31em; border-radius: 50%; display: grid !important; place-items: center; text-align: center;
        font: italic 700 1em/0.98 "Tinos", "Times New Roman", serif; background: radial-gradient(ellipse at 40% 30%, #fffc9a, #efe01c 72%); color: #151515;
        transform: rotate(-7deg); box-shadow: 0.143em 0.167em 0 rgba(6, 8, 70, 0.9), inset 0 0 0 0.095em rgba(170, 158, 0, 0.5); }
.cards { display: flex !important; gap: 12px; width: 436px; transform-origin: left top; font: italic 700 19px/1 "Arimo", Arial, sans-serif; letter-spacing: 0.02em; }
.cards i { flex: none; position: relative; display: block; width: 100px; height: 62px; border-radius: 7px; overflow: hidden; box-shadow: 3px 3px 0 rgba(6, 8, 70, 0.85); }
.cards b { position: absolute; left: 0; right: 0; bottom: 5px; text-align: center; }
.cards .c1 { background: linear-gradient(#f4f4f4 0 34%, #1c3fd1 34% 62%, #f1b400 62%); color: #111; }
.cards .c2 { background: radial-gradient(circle at 50% 40%, #ffb300 0 30%, transparent 31%), #f6f6f6; color: #111; }
.cards .c3 { background: linear-gradient(135deg, #7fd4ff, #2a79d8); color: #fff; }
.cards .c4 { background: linear-gradient(#151515, #3a2a00); color: #ffcf2e; }
.cards .c4 b { font-size: 14.5px; }
</style>
</head>
<body>
<main id="p" aria-label="30% Off EVERYTHING: 30% off every website. Black Friday only."></main>
<div class="lines" aria-hidden="true"></div>
<script>
(async () => {
  const STORE = '{{link:store}}', GARRETT = '{{link:garrett}}', AUFBAU = '{{link:aufbau}}';
  const query = new URLSearchParams(location.search);
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const IMG = { globe: still ? '{{img:globe_still}}' : '{{img:globe_anim}}', tile: '{{img:tile}}' };
  const TICKER = '<b>BUT WAIT… THERE’S LESS!</b> ✦ No purchase necessary! ✦ Every website, 30% off! ✦ Works like magic! ✦ As Seen On Every Website ✦ ';
  const CRAWL = 'ACT NOW! <b>✦</b> BLACK FRIDAY ONLY! <b>✦</b> LIMITED TIME <b>✦</b> EVERY SITE 30% OFF! <b>✦</b> ';
  const GLINT = 'M0,-1 C0.06,-0.22 0.22,-0.06 1,0 C0.22,0.06 0.06,0.22 0,1 C-0.06,0.22 -0.22,0.06 -1,0 C-0.22,-0.06 -0.06,-0.22 0,-1Z';
  const TAN9 = Math.tan((9 * Math.PI) / 180);
  const FPS = 25;

  // ---- the tape look (as on the live banner); distances set in build(), the noise moved on by the clock ----
  const LUMA = '0.299 0.587 0.114 0 0';
  const tint = (i, q) => `${i * 0.22} ${q * 0.2} 0 0 ${0.5 - 0.5 * (i * 0.22 + q * 0.2)}`;
  const MOTTLE = `${tint(0.956, 0.621)}  ${tint(-0.272, -0.647)}  ${tint(-1.106, 1.703)}  0 0 0 0 1`;
  const GRAIN = `${'0.7 0 0 0 -0.399  '.repeat(3)} 0 0 0 0 1`;
  const add = (extra = '') => `operator="arithmetic" k2="1" k3="1" k4="-0.5" ${extra}`;
  document.body.insertAdjacentHTML('beforeend', `
    <svg class="defs" aria-hidden="true"><filter id="tape" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB">
      <feFlood flood-color="#0a22d6"/><feMerge result="picture"><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
      <feGaussianBlur class="soft" in="picture"/><feColorMatrix type="matrix" values="${LUMA} ${LUMA} ${LUMA} 0 0 0 1 0" result="luma"/>
      <feGaussianBlur class="halo"/><feComposite in="luma" operator="arithmetic" k2="1.42" k3="-0.42" result="sharp"/>
      <feGaussianBlur class="smear" in="picture"/><feOffset class="late"/>
      <feColorMatrix type="matrix" values="0.393 -0.329 -0.064 0 0.5  -0.167 0.231 -0.064 0 0.5  -0.167 -0.329 0.496 0 0.5  0 0 0 1 0"/>
      <feComposite in2="sharp" operator="arithmetic" k2="2" k3="1" k4="-1" result="clean"/>
      <feTurbulence class="blotch" type="fractalNoise" numOctaves="1" seed="3"/>
      <feColorMatrix type="matrix" values="${MOTTLE}"/><feComposite in2="clean" ${add('result="mottled"')}/>
      <feTurbulence class="static" type="fractalNoise" numOctaves="2" seed="2"/>
      <feColorMatrix type="matrix" values="${GRAIN}"/><feComposite in2="mottled" operator="arithmetic" k2="1" k3="1" result="taped"/>
      <feComponentTransfer><feFuncR type="linear" intercept="-0.55"/><feFuncG type="linear" intercept="-0.55"/><feFuncB type="linear" intercept="-0.55"/></feComponentTransfer>
      <feGaussianBlur class="bloom"/><feComposite in2="taped" operator="arithmetic" k2="0.149" k3="0.93" k4="0.037"/>
    </filter></svg>`);
  const $ = (sel) => document.querySelector(sel);
  const BLOTCH = [3, 11, 7, 19, 5, 13], STATIC = [2, 17, 9, 23, 4, 29];

  await Promise.all(['100px "Archivo Black"', 'italic 700 100px "Arimo"', '300 50px "Antonio"', '600 50px "Antonio"', 'italic 700 50px "Tinos"'].map((f) => document.fonts.load(f)));
  const p = document.getElementById('p');
  const put = (html) => { p.insertAdjacentHTML('beforeend', html); return p.lastElementChild; };
  const place = (el, x, y, w, h) => { Object.assign(el.style, { left: x + 'px', top: y + 'px', width: w + 'px', height: h + 'px' }); return el; };
  const at = (el, x, y) => Object.assign(el.style, { left: x + 'px', top: y + 'px' });

  // measured type: ink edges and cap height per 1px of type
  const mc = document.createElement('canvas').getContext('2d');
  function ink(text, font, ls) {
    mc.font = font.replace('SIZE', '200px'); mc.letterSpacing = ls * 200 + 'px';
    const m = mc.measureText(text), k = 1 / 200;
    return { l: -m.actualBoundingBoxLeft * k, r: m.actualBoundingBoxRight * k - ls, cap: mc.measureText('H').actualBoundingBoxAscent * k,
             asc: m.fontBoundingBoxAscent * k, desc: m.fontBoundingBoxDescent * k };
  }
  function set(cls, text, font, ls, size, x, y, skew, tag = 'div') {
    const i = ink(text, font, ls), el = put(`<${tag} class="t ${cls}">${text}</${tag}>`);
    const base = (1 - (i.asc + i.desc)) / 2 + i.asc;
    Object.assign(el.style, { fontSize: size + 'px', left: x - i.l * size + 'px', top: y - base * size + 'px' });
    if (skew) Object.assign(el.style, { transformOrigin: `0 ${base * size}px`, transform: 'skewX(-9deg)' });
    return el;
  }
  const HEAD = 'SIZE "Archivo Black"', SUB = 'italic 700 SIZE "Arimo"';
  const width = (text, font, ls) => { const i = ink(text, font, ls); return i.r - i.l; };
  const headW = (t) => width(t, HEAD, -0.05) + ink(t, HEAD, -0.05).cap * TAN9;
  const subW = (t) => width(t, SUB, -0.04);
  const HCAP = ink('H', HEAD, -0.05).cap, SCAP = ink('H', SUB, -0.04).cap;
  // centred lettering: x is the centre
  const setC = (cls, text, font, ls, size, cx, y, skew, tag) =>
    set(cls, text, font, ls, size, cx - ((font === HEAD ? headW(text) : subW(text)) * size) / 2, y, skew, tag);

  // ---- what moves ----
  let movers = [];
  const ease = (q) => q * q * (3 - 2 * q);
  const lerp = (a, b, q) => a + (b - a) * q;
  const twinkle = (path, delay) => movers.push((t) => {
    const ph = ((t + delay) / 2.4) % 1, q = ease(ph < 0.5 ? ph * 2 : 2 - ph * 2);
    path.style.transform = `scale(${lerp(0.55, 1, q)}) rotate(${lerp(-10, 12, q)}deg)`; path.style.opacity = lerp(0.75, 1, q);
  });
  const JOLT = [[0, 1, 0], [0.12, 1.18, -5], [0.26, 0.96, 3], [0.4, 1.08, -2], [0.55, 1, 0], [1, 1, 0]];
  const jolt = (el, period) => movers.push((t) => {
    const ph = (t / period) % 1, i = JOLT.findIndex(([w], n) => ph < JOLT[n + 1]?.[0]), [w0, s0, r0] = JOLT[i], [w1, s1, r1] = JOLT[i + 1];
    const q = ease((ph - w0) / (w1 - w0));
    el.style.transform = `skewX(-8deg) scale(${lerp(s0, s1, q)}) rotate(${lerp(r0, r1, q)}deg)`;
  });
  // on and off, by the clock: a class toggled every `period` seconds
  const blink = (el, cls, period, invert = false) => movers.push((t) => el.classList.toggle(cls, (Math.floor(t / period) % 2 === 0) !== invert));

  const glint = (cls, cx, cy, r) => {
    const el = place(put(`<div class="glint ${cls}" aria-hidden="true"><svg viewBox="-1 -1 2 2"><path d="${GLINT}"/></svg></div>`), cx - r, cy - r, r * 2, r * 2);
    twinkle(el.querySelector('path'), cls === 'b' ? 1.2 : 0);
    return el;
  };
  const oval = (size) => { const el = put('<div class="oval" aria-hidden="true"><span>As Seen On<br>Every Website</span></div>'); el.style.fontSize = size + 'px'; return el; };
  const cards = (x, top, w) => {
    const el = put('<div class="cards" aria-hidden="true"><i class="c1"><b>FREE</b></i><i class="c2"><b>Gratis</b></i><i class="c3"><b>$0.00</b></i><i class="c4"><b>NO CHARGE</b></i></div>');
    Object.assign(el.style, { left: x + 'px', top: top + 'px', transform: `scale(${w / 436})` });
    return (62 * w) / 436;
  };
  const card = (x, top, scale, turn = -1.4) => {
    const el = put('<div class="card" role="img" aria-label="The Internet (All Of It). Was 100%, now 70%."><div class="hd">The Internet (All Of It)</div><div class="ln">WAS: <s>100%</s></div><div class="ln">NOW:</div><div class="big">70%</div></div>');
    Object.assign(el.style, { left: x + 'px', top: top + 'px', transform: `scale(${scale}) rotate(${turn}deg)` });
    jolt(el.querySelector('.big'), 1.1);
    return el;
  };
  let globeFrames = null;
  const globe = (cx, cy, d) => {
    const k = d / 374, box = 480 * k, x = cx - 240 * k, y = cy - (47 + 187) * k;
    if (globeFrames) {
      const c = put('<canvas class="globe" aria-hidden="true"></canvas>'), dpr = Math.min(2, devicePixelRatio || 1);
      c.width = Math.round(box * dpr); c.height = Math.round(box * dpr); place(c, x, y, box, box);
      const g = c.getContext('2d'); let shown = -1;
      movers.push((t) => { const i = Math.floor(t * 15) % 60; if (i !== shown) { shown = i; g.clearRect(0, 0, c.width, c.height); g.drawImage(globeFrames[i], 0, 0, c.width, c.height); } });
    } else {
      place(put(`<img class="globe" alt="" src="${IMG.globe}">`), x, y, box, box);
    }
  };
  const glow = (cx, cy, d) => place(put('<div class="glow" aria-hidden="true"></div>'), cx - d * 1.3, cy - d * 1.45, d * 2.6, d * 2.9);

  // ---- the countdown: to midnight at the start of Black Friday (the day after the fourth Thursday
  //      of November), in the visitor's own time; on the day itself, to the day's end ----
  const blackFriday = (y) => { const first = new Date(y, 10, 1).getDay(); return new Date(y, 10, 1 + ((4 - first + 7) % 7) + 21 + 1); };
  function countdown(now = new Date()) {
    let y = now.getFullYear(), start = blackFriday(y), end = new Date(y, 10, start.getDate() + 1);
    if (now >= end) { start = blackFriday(y + 1); end = new Date(y + 1, 10, start.getDate() + 1); }
    return now >= start ? { today: true, to: end } : { today: false, to: start };
  }
  // the clock's case, its digits filled in by the clock; fitted into w x h, placed by its top at y
  function clock(x, y, w, h, align, dry = false) {
    const cd = countdown(), left = cd.to - Date.now();
    const days = Math.floor(left / 864e5), dDigits = Math.max(2, String(days).length);
    const units = cd.today ? [['HRS', 2], ['MIN', 2], ['SEC', 2], ['FRM', 2]] : [['DAYS', dDigits], ['HRS', 2], ['MIN', 2], ['SEC', 2], ['FRM', 2]];
    const html = units.map(([name, n], i) => `${i ? '<span class="colon">:</span>' : ''}<span class="u${name === 'FRM' ? ' fr' : ''}"><span class="dd">${'<em>0</em>'.repeat(n)}</span><i>${name}</i></span>`).join('');
    const head = cd.today ? 'TODAY ONLY!' : 'LIMITED TIME';
    const el = put(`<div class="clock" role="timer" aria-label="${head}"><div class="ch"><span class="dot"></span><span>${head}</span><span class="dot"></span></div><div class="row">${html}</div></div>`);
    el.style.fontSize = '100px';
    if (dry) { const r = el.offsetHeight / el.offsetWidth; el.remove(); return r; }
    const k = Math.min(w / el.offsetWidth, h / el.offsetHeight), f = 100 * k;
    el.style.fontSize = f + 'px';
    const cw = el.offsetWidth, ch = el.offsetHeight, cx = align === 'right' ? x - cw : align === 'center' ? x - cw / 2 : x;
    at(el, cx, y);
    const ems = [...el.querySelectorAll('.u')].map((u) => [...u.querySelectorAll('em')]);
    for (const d of el.querySelectorAll('.ch .dot')) blink(d, 'off', 0.4);
    let shown = '', rebuilt = false;
    movers.push(() => {
      const ms = cd.to - Date.now();
      if (ms <= 0) { if (!rebuilt) { rebuilt = true; requestAnimationFrame(build); } return; }
      const sec = Math.floor(ms / 1000), vals = [Math.floor(sec / 86400), Math.floor(sec / 3600) % 24, Math.floor(sec / 60) % 60, sec % 60, Math.floor((ms % 1000) / 40)];
      if (cd.today) { vals[1] = Math.floor(sec / 3600); vals.shift(); }
      const str = vals.map((v, i) => String(v).padStart(units[i][1], '0')).join('|');
      if (str === shown) return;
      const parts = str.split('|'), old = shown.split('|'); shown = str;
      parts.forEach((v, i) => { if (v !== old[i]) [...v].forEach((c, j) => { if (ems[i][j] && ems[i][j].textContent !== c) ems[i][j].textContent = c; }); });
    });
    return { x: cx, y, w: cw, h: ch, f, el };
  }
  // the ACT NOW! starburst, d across, centred at cx, cy
  function burst(cx, cy, d, turn) {
    const pts = []; const n = 18;
    for (let i = 0; i < n * 2; i++) { const a = (i / (n * 2)) * Math.PI * 2, r = i % 2 ? 0.8 : 1; pts.push(`${(Math.cos(a) * r).toFixed(3)},${(Math.sin(a) * r).toFixed(3)}`); }
    const el = put(`<div class="burst" aria-hidden="true"><svg viewBox="-1.1 -1.1 2.2 2.2"><polygon points="${pts.join(' ')}" transform="translate(0.06 0.07)" fill="rgba(6,8,70,0.9)"/><polygon points="${pts.join(' ')}" fill="#fff035" stroke="#000" stroke-width="0.05" stroke-linejoin="round"/><circle r="0.66" fill="none" stroke="#ff1616" stroke-width="0.035"/></svg><span>ACT<br>NOW!</span></div>`);
    place(el, cx - d / 2, cy - d / 2, d, d); el.style.fontSize = d * 0.2 + 'px';
    movers.push((t) => { const ph = (t / 0.8) % 1, q = ph < 0.2 ? ease(ph / 0.2) : ph < 0.4 ? 1 - ease((ph - 0.2) / 0.2) : 0; el.style.transform = `rotate(${turn}deg) scale(${1 + 0.08 * q})`; });
    return el;
  }
  // the banner: red, full width, bulbs along each edge, its lines centred on it
  function banner(top, h, bulbH, lines) {
    const band = place(put('<div class="band" aria-hidden="true"></div>'), -20, top, p.clientWidth + 40, h);
    band.style.fontSize = bulbH + 'px';
    const B = bulbH * 1.5;
    for (const y of [top + bulbH * 0.35, top + h - bulbH * 1.35]) {
      const b = place(put('<div class="bulbs" aria-hidden="true"></div>'), 0, y, p.clientWidth, bulbH);
      Object.assign(b.style, { backgroundSize: `${B * 2}px ${bulbH}px`,
        backgroundImage: `radial-gradient(circle at ${B * 0.5}px 50%, #fffbd0 0 ${bulbH * 0.16}px, #ffd400 ${bulbH * 0.3}px, rgba(255,212,0,0.5) ${bulbH * 0.38}px, rgba(255,212,0,0) ${bulbH * 0.5}px),` +
                         `radial-gradient(circle at ${B * 1.5}px 50%, #b54a00 0 ${bulbH * 0.26}px, rgba(90,10,0,0) ${bulbH * 0.34}px)` });
      movers.push((t) => { b.style.backgroundPosition = `${(Math.floor(t / 0.16) % 2) * B}px 0`; });
    }
    for (const [text, size, y, tag] of lines) setC('head bf', text, HEAD, -0.05, size, p.clientWidth / 2, y, true, tag);
  }

  // ---- one layout pass, for the window as it is ----
  function build() {
    p.textContent = ''; movers = [];
    const W = p.clientWidth, H = p.clientHeight, tall = W / H < 1;
    const REF = tall ? [1080, 1700] : [1280, 800];
    const s = Math.min(W / REF[0], H / REF[1]);
    const ox = (W - REF[0] * s) / 2, m = (tall ? 60 : 48) * s;

    $('.soft').setAttribute('stdDeviation', `${1.25 * s} ${0.5 * s}`);
    $('.halo').setAttribute('stdDeviation', `${5 * s} ${0.6 * s}`);
    $('.smear').setAttribute('stdDeviation', `${10 * s} ${1.6 * s}`);
    $('.late').setAttribute('dx', 7 * s); $('.late').setAttribute('dy', 1.7 * s);
    $('.bloom').setAttribute('stdDeviation', 14 * s);
    $('.blotch').setAttribute('baseFrequency', `${0.042 / s} ${0.167 / s}`);
    $('.static').setAttribute('baseFrequency', `${0.19 / s} ${0.71 / s}`);

    const tiles = put('<div class="tiles" aria-hidden="true"></div>');
    place(tiles, -W * 0.3, -H * 0.3, W * 1.6, H * 1.6);
    Object.assign(tiles.style, { backgroundImage: `url(${IMG.tile})`, backgroundSize: `${260 * s}px ${224 * s}px` });

    // the bottom: the crawl, the credits over it, the order bar over them
    const tick = Math.max(16, (tall ? 58 : 38) * s), crawlH = (tall ? 86 : 54) * s;
    const byFont = Math.max(10, (tall ? 26 : 15) * s);
    const credits = put(`<div class="by"><span class="gme">Brought to you by Gary Mustard Enterprises</span><span class="sep first" aria-hidden="true">✦</span><span class="names"><a href="${GARRETT}">Garrett Musar</a><span class="sep" aria-hidden="true">✦</span><a href="${AUFBAU}">Aufbau</a></span></div>`);
    credits.style.fontSize = byFont + 'px'; at(credits, 0, 0);
    const byTwo = credits.scrollWidth > W * 0.94;
    if (byTwo) credits.classList.add('two');
    const byH = byFont * (byTwo ? 3.4 : 2.1), crawlTop = H - crawlH, byTop = crawlTop - byH;
    place(credits, 0, byTop, W, byH);

    const orderH = (tall ? 150 : 92) * s, orderTop = byTop - orderH;
    const order = put(`<a class="order" href="${STORE}" aria-label="ADD TO CHROME"><span class="lead"><span class="op">OPERATORS STANDING BY</span><span class="np">No purchase necessary!</span></span><span class="go">ADD TO CHROME <i aria-hidden="true">→</i></span><span class="item">ITEM #30<br>TODAY</span></a>`);
    order.querySelector('.item').innerHTML = countdown().today ? 'ITEM #30<br>TODAY ONLY' : 'ITEM #30<br>ACT NOW';
    place(order, 0, orderTop, W, orderH);
    let of = orderH * 0.4; order.style.fontSize = of + 'px';
    const need = () => [...order.children].reduce((a, c) => a + c.offsetWidth, 0) + of * 0.9 * (order.children.length - 1) + of;
    if (need() > W * 0.94) order.querySelector('.item').remove();
    if (need() > W * 0.94) order.querySelector('.lead').remove();
    if (need() > W * 0.9) { of *= (W * 0.9) / need(); order.style.fontSize = of + 'px'; }
    blink(order.querySelector('.go'), 'lit', 0.4);

    (tall ? tallFrame : wideFrame)();
    p.append(order, credits); // over the picture

    // ---- wide: the banner across the top; the globe large on the left, its top tucked under the
    //      banner; down the right, the clock hanging from the banner, then the offer ----
    function wideFrame() {
      const L = ox * 0.35 + m, R = W - ox * 0.35 - m, x0 = L + (R - L) * 0.43;
      const bTop = tick + 8 * s, bulbH = 15 * s, bH = 150 * s;
      const bSize = Math.min((W - 2 * Math.max(m, 24)) / headW('BLACK FRIDAY ONLY!'), (bH - 2 * bulbH - 34 * s) / HCAP);
      const midTop = bTop + bH, midBot = orderTop;
      // the globe, behind the banner
      const gd = Math.min((midBot - midTop) * 0.97, (x0 - L) * 1.0), gcx = Math.max(L + gd * 0.47, (L + x0) / 2 - 18 * s), gcy = midTop + (midBot - midTop) * 0.5 + 4 * s;
      glow(gcx, gcy, gd * 1.2);
      globe(gcx, gcy, gd);
      banner(bTop, bH, bulbH, [['BLACK FRIDAY ONLY!', bSize, bTop + bH / 2 + (HCAP * bSize) / 2, 'p']]);
      // the clock, hanging from the banner's right side
      const ck = clock(R, midTop - 14 * s, R - x0, Math.min(150 * s, (midBot - midTop) * 0.36), 'right');
      const bd = Math.min(132 * s, ck.h * 1.05); burst(ck.x - bd * 0.3, ck.y + ck.h * 0.6, bd, -12);
      // the offer, under the clock, to the right column's width
      const lo = ck.y + ck.h + 26 * s, hi = midBot - 22 * s, cw = R - x0;
      const hs0 = Math.min(cw / headW('30% OFF'), bSize * 0.9), ss0 = Math.min((cw * 0.98) / subW('EVERYTHING ON THE INTERNET.'), hs0 * 0.42);
      const cardsW = cw * 0.8;
      const hOf = (withCards) => HCAP * hs0 + 24 * s + SCAP * ss0 + (withCards ? 26 * s + (62 * cardsW) / 436 : 0);
      const withCards = hOf(true) <= (hi - lo) * 1.05;
      const k = Math.min(1, (hi - lo) / hOf(withCards));
      const cx = (x0 + R) / 2;
      let y = lo + (hi - lo - hOf(withCards) * k) / 2 + HCAP * hs0 * k;
      setC('head', '30% OFF', HEAD, -0.05, hs0 * k, cx, y, true, 'h1');
      y += 24 * s * k + SCAP * ss0 * k; setC('sub', 'EVERYTHING ON THE INTERNET.', SUB, -0.04, ss0 * k, cx, y, false, 'h2');
      if (withCards) cards(cx - (cardsW * k) / 2, y + 26 * s * k, cardsW * k);
      // the globe's furniture: the badge, the price card, the glints
      const r = gd / 2, o = oval(Math.max(13, 34 * s * Math.min(1.15, gd / (420 * s)) ** 0.5));
      at(o, Math.max(L - 10 * s, gcx - r * 0.98 - o.offsetWidth * 0.3), Math.max(midTop + 14 * s, gcy - r * 0.62));
      const cs = Math.min(0.5 * s, (gd * 0.42) / 400);
      card(Math.max(4, gcx + r * 0.38 - 200 * cs), midBot - 360 * cs - 6 * s, cs, 2.5);
      glint('', gcx - r * 0.66, gcy - r * 0.86, gd * 0.07);
      glint('b', gcx + r * 0.96, gcy + r * 0.1, gd * 0.045);
    }

    // ---- tall: the banner on two lines, the clock under it, the globe, the offer, the order bar ----
    function tallFrame() {
      const cw = Math.min(W - 2 * Math.max(m, 14), (REF[0] - 2 * 70) * s * 1.2), bTop = tick + 6 * s, bulbH = 20 * s, u = cw / ((REF[0] - 140) * s);
      const ckR = clock(0, 0, 1, 1, 'left', true);
      const hs0 = Math.min((cw * 0.86) / headW('30% OFF'), (cw * 1.02) / headW('BLACK FRIDAY') * 1.4), ss0 = (cw * 0.94) / subW('EVERYTHING ON');
      const offerH = HCAP * hs0 + 34 * s * u + SCAP * ss0 + 16 * s * u + SCAP * ss0;
      const d0 = 470 * s * u, gapC = 30 * s * u, gapG = 30 * s * u, natural = gapC + d0 + gapG + offerH;
      // the banner and the clock: as wide as the column, unless that leaves the globe and the offer too little room
      const top = (fz) => {
        const b1 = (cw * fz * 1.02) / headW('BLACK FRIDAY'), b2 = Math.min((cw * fz * 1.02) / headW('ONLY!'), b1 * 1.55);
        const pad = bulbH * 2 + 26 * s * u * fz, bH = pad * 2 + HCAP * b1 + 26 * s * u * fz + HCAP * b2 - 10 * s * u * fz;
        return { b1, b2, pad, bH, ckH: Math.min(210 * s * u * fz, cw * fz * ckR), fz };
      };
      let T = top(1);
      for (const fz of [0.94, 0.88, 0.82, 0.76, 0.7]) {
        if ((orderTop - 26 * s - (bTop + T.bH - 18 * s * u + T.ckH)) / natural >= 0.95) break;
        T = top(fz);
      }
      const { b1, b2, pad, bH, fz } = T;
      const bottomOfLines = bTop + bH - pad + 5 * s * u * fz;
      // the clock first (its fitted size decides the rest); put back on top at the end
      const ck = clock(W / 2, bTop + bH - 18 * s * u, cw * fz, T.ckH, 'center');
      const bd = Math.min(150 * s * u, ck.h * 0.95), bu = burst(Math.min(ck.x + ck.w - 4 * s, W - bd * 0.52), ck.y - 4 * s, bd, 14);
      const lo = ck.y + ck.h, room = orderTop - 26 * s - lo, k = Math.min(1, room / natural);
      let spare = room - natural * k, d = d0 * k;
      const grow = Math.max(0, Math.min(spare * 0.75, cw * 1.02 - d)); d += grow; spare -= grow;
      const gy = lo + gapC * k + spare * 0.3, gcx = W / 2, gcy = gy + d / 2;
      glow(gcx, gcy, d * 1.2);
      globe(gcx, gcy, d);
      banner(bTop, bH, bulbH, [['BLACK FRIDAY', b1, bTop + pad + HCAP * b1, 'p'], ['ONLY!', b2, bottomOfLines, 'span']]);
      p.append(ck.el, bu);
      // the globe's badge, price card, glints
      const r = d / 2, o = oval(Math.max(12, 40 * s * u * Math.max(k, d / (470 * s * u)) ** 0.5));
      at(o, Math.max(6, gcx - r * 1.02 - o.offsetWidth * 0.25), gcy - r * 0.55);
      const cs = Math.min(0.62 * s * u, (d * 0.46) / 400);
      card(Math.min(W - 400 * cs - 8, gcx + r * 0.42), gcy + r * 0.2, cs, 3);
      glint('', gcx - r * 0.7, gcy - r * 0.78, d * 0.07);
      glint('b', gcx + r * 0.95, gcy - r * 0.3, d * 0.045);
      // the offer
      let y = gy + d + gapG * k + spare * 0.3 + HCAP * hs0 * k;
      setC('head', '30% OFF', HEAD, -0.05, hs0 * k, W / 2, y, true, 'h1');
      y += 34 * s * u * k + SCAP * ss0 * k; setC('sub', 'EVERYTHING ON', SUB, -0.04, ss0 * k, W / 2, y, false, 'h2');
      y += 16 * s * u * k + SCAP * ss0 * k; setC('sub', 'THE INTERNET.', SUB, -0.04, ss0 * k, W / 2, y, false);
    }

    // ---- the ticker along the top (Garrett's lines, BUT WAIT… THERE'S LESS! first among them) and the crawl ----
    const tk = put(`<div class="ticker" aria-hidden="true"><span>${TICKER.repeat(6)}</span></div>`);
    Object.assign(tk.style, { top: 0, height: tick + 'px', fontSize: tick * 0.66 + 'px', lineHeight: tick + 'px' });
    const air = put('<div class="onair" aria-hidden="true"><i></i>ON AIR</div>');
    Object.assign(air.style, { left: 0, top: 0, height: tick + 'px', fontSize: tick * 0.5 + 'px' });
    blink(air.querySelector('i'), 'off', 0.6);
    const cr = put(`<div class="crawl" aria-hidden="true"><span>${CRAWL.repeat(10)}</span></div>`);
    Object.assign(cr.style, { top: crawlTop + 'px', height: crawlH + 'px', fontSize: crawlH * 0.62 + 'px', lineHeight: crawlH + 'px' });
    const tks = tk.firstElementChild, crs = cr.firstElementChild, tkRep = tks.offsetWidth / 6, crRep = crs.offsetWidth / 10;
    const tkV = tick * 1.5, crV = crawlH * 2.6;
    movers.push((t) => {
      tks.style.transform = `translateX(${-(((t + 3) * tkV) % tkRep)}px)`;
      crs.style.transform = `translateX(${-(((t + 3) * crV) % crRep)}px) skewX(-9deg)`;
    });
    render(clockT());
  }

  // ---- the clock everything moves by ----
  const t0 = performance.now(), clockT = () => (still ? 0 : Math.floor(((performance.now() - t0) / 1000) * FPS) / FPS);
  const blotch = $('.blotch'), grain = $('.static');
  function render(t) {
    for (const move of movers) move(t);
    const f = Math.round(t * FPS); blotch.setAttribute('seed', BLOTCH[Math.floor(f / 4) % 6]); grain.setAttribute('seed', STATIC[Math.floor(f / 2) % 6]);
  }

  build();
  let pending = 0;
  addEventListener('resize', () => { cancelAnimationFrame(pending); pending = requestAnimationFrame(build); });
  if (still) setInterval(() => render(0), 1000); // the countdown still counts, once a second
  else {
    let last = -1;
    const frame = () => { const t = clockT(); if (t !== last) { last = t; render(t); } requestAnimationFrame(frame); };
    requestAnimationFrame(frame);
    if ('ImageDecoder' in window) (async () => {
      try {
        const dec = new ImageDecoder({ data: await (await fetch(IMG.globe)).arrayBuffer(), type: 'image/webp' });
        await dec.tracks.ready;
        const n = dec.tracks.selectedTrack.frameCount, frames = [];
        for (let i = 0; i < n; i++) { const { image } = await dec.decode({ frameIndex: i }); frames.push(await createImageBitmap(image)); image.close(); }
        dec.close();
        if (n === 60) { globeFrames = frames; build(); }
      } catch {}
    })();
  }

  // the slow-machine fallback: if the page draws slowly with the tape look, take it off (and put it back if that made no difference)
  const frameRate = () => new Promise((resolve) => {
    let frames = 0, drawing = 0, last = 0;
    const tick = (now) => { const gap = now - last; if (last && gap < 1000) { frames++; drawing += gap; } last = now; if (drawing < 2000) requestAnimationFrame(tick); else resolve((frames * 1000) / drawing); };
    requestAnimationFrame(tick);
  });
  if (!still && !query.has('keep')) {
    await new Promise((r) => setTimeout(r, 1200));
    const withLook = await frameRate();
    if (withLook < 24) {
      p.style.filter = 'none';
      if ((await frameRate()) < withLook * 1.5) p.style.removeProperty('filter');
    }
  }
})();
</script>
</body>
</html>
