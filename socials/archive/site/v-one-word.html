<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>30% Off EVERYTHING</title>
<meta name="description" content="A Black Friday treat for your browser: 30% off every website you visit. Black Friday only.">
<link rel="icon" href="{{img:favicon}}">
<!-- Variant "one-word": minimal hierarchy, maximum scale. One phrase is big: 30% OFF, set across
     nearly the whole frame, the turning globe sitting in the counter of its O. EVERYTHING ON THE
     INTERNET. is one line under it. BLACK FRIDAY ONLY! is a red tag slapped over the 3's corner, and
     BUT WAIT… THERE'S LESS! is demoted to a small white starburst sticker and the ticker. The clutter
     is furniture: the ON AIR ticker, the cards row, glints, the ORDER tape and the crawl.
     Everything that moves runs off one clock at 25 frames a second (no CSS animation). -->
<style>
{{fonts}}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; background: #070f9c; }
body { -webkit-font-smoothing: antialiased; }
#p { position: fixed; inset: 0; overflow: hidden; background: linear-gradient(#0a1cc4, #0a22d6 45%, #070f9c); filter: url(#tape);
     --yellow: #fff035; --shade: #0a0f66; --red: #ff1616; user-select: none; }
#p > * { position: absolute; display: block; max-width: none; }
#p img { -webkit-user-drag: none; }
.defs { position: absolute; width: 0; height: 0; }
/* faint scanlines and dark corners over everything, as on the banner */
.lines { position: fixed; inset: 0; pointer-events: none; z-index: 2;
         background: repeating-linear-gradient(rgba(0, 0, 16, 0) 0, rgba(0, 0, 16, 0.05) 1.5px, rgba(0, 0, 16, 0) 3px),
                     radial-gradient(farthest-corner at 50% 50%, rgba(0, 0, 0, 0) 0%, rgba(0, 0, 0, 0.03) 50%, rgba(0, 0, 0, 0.08) 71%, rgba(0, 0, 0, 0.13) 85%, rgba(0, 0, 0, 0.21) 100%); }

.glow { border-radius: 50%; background: radial-gradient(closest-side, #58c4ff 0%, #2a8cff 22%, #1348ee 44%, transparent 72%); }
.tiles { background-repeat: repeat; opacity: 0.095; transform: rotate(-6deg); }

/* lettering, placed by baseline and ink edge (see set()) */
.t { white-space: nowrap; line-height: 1; }
.head { font-family: "Archivo Black", "Arial Black", sans-serif; color: var(--yellow); letter-spacing: -0.05em;
        text-shadow: 0.009em 0.009em 0 var(--shade), 0.018em 0.018em 0 var(--shade), 0.027em 0.027em 0 var(--shade),
                     0.036em 0.036em 0 var(--shade), 0.045em 0.045em 0 var(--shade), 0.054em 0.054em 0 var(--shade); }
.sub { font: italic 700 1em "Arimo", Arial, sans-serif; letter-spacing: -0.04em;
       background: linear-gradient(#fff 35%, #c5d4fb 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
       filter: drop-shadow(0.045em 0.045em 0 rgba(6, 8, 70, 0.95)); padding: 0 0.1em 0.06em 0; }

.glint svg { display: block; width: 100%; height: 100%; overflow: visible; fill: #fff; }
.glint path { filter: drop-shadow(0 0 0.08px #fff) drop-shadow(0 0 0.22px #9fd4ff); transform-box: fill-box; transform-origin: center; }

.ticker, .crawl { left: 0; right: 0; overflow: hidden; white-space: nowrap; pointer-events: none; }
.ticker { top: 0; font-family: "Antonio", "Arial Narrow", sans-serif; font-weight: 300; letter-spacing: 0.035em; word-spacing: 0.3em;
          color: #e9f0ff; text-shadow: 0.06em 0.06em 0 rgba(4, 8, 80, 0.85); }
.ticker span { display: inline-block; }
.crawl { bottom: 0; font-family: "Archivo Black", "Arial Black", sans-serif; color: var(--yellow); letter-spacing: -0.02em; word-spacing: 0.08em; }
.crawl span { display: inline-block; text-shadow: 0.027em 0.027em 0 var(--shade), 0.054em 0.054em 0 var(--shade), 0.08em 0.08em 0 var(--shade); }

/* the tapes: the yellow one is the link to the store, the navy one carries the credits */
.strip { display: flex !important; align-items: center; justify-content: center; white-space: nowrap; font: italic 700 1em "Arimo", Arial, sans-serif; transform-origin: center; }
.tape { background: linear-gradient(#fffb86, #f0e11c); color: #111; text-decoration: none; cursor: pointer; }
.tape .say { margin-right: 0.7em; }
.tape .go { display: inline-flex; align-items: center; gap: 0.4em; padding: 0.16em 0.62em 0.2em; background: #111; color: var(--yellow); font-style: normal;
            font-family: "Archivo Black", "Arial Black", sans-serif; letter-spacing: -0.01em; }
.tape .go i { font: 900 1em/1 Arial, Helvetica, sans-serif; display: inline-block; }
/* hover: at once, no easing in (every change has to go through the filter, so it should be one change) */
.tape:hover, .tape:focus-visible { outline: none; background: linear-gradient(#fffdb8, #fff035); }
.tape:hover .go, .tape:focus-visible .go { background: var(--red); color: #fff; }
.tape:hover .go i, .tape:focus-visible .go i { transform: translateX(0.18em); }
.tape:focus-visible .go { outline: 0.08em solid #fff; outline-offset: 0.08em; }
.by { background: var(--shade); color: #fff; letter-spacing: 0.08em; text-transform: uppercase; }
.by .sep { margin: 0 0.9em; color: var(--yellow); }
.by.two { flex-direction: column; gap: 0.3em; line-height: 1; }  /* a narrow screen: the credits under the sign-off */
.by.two .sep.first { display: none; }
.by a { color: #fff; text-decoration: none; border-bottom: 0.12em solid var(--yellow); padding-bottom: 0.05em; }
.by a:hover, .by a:focus-visible { color: var(--yellow); outline: none; }

/* the price card; only its 70% moves */
.card { width: 400px; height: 306px; background: #f3f4f6; color: #0c0c0c; border: 5px solid #000; box-shadow: 8px 8px 0 rgba(4, 6, 60, 0.92);
        transform-origin: left top; font: italic 700 50px/1 "Arimo", Arial, sans-serif; }
.card .hd { background: var(--red); color: #fff46a; font: 600 41px/57px "Antonio", "Arial Narrow", sans-serif; padding: 0 15px; border-bottom: 5px solid #000; white-space: nowrap; overflow: hidden; }
.card .ln { padding: 13px 17px 0; }
.card s { position: relative; text-decoration: none; color: #6b6f78; margin-left: 9px; }
.card s::after { content: ""; position: absolute; left: -8%; right: -8%; top: 46%; height: 8px; background: var(--red); transform: rotate(-11deg); box-shadow: 0 0 0 2px #000; }
.card .big { position: absolute; right: 9px; bottom: -54px; font: 400 165px/0.9 "Archivo Black", "Arial Black", sans-serif; color: var(--red); letter-spacing: -0.05em;
             -webkit-text-stroke: 11px #000; paint-order: stroke fill; transform: skewX(-8deg); transform-origin: 70% 80%; }

/* BLACK FRIDAY ONLY!, as a red tag */
.tag { display: inline-block !important; white-space: nowrap; background: var(--red); color: var(--yellow); border: 0.07em solid #000;
       font: 400 1em/1 "Archivo Black", "Arial Black", sans-serif; letter-spacing: -0.01em; padding: 0.2em 0.42em 0.24em;
       box-shadow: 0.12em 0.12em 0 rgba(6, 8, 70, 0.9); transform: rotate(-2deg); transform-origin: left center; text-shadow: 0.05em 0.05em 0 #7a0006; }

/* the As Seen On badge (its size from its type) and the four cards (laid out 436 x 62, then scaled) */
.oval { width: 7.6em; height: 3.31em; border-radius: 50%; display: grid !important; place-items: center; text-align: center;
        font: italic 700 1em/0.98 "Tinos", "Times New Roman", serif; background: radial-gradient(ellipse at 40% 30%, #fffc9a, #efe01c 72%); color: #151515;
        transform: rotate(-7deg); box-shadow: 0.143em 0.167em 0 rgba(6, 8, 70, 0.9), inset 0 0 0 0.095em rgba(170, 158, 0, 0.5); }
.cards { display: flex !important; gap: 12px; width: 436px; transform-origin: left top; font: italic 700 19px/1 "Arimo", Arial, sans-serif; letter-spacing: 0.02em; }
.cards i { flex: none; position: relative; display: block; width: 100px; height: 62px; border-radius: 7px; overflow: hidden; box-shadow: 3px 3px 0 rgba(6, 8, 70, 0.85); }
.cards b { position: absolute; left: 0; right: 0; bottom: 5px; text-align: center; }
.cards .c1 { background: linear-gradient(#f4f4f4 0 34%, #1c3fd1 34% 62%, #f1b400 62%); color: #111; }
.cards .c2 { background: radial-gradient(circle at 50% 40%, #ffb300 0 30%, transparent 31%), #f6f6f6; color: #111; }
.cards .c3 { background: linear-gradient(135deg, #7fd4ff, #2a79d8); color: #fff; }
.cards .c4 { background: linear-gradient(#151515, #3a2a00); color: #ffcf2e; }
.cards .c4 b { font-size: 14.5px; }


/* ---- this variant's furniture ---- */
.ticker { background: linear-gradient(#0d1aa8, #050b6e); box-shadow: 0 0.08em 0 var(--yellow), 0 0.16em 0 rgba(4, 6, 60, 0.6); }
.ticker em { font-style: normal; font-weight: 600; color: var(--yellow); }
.air { display: flex !important; align-items: center; gap: 0.35em; padding: 0 0.6em; background: var(--red); color: #fff; font: 600 1em/1 "Antonio", "Arial Narrow", sans-serif;
       letter-spacing: 0.08em; box-shadow: 0.25em 0 0 rgba(4, 6, 60, 0.85); }
.air b { display: block; width: 0.55em; height: 0.55em; border-radius: 50%; background: #fff; }
.air b.off { background: #7a0006; }
.bugbox { display: flex !important; align-items: center; justify-content: center; background: #050b6e; box-shadow: -0.25em 0 0 rgba(4, 6, 60, 0.85); }
.bugbox img { height: 78%; width: auto; display: block; opacity: 0.92; }
.tag.slap { transform-origin: center; }
.burst svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; filter: drop-shadow(0.06em 0.07em 0 rgba(6, 8, 70, 0.9)); }
.burst polygon { fill: #fff; stroke: #000; stroke-width: 0.035; stroke-linejoin: round; }
.burst span { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; line-height: 0.92; }
.burst .w { font: italic 700 0.7em/1 "Arimo", Arial, sans-serif; color: #0a0f66; letter-spacing: -0.02em; margin-bottom: 0.12em; }
.burst .l { font: 400 1em/0.95 "Archivo Black", "Arial Black", sans-serif; color: var(--red); letter-spacing: -0.03em; }
.tab { display: flex !important; align-items: center; padding: 0 0.7em; white-space: nowrap; font: 600 1em/1 "Antonio", "Arial Narrow", sans-serif; letter-spacing: 0.1em;
       background: var(--shade); color: #fff; clip-path: polygon(0 0, calc(100% - 0.7em) 0, 100% 100%, 0 100%); }
.tab.r { background: var(--red); color: var(--yellow); clip-path: polygon(0.7em 0, 100% 0, 100% 100%, 0 100%); }
.tape.level .go { padding: 0.2em 0.7em 0.24em; box-shadow: 0.1em 0.1em 0 rgba(0, 0, 0, 0.35); }
.tape.level .go.lit { background: var(--red); color: #fff; }
.tape.level:hover .go, .tape.level:focus-visible .go { background: #fff; color: var(--red); }
.by.level { letter-spacing: 0.06em; }
</style>
</head>
<body>
<main id="p" aria-label="30% Off EVERYTHING: 30% off every website. Black Friday only."></main>
<div class="lines" aria-hidden="true"></div>
<script>
(async () => {
  const STORE = '{{link:store}}', GARRETT = '{{link:garrett}}', AUFBAU = '{{link:aufbau}}';
  const query = new URLSearchParams(location.search);
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const IMG = { globe: still ? '{{img:globe_still}}' : '{{img:globe_anim}}', tile: '{{img:tile}}', logo: '{{img:logo}}' };
  const TICKER = '<em>BUT WAIT… THERE’S LESS!</em> ✦ No purchase necessary! ✦ Every website, 30% off! ✦ Works like magic! ✦ As Seen On Every Website ✦ Black Friday only! ✦ ';
  const CRAWL = 'BLACK FRIDAY ONLY! ✦ 30% OFF EVERYTHING ✦ ';
  const GLINT = 'M0,-1 C0.06,-0.22 0.22,-0.06 1,0 C0.22,0.06 0.06,0.22 0,1 C-0.06,0.22 -0.22,0.06 -1,0 C-0.22,-0.06 -0.06,-0.22 0,-1Z';
  const TAN9 = Math.tan((9 * Math.PI) / 180);
  const FPS = 25; // the clock everything moves by: a PAL picture's rate
  // ---- the tape look: the live banner's filter (src/content.js), distances set in build(), the noise moved on by the clock ----
  const LUMA = '0.299 0.587 0.114 0 0';
  const tint = (i, q) => `${i * 0.22} ${q * 0.2} 0 0 ${0.5 - 0.5 * (i * 0.22 + q * 0.2)}`;
  const MOTTLE = `${tint(0.956, 0.621)}  ${tint(-0.272, -0.647)}  ${tint(-1.106, 1.703)}  0 0 0 0 1`;
  const GRAIN = `${'0.7 0 0 0 -0.399  '.repeat(3)} 0 0 0 0 1`;
  const add = (extra = '') => `operator="arithmetic" k2="1" k3="1" k4="-0.5" ${extra}`;
  document.body.insertAdjacentHTML('beforeend', `
    <svg class="defs" aria-hidden="true"><filter id="tape" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB">
      <feFlood flood-color="#0a22d6"/><feMerge result="picture"><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
      <feGaussianBlur class="soft" in="picture"/><feColorMatrix type="matrix" values="${LUMA} ${LUMA} ${LUMA} 0 0 0 1 0" result="luma"/>
      <feGaussianBlur class="halo"/><feComposite in="luma" operator="arithmetic" k2="1.42" k3="-0.42" result="sharp"/>
      <feGaussianBlur class="smear" in="picture"/><feOffset class="late"/>
      <feColorMatrix type="matrix" values="0.393 -0.329 -0.064 0 0.5  -0.167 0.231 -0.064 0 0.5  -0.167 -0.329 0.496 0 0.5  0 0 0 1 0"/>
      <feComposite in2="sharp" operator="arithmetic" k2="2" k3="1" k4="-1" result="clean"/>
      <feTurbulence class="blotch" type="fractalNoise" numOctaves="1" seed="3"/>
      <feColorMatrix type="matrix" values="${MOTTLE}"/><feComposite in2="clean" ${add('result="mottled"')}/>
      <feTurbulence class="static" type="fractalNoise" numOctaves="2" seed="2"/>
      <feColorMatrix type="matrix" values="${GRAIN}"/><feComposite in2="mottled" operator="arithmetic" k2="1" k3="1" result="taped"/>
      <feComponentTransfer><feFuncR type="linear" intercept="-0.55"/><feFuncG type="linear" intercept="-0.55"/><feFuncB type="linear" intercept="-0.55"/></feComponentTransfer>
      <feGaussianBlur class="bloom"/><feComposite in2="taped" operator="arithmetic" k2="0.149" k3="0.93" k4="0.037"/>
    </filter></svg>`);
  const $ = (sel) => document.querySelector(sel);
  // the noise: the colour blotches change 6 times a second, the static 12 (every fourth and every other frame)
  const BLOTCH = [3, 11, 7, 19, 5, 13], STATIC = [2, 17, 9, 23, 4, 29];

  await Promise.all(['100px "Archivo Black"', 'italic 700 100px "Arimo"', '300 50px "Antonio"', '600 50px "Antonio"', 'italic 700 50px "Tinos"'].map((f) => document.fonts.load(f)));
  const p = document.getElementById('p');
  const put = (html) => { p.insertAdjacentHTML('beforeend', html); return p.lastElementChild; };
  const place = (el, x, y, w, h) => Object.assign(el.style, { left: x + 'px', top: y + 'px', width: w + 'px', height: h + 'px' });
  const at = (el, x, y) => Object.assign(el.style, { left: x + 'px', top: y + 'px' });

  // Lettering is measured, not guessed: the ink's edges and the cap height of a string, per 1px of type.
  const mc = document.createElement('canvas').getContext('2d');
  function ink(text, font, ls) {
    mc.font = font.replace('SIZE', '200px'); mc.letterSpacing = ls * 200 + 'px';
    const m = mc.measureText(text), k = 1 / 200;
    return { l: -m.actualBoundingBoxLeft * k, r: m.actualBoundingBoxRight * k - ls, cap: mc.measureText('H').actualBoundingBoxAscent * k,
             asc: m.fontBoundingBoxAscent * k, desc: m.fontBoundingBoxDescent * k };
  }
  // Set a line of type with its ink's left edge at x and its baseline at y. skew: the headline's slant.
  function set(cls, text, font, ls, size, x, y, skew, tag = 'div') {
    const i = ink(text, font, ls), el = put(`<${tag} class="t ${cls}">${text}</${tag}>`);
    const base = (1 - (i.asc + i.desc)) / 2 + i.asc;
    Object.assign(el.style, { fontSize: size + 'px', left: x - i.l * size + 'px', top: y - base * size + 'px' });
    if (skew) Object.assign(el.style, { transformOrigin: `0 ${base * size}px`, transform: 'skewX(-9deg)' });
    return el;
  }
  const HEAD = 'SIZE "Archivo Black"', SUB = 'italic 700 SIZE "Arimo"';
  const width = (text, font, ls) => { const i = ink(text, font, ls); return i.r - i.l; };
  const headW = (t) => width(t, HEAD, -0.05) + ink(t, HEAD, -0.05).cap * TAN9; // per 1px of type, slant included
  const subW = (t) => width(t, SUB, -0.04);
  const HCAP = ink('H', HEAD, -0.05).cap, SCAP = ink('H', SUB, -0.04).cap;
  const across = (text, font, size, ls) => { mc.font = `${font} ${size}px ${font.includes('700') ? '"Arimo"' : '"Archivo Black"'}`; mc.letterSpacing = ls * size + 'px'; return mc.measureText(text).width; };

  // ---- what moves, and how, at time t (seconds) ----
  let movers = [];
  const ease = (q) => q * q * (3 - 2 * q);
  const lerp = (a, b, q) => a + (b - a) * q;
  const twinkle = (path, delay) => movers.push((t) => {
    const ph = ((t + delay) / 2.4) % 1, q = ease(ph < 0.5 ? ph * 2 : 2 - ph * 2); // there and back, easing each way
    path.style.transform = `scale(${lerp(0.55, 1, q)}) rotate(${lerp(-10, 12, q)}deg)`; path.style.opacity = lerp(0.75, 1, q);
  });
  const JOLT = [[0, 1, 0], [0.12, 1.18, -5], [0.26, 0.96, 3], [0.4, 1.08, -2], [0.55, 1, 0], [1, 1, 0]]; // when, scale, turn
  const jolt = (el, period) => movers.push((t) => {
    const ph = (t / period) % 1, i = JOLT.findIndex(([w], n) => ph < JOLT[n + 1]?.[0]), [w0, s0, r0] = JOLT[i], [w1, s1, r1] = JOLT[i + 1];
    const q = ease((ph - w0) / (w1 - w0));
    el.style.transform = `skewX(-8deg) scale(${lerp(s0, s1, q)}) rotate(${lerp(r0, r1, q)}deg)`;
  });

  const glint = (cls, cx, cy, r) => {
    const el = place(put(`<div class="glint ${cls}" aria-hidden="true"><svg viewBox="-1 -1 2 2"><path d="${GLINT}"/></svg></div>`), cx - r, cy - r, r * 2, r * 2);
    twinkle(p.lastElementChild.querySelector('path'), cls === 'b' ? 1.2 : 0);
    return el;
  };
  const oval = (size, words) => { const el = put(`<div class="oval"><span>${words}</span></div>`); el.style.fontSize = size + 'px'; return el; };
  const cards = (x, top, w) => {
    const el = put('<div class="cards" aria-label="Free. Gratis. $0.00. No charge."><i class="c1"><b>FREE</b></i><i class="c2"><b>Gratis</b></i><i class="c3"><b>$0.00</b></i><i class="c4"><b>NO CHARGE</b></i></div>');
    Object.assign(el.style, { left: x + 'px', top: top + 'px', transform: `scale(${w / 436})` });
    return (62 * w) / 436;
  };
  const card = (x, top, scale, turn = -1.4) => {
    const el = put('<div class="card" role="img" aria-label="The Internet (All Of It). Was 100%, now 70%."><div class="hd">The Internet (All Of It)</div><div class="ln">WAS: <s>100%</s></div><div class="ln">NOW:</div><div class="big">70%</div></div>');
    Object.assign(el.style, { left: x + 'px', top: top + 'px', transform: `scale(${scale}) rotate(${turn}deg)` });
    jolt(el.querySelector('.big'), 1.1);
  };
  // The globe: its 60 frames drawn onto a canvas by the clock once decoded; until then, a picture. d is the ball's diameter.
  let globeFrames = null;
  const globe = (cx, cy, d) => {
    const k = d / 374, box = 480 * k, x = cx - 240 * k, y = cy - (47 + 187) * k;
    if (globeFrames) {
      const c = put('<canvas class="globe" aria-hidden="true"></canvas>'), dpr = Math.min(2, devicePixelRatio || 1);
      c.width = Math.round(box * dpr); c.height = Math.round(box * dpr); place(c, x, y, box, box);
      const g = c.getContext('2d'); let shown = -1;
      movers.push((t) => { const i = Math.floor(t * 15) % 60; if (i !== shown) { shown = i; g.clearRect(0, 0, c.width, c.height); g.drawImage(globeFrames[i], 0, 0, c.width, c.height); } });
    } else place(put(`<img class="globe" alt="" src="${IMG.globe}">`), x, y, box, box);
  };
  const glow = (cx, cy, d) => place(put('<div class="glow" aria-hidden="true"></div>'), cx - d / 2, cy - d / 2, d, d);

  // The O's counter, found by drawing an O and looking for the hole: its centre (from the O's origin and
  // baseline) and its size, per 1px of type. The globe goes in it.
  const HOLE = (() => {
    const c = document.createElement('canvas'); c.width = 400; c.height = 400; const g = c.getContext('2d', { willReadFrequently: true });
    g.font = '200px "Archivo Black"'; g.fillText('O', 50, 300);
    const px = g.getImageData(0, 0, 400, 400).data, a = (x, y) => px[(y * 400 + x) * 4 + 3] > 128;
    const midY = Math.round(300 - ink('O', HEAD, 0).cap * 100);
    let x = 0; while (x < 400 && !a(x, midY)) x++; while (x < 400 && a(x, midY)) x++; const x0 = x; while (x < 400 && !a(x, midY)) x++; const x1 = x;
    const midX = Math.round((x0 + x1) / 2);
    let y = 0; while (y < 400 && !a(midX, y)) y++; while (y < 400 && a(midX, y)) y++; const y0 = y; while (y < 400 && !a(midX, y)) y++; const y1 = y;
    return { cx: ((x0 + x1) / 2 - 50) / 200, up: (300 - (y0 + y1) / 2) / 200, w: (x1 - x0) / 200, h: (y1 - y0) / 200 };
  })();
  const advance = (text) => { mc.font = '200px "Archivo Black"'; mc.letterSpacing = -0.05 * 200 + 'px'; return mc.measureText(text).width / 200; };

  // a starburst: n points, its spikes' tips on the unit circle
  const BURST = Array.from({ length: 44 }, (_, i) => { const r = i % 2 ? 0.86 : 1, a = (i / 44) * Math.PI * 2; return `${(r * Math.sin(a)).toFixed(3)},${(-r * Math.cos(a)).toFixed(3)}`; }).join(' ');
  const burst = (cx, cy, D, turn) => {
    const el = put(`<div class="burst" role="img" aria-label="But wait… there’s less!"><svg viewBox="-1 -1 2 2" aria-hidden="true"><polygon points="${BURST}"/></svg><span aria-hidden="true"><b class="w">BUT WAIT…</b><b class="l">THERE’S</b><b class="l">LESS!</b></span></div>`);
    place(el, cx - D / 2, cy - D / 2, D, D);
    const f = (D * 0.64) / (across('THERE’S', '400', 100, -0.03) / 100); el.style.fontSize = f + 'px';
    // it pops every so often: up, a shake, back
    movers.push((t) => {
      const ph = (t % 3.2) / 3.2, q = ph < 0.06 ? ease(ph / 0.06) : ph < 0.2 ? 1 - ease((ph - 0.06) / 0.14) : 0;
      el.style.transform = `rotate(${turn + (ph < 0.2 ? Math.sin(ph * 90) * 4 * q : 0)}deg) scale(${1 + 0.12 * q})`;
    });
  };
  // the red tag, slapped on at a turn; anchored by its left end's centre
  const slap = (x, cy, size, turn) => {
    const el = put('<div class="tag slap">BLACK FRIDAY ONLY!</div>'); el.style.fontSize = size + 'px';
    at(el, x, cy - el.offsetHeight / 2); el.style.transform = `rotate(${turn}deg)`; return el;
  };

  // ---- one layout pass, for the window as it is ----
  function build() {
    p.textContent = ''; movers = [];
    const W = p.clientWidth, H = p.clientHeight, tall = W / H < 1;
    const REF = tall ? [1080, 1920] : [1280, 800];
    const s = Math.min(W / REF[0], H / REF[1]);

    // the tape filter's distances, in step with the picture's size
    $('.soft').setAttribute('stdDeviation', `${1.25 * s} ${0.5 * s}`);
    $('.halo').setAttribute('stdDeviation', `${5 * s} ${0.6 * s}`);
    $('.smear').setAttribute('stdDeviation', `${10 * s} ${1.6 * s}`);
    $('.late').setAttribute('dx', 7 * s); $('.late').setAttribute('dy', 1.7 * s);
    $('.bloom').setAttribute('stdDeviation', 14 * s);
    $('.blotch').setAttribute('baseFrequency', `${0.042 / s} ${0.167 / s}`);
    $('.static').setAttribute('baseFrequency', `${0.19 / s} ${0.71 / s}`);

    const tiles = put('<div class="tiles" aria-hidden="true"></div>');
    place(tiles, -W * 0.3, -H * 0.3, W * 1.6, H * 1.6);
    Object.assign(tiles.style, { backgroundImage: `url(${IMG.tile})`, backgroundSize: `${260 * s}px ${224 * s}px` });

    // ---- the bands: ticker on top; the ORDER tape, the credits and the crawl along the bottom ----
    const tick = Math.max(26, (tall ? 66 : 40) * s);
    const crawlH = Math.max(34, (tall ? 104 : 62) * s);
    const byFont = Math.max(11, (tall ? 28 : 15.5) * s);
    const byTwo = across('BROUGHT TO YOU BY GARY MUSTARD ENTERPRISES ✦ GARRETT MUSAR ✦ AUFBAU', 'italic 700', byFont, 0.06) + 3 * byFont > W * 0.94;
    const byH = byFont * (byTwo ? 3.3 : 2.1);
    const tapeFont = Math.max(17, (tall ? 50 : 30) * s), tapeH = tapeFont * 2.05;
    const crawlTop = H - crawlH, byTop = crawlTop - byH, tapeTop = byTop - tapeH;
    const tabH = tapeFont * 0.95, tabFont = tabH * 0.52;
    const m = Math.max(16, W * 0.04);                               // the side margin

    (tall ? stacked : across1)();

    // ---- wide: 30% OFF on one line across nearly the whole frame ----
    function across1() {
      const top = tick + 0.02 * H, bottom = tapeTop - tabH - 0.02 * H;
      const HW = headW('30% OFF'), SUBT = 'EVERYTHING ON THE INTERNET.', SW = subW(SUBT);
      // all of it in units of the headline's width w
      const tagUp = 0.035, hc = HCAP / HW, g1 = 0.035, sc = SCAP / SW, g2 = 0.035, row = 0.1;
      const withRow = (bottom - top) / (tagUp + hc + g1 + sc + g2 + row) > W * 0.5;   // the cards where the headline keeps its size
      const unit = tagUp + hc + g1 + sc + (withRow ? g2 + row : 0);
      const w = Math.min(W - 2 * m, (bottom - top) / unit), x = (W - w) / 2;
      // height to spare goes to the cards row first (up to twice its size), the rest either side
      const rowW = withRow ? Math.min(0.2, row + ((bottom - top) - unit * w) / w * 0.7) : 0;
      let y = top + ((bottom - top) - (unit - (withRow ? row : 0) + rowW) * w) * 0.45 + tagUp * w;
      const hs = w / HW, capTop = y;
      // a soft glow behind where the globe goes, then the headline, then the globe in its O
      const ox = x + (advance('30% ') - ink('30% OFF', HEAD, -0.05).l) * hs, gcx = ox + HOLE.cx * hs + HOLE.up * hs * TAN9, gcy = capTop + hc * w - HOLE.up * hs;
      const d = Math.min(HOLE.w, HOLE.h) * hs * 1.06;
      glow(gcx, gcy, d * 2.2);
      y += hc * w; set('head', '30% OFF', HEAD, -0.05, hs, x, y, true, 'h1');
      globe(gcx, gcy, d);
      const ss = w / SW; y += g1 * w + sc * w; set('sub', SUBT, SUB, -0.04, ss, x, y, false, 'h2');
      // BLACK FRIDAY ONLY! across the 3's corner; BUT WAIT… THERE'S LESS! a sticker on the last F's
      slap(x - 0.012 * w, capTop - 0.004 * w, hs * 0.105, -7);
      burst(x + w - 0.035 * w, capTop + 0.02 * w, 0.125 * w, 12);
      glint('', x + w * 0.37, capTop + 0.01 * w, w * 0.028);
      glint('b', gcx + d * 0.42, gcy - d * 0.4, d * 0.16);
      glint('', x + w * 0.02, y - sc * w * 0.4, w * 0.012);
      if (withRow) {
        const rt = y + g2 * w, rh = rowW * w;
        const cw = Math.min(w * 0.42, rh * 0.62 * 436 / 62), ch = (62 * cw) / 436; cards(x, rt + (rh - ch) / 2, cw);
        const cs = rh / 360; card(x + w - 400 * cs - 6 * cs, rt - 4 * cs, cs, -2);
        const o = oval(Math.min(rh * 0.7, w * 0.072) / 3.31, 'As Seen On<br>Every Website'), mid = (x + cw + x + w - 400 * cs) / 2;
        at(o, mid - o.offsetWidth / 2, rt + (rh - o.offsetHeight) / 2);
        glint('b', x + w * 0.4 + w * 0.012, rt + rh * 0.1, w * 0.014);
      }
    }

    // ---- tall: 30% over OFF, each across the frame ----
    function stacked() {
      const top = tick + 0.018 * H, bottom = tapeTop - tabH - 0.018 * H;
      const HW = Math.max(headW('30%'), headW('OFF')), L1 = 'EVERYTHING ON', L2 = 'THE INTERNET.', SW = Math.max(subW(L1), subW(L2));
      const tagUp = 0.1, hc = HCAP / HW, lg = 0.07, g1 = 0.075, sc = (SCAP / SW) * 0.98, sg = 0.045, g2 = 0.07, cardsH = (62 / 436) * 0.98, cardRow = 0.42, g3 = 0.05;
      const base = tagUp + hc * 2 + lg + g1 + sc * 2 + sg;
      const fitW = (u) => Math.min(W - 2 * m, (bottom - top) / u);
      let parts = [g2 + cardRow + g3 + cardsH, g2 + cardsH, 0], i = 0;
      while (i < 2 && fitW(base + parts[i]) < (W - 2 * m) * 0.82) i++;
      const unit = base + parts[i], w = fitW(unit), cx = W / 2;
      let y = top + ((bottom - top) - unit * w) * 0.42 + tagUp * w;
      const hs = w / HW, mid = (t) => cx - (headW(t) * hs) / 2;
      const capTop = y;
      y += hc * w; set('head', '30%', HEAD, -0.05, hs, mid('30%'), y, true, 'h1');
      const cap2 = y + lg * w;
      const ox = mid('OFF') - ink('OFF', HEAD, -0.05).l * hs, gcx = ox + HOLE.cx * hs + HOLE.up * hs * TAN9, gcy = cap2 + hc * w - HOLE.up * hs, d = Math.min(HOLE.w, HOLE.h) * hs * 1.06;
      glow(gcx, gcy, d * 2.2);
      y = cap2 + hc * w; const offBase = y; set('head', 'OFF', HEAD, -0.05, hs, mid('OFF'), y, true);
      globe(gcx, gcy, d);
      const ss = (sc * w) / SCAP;
      y += g1 * w + sc * w; set('sub', L1, SUB, -0.04, ss, cx - (subW(L1) * ss) / 2, y, false, 'h2');
      y += sg * w + sc * w; set('sub', L2, SUB, -0.04, ss, cx - (subW(L2) * ss) / 2, y, false);
      slap(Math.max(8, mid('30%') - 0.05 * w), capTop - 0.05 * w, hs * 0.14, -7);
      // the sticker sits in the notch under the last F's arm
      const D = 0.25 * w, fL = mid('OFF') + (headW('OFF') - headW('F')) * hs, stem = fL + 0.42 * width('F', HEAD, -0.05) * hs;
      burst(Math.min(W - D / 2 - 3, stem + D * 0.54 + D * 0.5 * TAN9), offBase - D * 0.5, D, 12);
      glint('', mid('OFF') - 0.05 * w, cap2 + hc * w * 0.3, w * 0.045);
      glint('b', gcx + d * 0.42, gcy - d * 0.4, d * 0.16);
      if (i === 0) {
        const rt = y + g2 * w, rh = cardRow * w, cs = rh / 360, cardW = 400 * cs;
        const o = oval(rh * 0.62 / 3.31, 'As Seen On<br>Every Website'), gap = 0.05 * w, all = cardW + gap + o.offsetWidth, x0 = cx - all / 2;
        card(x0, rt, cs, -2);
        at(o, x0 + cardW + gap, rt + (rh - o.offsetHeight) / 2);
        y = rt + rh + g3 * w;
        cards(cx - (w * 0.98) / 2, y, w * 0.98);
      } else if (i === 1) cards(cx - (w * 0.98) / 2, y + g2 * w, w * 0.98);
    }

    // ---- the ORDER tape (the link), its tabs, the credits ----
    const say = 'NO PURCHASE NECESSARY!';
    const goW = across('ADD TO CHROME →', '400', 100, -0.01) / 100 + 1.4 + 0.4, need = across(say, 'italic 700', 100, 0) / 100 + 0.8 + goW;
    const fit = Math.min(1, (W * 0.92) / (need * tapeFont)), sayFits = fit >= 0.72;
    const tabL = put('<div class="tab" aria-hidden="true">OPERATORS STANDING BY</div>');
    Object.assign(tabL.style, { fontSize: tabFont + 'px', height: tabH + 1 + 'px', left: '0px', top: tapeTop - tabH + 'px' });
    if (W > 520) { const tabR = put('<div class="tab r" aria-hidden="true">LIMITED TIME · ACT NOW</div>');
      Object.assign(tabR.style, { fontSize: tabFont + 'px', height: tabH + 1 + 'px', right: '0px', top: tapeTop - tabH + 'px' }); }
    const tape = put(`<a class="strip tape level" href="${STORE}"><span class="say">${say}</span><span class="go">ADD TO CHROME <i aria-hidden="true">→</i></span></a>`);
    place(tape, 0, tapeTop, W, tapeH);
    Object.assign(tape.style, { fontSize: tapeFont * (sayFits ? fit : 1) + 'px', boxShadow: `inset 0 ${3 * s}px 0 rgba(170,158,0,0.6), inset 0 ${-3 * s}px 0 rgba(170,158,0,0.6)` });
    if (!sayFits) { tape.querySelector('.say').remove(); tape.querySelector('.go').style.fontSize = Math.min(tapeFont * 1.1, (W * 0.8) / goW) + 'px'; }
    const go = tape.querySelector('.go');
    movers.push((t) => go.classList.toggle('lit', Math.floor(t * 2) % 2 === 1));   // the button flashes, twice a second
    const by = put(`<div class="strip by level${byTwo ? ' two' : ''}"><span class="gme">Brought to you by Gary Mustard Enterprises</span><span class="sep first" aria-hidden="true">✦</span><span class="names"><a href="${GARRETT}">Garrett Musar</a><span class="sep" aria-hidden="true">✦</span><a href="${AUFBAU}">Aufbau</a></span></div>`);
    place(by, 0, byTop, W, byH); by.style.fontSize = byFont + 'px';
    if (byTwo && across('BROUGHT TO YOU BY GARY MUSTARD ENTERPRISES', 'italic 700', byFont, 0.06) > W * 0.92) by.querySelector('.gme').textContent = 'Gary Mustard Enterprises';

    // ---- the ticker (with ON AIR and the channel's bug) and the crawl ----
    const tk = put(`<div class="ticker" aria-hidden="true"><span>${TICKER.repeat(6)}</span></div>`);
    Object.assign(tk.style, { height: tick + 'px', fontSize: tick * 0.62 + 'px', lineHeight: tick + 'px' });
    const air = put('<div class="air" aria-hidden="true"><b></b>ON AIR</div>');
    Object.assign(air.style, { left: '0px', top: '0px', height: tick + 'px', fontSize: tick * 0.5 + 'px' });
    const dot = air.firstElementChild; movers.push((t) => dot.classList.toggle('off', Math.floor(t * 1.25) % 2 === 1));
    const bug = put(`<div class="bugbox"><img alt="Gary Mustard Enterprises" src="${IMG.logo}"></div>`);
    Object.assign(bug.style, { right: '0px', top: '0px', height: tick + 'px', width: tick * 2.6 + 'px', fontSize: tick * 0.5 + 'px' });
    const cr = put(`<div class="crawl" aria-hidden="true"><span>${CRAWL.repeat(12)}</span></div>`);
    Object.assign(cr.style, { height: crawlH + 'px', fontSize: crawlH * 0.72 + 'px', lineHeight: crawlH + 'px' });
    const tks = tk.firstElementChild, crs = cr.firstElementChild, tkRep = tks.offsetWidth / 6, crRep = crs.offsetWidth / 12;
    const tkV = tick * 1.6, crV = crawlH * 2.4;
    movers.push((t) => {
      tks.style.transform = `translateX(${-(((t + 3) * tkV) % tkRep)}px)`;
      crs.style.transform = `translateX(${-(((t + 3) * crV) % crRep)}px) skewX(-9deg)`;
    });
    render(clock());
  }

  // ---- the clock ----
  const t0 = performance.now(), clock = () => (still ? 0 : Math.floor(((performance.now() - t0) / 1000) * FPS) / FPS);
  const blotch = $('.blotch'), grain = $('.static');
  function render(t) {
    for (const move of movers) move(t);
    const f = Math.round(t * FPS); blotch.setAttribute('seed', BLOTCH[Math.floor(f / 4) % 6]); grain.setAttribute('seed', STATIC[Math.floor(f / 2) % 6]);
  }

  build();
  let pending = 0;
  addEventListener('resize', () => { cancelAnimationFrame(pending); pending = requestAnimationFrame(build); });
  if (!still) {
    let last = -1;
    const frame = () => { const t = clock(); if (t !== last) { last = t; render(t); } requestAnimationFrame(frame); };
    requestAnimationFrame(frame);
    if ('ImageDecoder' in window) (async () => {
      try {
        const dec = new ImageDecoder({ data: await (await fetch(IMG.globe)).arrayBuffer(), type: 'image/webp' });
        await dec.tracks.ready;
        const n = dec.tracks.selectedTrack.frameCount, frames = [];
        for (let i = 0; i < n; i++) { const { image } = await dec.decode({ frameIndex: i }); frames.push(await createImageBitmap(image)); image.close(); }
        dec.close();
        if (n === 60) { globeFrames = frames; build(); }
      } catch {}
    })();
  }

  // The tape look costs little on a graphics card and a great deal without one: if the page draws
  // slowly with it, take it off, and if that made no difference, put it back.
  const frameRate = () => new Promise((resolve) => {
    let frames = 0, drawing = 0, last = 0;
    const tick = (now) => { const gap = now - last; if (last && gap < 1000) { frames++; drawing += gap; } last = now; if (drawing < 2000) requestAnimationFrame(tick); else resolve((frames * 1000) / drawing); };
    requestAnimationFrame(tick);
  });
  if (!still && !query.has('keep')) {
    await new Promise((r) => setTimeout(r, 1200));
    const withLook = await frameRate();
    if (withLook < 24) {
      p.style.filter = 'none';
      if ((await frameRate()) < withLook * 1.5) p.style.removeProperty('filter');
    }
  }
})();
</script>
</body>
</html>
