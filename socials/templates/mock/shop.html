<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Halloway &amp; Finch — Homeware</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body { font: 15px/1.5 Inter, system-ui, sans-serif; color: #1d1d1f; background: #faf8f4; }
  header { display: flex; align-items: center; gap: 28px; padding: 18px 40px; background: #fff; border-bottom: 1px solid #e6e2da; position: sticky; top: 0; z-index: 50; }
  .logo { font: 600 22px/1 Georgia, serif; letter-spacing: 0.02em; }
  nav { display: flex; gap: 22px; color: #555; flex: 1; }
  .search { width: 260px; padding: 9px 14px; border: 1px solid #d8d3c9; border-radius: 999px; color: #999; background: #faf8f4; }
  .cart { padding: 9px 16px; border-radius: 999px; background: #1d1d1f; color: #fff; font-weight: 600; }
  .hero { margin: 26px 40px; padding: 38px 44px; border-radius: 18px; background: linear-gradient(120deg, #e9dcc6, #d7c3a2); display: flex; justify-content: space-between; align-items: center; }
  .hero h1 { font: 600 40px/1.1 Georgia, serif; max-width: 520px; }
  .hero p { margin-top: 10px; color: #5b4f3c; }
  .hero .btn { padding: 14px 26px; border-radius: 999px; background: #1d1d1f; color: #fff; font-weight: 600; white-space: nowrap; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 22px; padding: 0 40px 60px; }
  .card { background: #fff; border: 1px solid #e6e2da; border-radius: 14px; overflow: hidden; }
  .pic { height: 190px; }
  .card div + div { padding: 14px 16px 16px; }
  .card b { display: block; font-weight: 600; }
  .card span { color: #777; font-size: 13px; }
  .card em { display: block; margin-top: 8px; font-style: normal; font-weight: 700; font-size: 17px; }
  /* phones: logo and basket on top, the menu scrolls, two products a row */
  @media (max-width: 600px) {
    header { flex-wrap: wrap; gap: 10px 16px; padding: 12px 16px; }
    .logo { flex: 1; font-size: 20px; }
    nav { order: 3; flex-basis: 100%; gap: 18px; overflow: hidden; white-space: nowrap; font-size: 14px; }
    .search { display: none; }
    .hero { margin: 16px; padding: 26px 22px; flex-direction: column; align-items: flex-start; gap: 20px; }
    .hero h1 { font-size: 30px; }
    .grid { grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 0 16px 40px; }
    .pic { height: 150px; }
  }
</style>
</head>
<body>
<header><div class="logo">Halloway &amp; Finch</div><nav><span>New in</span><span>Kitchen</span><span>Living</span><span>Bedroom</span><span>Garden</span><span>Sale</span></nav><div class="search">Search 2,400 products</div><span>Sign in</span><div class="cart">Basket (3)</div></header>
<section class="hero"><div><h1>Things for the house you will actually use</h1><p>Free delivery over £40. Thirty-day returns.</p></div><div class="btn">Shop the winter edit</div></section>
<section class="grid" id="grid"></section>
<script>
  const items = [['Stoneware mug', 'Set of two', '£18.00', '#c9b8a0'], ['Linen throw', 'Oat', '£64.00', '#d9cfc0'], ['Brass candlestick', 'Tall', '£32.00', '#c7a85a'], ['Oak serving board', 'Large', '£45.00', '#b08a5a'],
    ['Wool blanket', 'Charcoal', '£89.00', '#6f6f76'], ['Enamel kettle', 'Cream', '£52.00', '#e8e0cc'], ['Glass carafe', '1 litre', '£24.00', '#bcd4d6'], ['Cast-iron pan', '26 cm', '£58.00', '#3a3a3e'],
    ['Table lamp', 'Sage', '£74.00', '#9db09a'], ['Cotton towels', 'Set of four', '£38.00', '#e3d6d0'], ['Ceramic vase', 'Speckled', '£29.00', '#d4c8b8'], ['Bread bin', 'Steel', '£41.00', '#9aa3ab']];
  document.getElementById('grid').innerHTML = items.map(([n, d, p, c]) => `<div class="card"><div class="pic" style="background:linear-gradient(135deg, ${c}, #fff 180%)"></div><div><b>${n}</b><span>${d}</span><em>${p}</em></div></div>`).join('');
</script>
</body>
</html>
