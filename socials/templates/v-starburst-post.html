<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>30% Off EVERYTHING</title>
<!-- "The Globe Badge" laid out for pictures, not a page:
     the social posts and the Chrome Web Store images. No links, no buttons: the yellow tape is plain
     words (NO PURCHASE NECESSARY! ✦ ADD TO CHROME), the credits are only the company's.
     ?f=<format> picks the frame's own arrangement (each drawn for its shape, scaled to the window):
       square      1080 x 1080   the badge as hero, caption and tag under it
       horizontal  1920 x 1080   the set: badge centre, price card left, As Seen On and the cards right
       portrait    1080 x 1920   stories: the badge across the top, caption, tag, the four cards
       p45         1080 x 1350   the 4:5 feed post: badge, caption, tag
       marquee     1400 x  560   store marquee: badge left, the words, the price card right
       small        440 x  280   store small tile: the badge and the words, nothing else
       shot1/2/3   1280 x  800   store screenshots: 1 the badge, 2 the price card, 3 BUT WAIT… / As Seen On / the cards
     Read in order: 1. the badge with 30% OFF  2. EVERYTHING ON THE INTERNET. + BLACK FRIDAY ONLY!
     3. the stamp, then the furniture. Everything that moves runs off one clock at 25 frames a second
     and comes round exactly at 12 s (the ring reads EVERY SITE 30% OFF! three times, so a third of a
     turn brings it back), so a 12 s recording loops. ?keep keeps the tape look on however slow. -->
<style>
{{fonts}}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; background: #070f9c; }
body { -webkit-font-smoothing: antialiased; }
#p { position: fixed; inset: 0; overflow: hidden; background: linear-gradient(#0a1cc4, #0a22d6 45%, #070f9c); filter: url(#tape);
     --yellow: #fff035; --shade: #0a0f66; --red: #ff1616; user-select: none; pointer-events: none; }
#p > * { position: absolute; display: block; max-width: none; }
.defs { position: absolute; width: 0; height: 0; }
.lines { position: fixed; inset: 0; pointer-events: none; z-index: 2;
         background: repeating-linear-gradient(rgba(0, 0, 16, 0) 0, rgba(0, 0, 16, 0.05) 1.5px, rgba(0, 0, 16, 0) 3px),
                     radial-gradient(farthest-corner at 50% 50%, rgba(0, 0, 0, 0) 0%, rgba(0, 0, 0, 0.03) 50%, rgba(0, 0, 0, 0.08) 71%, rgba(0, 0, 0, 0.13) 85%, rgba(0, 0, 0, 0.21) 100%); }

.glow { border-radius: 50%; background: radial-gradient(closest-side, #58c4ff 0%, #2a8cff 22%, #1348ee 44%, transparent 72%); }
.tiles { background-repeat: repeat; opacity: 0.095; transform: rotate(-6deg); }

.t { white-space: nowrap; line-height: 1; }
.head { font-family: "Archivo Black", "Arial Black", sans-serif; color: var(--yellow); letter-spacing: -0.05em;
        text-shadow: 0.009em 0.009em 0 var(--shade), 0.018em 0.018em 0 var(--shade), 0.027em 0.027em 0 var(--shade),
                     0.036em 0.036em 0 var(--shade), 0.045em 0.045em 0 var(--shade), 0.054em 0.054em 0 var(--shade); }
.sub { font: italic 700 1em "Arimo", Arial, sans-serif; letter-spacing: -0.04em;
       background: linear-gradient(#fff 35%, #c5d4fb 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
       filter: drop-shadow(0.045em 0.045em 0 rgba(6, 8, 70, 0.95)); padding: 0 0.1em 0.06em 0; }

.glint svg { display: block; width: 100%; height: 100%; overflow: visible; fill: #fff; }
.glint path { filter: drop-shadow(0 0 0.08px #fff) drop-shadow(0 0 0.22px #9fd4ff); transform-box: fill-box; transform-origin: center; }

/* the burst: an SVG, turning by the clock */
.burst { overflow: visible; }
.burst text { font-family: "Archivo Black", "Arial Black", sans-serif; fill: var(--shade); letter-spacing: 0.01em; }

/* 1. the sticker: 30% OFF on a red panel with a yellow keyline, across the globe */
.sticker { background: linear-gradient(#ff3a2a, #e00a0a 60%, #c80000); border: 0.05em solid #000; border-radius: 0.08em;
           box-shadow: inset 0 0 0 0.035em #e00a0a, inset 0 0 0 0.065em var(--yellow), 0.1em 0.1em 0 rgba(6, 8, 70, 0.92); transform-origin: center; }
.sticker .t { position: absolute; }

/* 2. BLACK FRIDAY ONLY!, as a red tag */
.tag { display: inline-block !important; white-space: nowrap; background: var(--red); color: var(--yellow); border: 0.07em solid #000;
       font: 400 1em/1 "Archivo Black", "Arial Black", sans-serif; letter-spacing: -0.01em; padding: 0.2em 0.42em 0.24em;
       box-shadow: 0.12em 0.12em 0 rgba(6, 8, 70, 0.9); transform: rotate(-2deg); transform-origin: center; text-shadow: 0.05em 0.05em 0 #7a0006; }

/* 3. the aside: BUT WAIT… THERE'S LESS! as a rubber stamp on a white card */
.stamp { display: block; text-align: center; white-space: nowrap; background: #fbfbf4; color: var(--red); padding: 0.32em 0.6em 0.36em;
         border: 0.13em solid var(--red); border-radius: 0.18em; box-shadow: inset 0 0 0 0.09em #fbfbf4, inset 0 0 0 0.15em var(--red), 0.14em 0.16em 0 rgba(6, 8, 70, 0.9);
         transform-origin: center; }
.stamp .a { display: block; font: italic 700 0.62em/1 "Tinos", "Times New Roman", serif; color: #111; letter-spacing: 0.01em; margin-bottom: 0.14em; }
.stamp .b { display: block; font: 400 1em/1 "Archivo Black", "Arial Black", sans-serif; letter-spacing: -0.02em; }

/* TV furniture: the deck's on-screen display, the station bug, item labels */
.osd { font: 600 1em/1 "Antonio", "Arial Narrow", sans-serif; color: #fff; letter-spacing: 0.06em; white-space: nowrap;
       text-shadow: 0.06em 0.06em 0 rgba(4, 8, 60, 0.9), -0.03em -0.03em 0 rgba(4, 8, 60, 0.6); }
.osd b { color: var(--yellow); font-weight: 600; }
.bug { opacity: 0.85; }
.label { font: 600 1em/1 "Antonio", "Arial Narrow", sans-serif; letter-spacing: 0.08em; white-space: nowrap; background: var(--shade); color: var(--yellow);
         padding: 0.18em 0.45em 0.2em; border: 0.06em solid var(--yellow); box-shadow: 0.1em 0.1em 0 rgba(4, 6, 50, 0.8); }

.ticker, .crawl { left: 0; right: 0; overflow: hidden; white-space: nowrap; }
.ticker { top: 0; font-family: "Antonio", "Arial Narrow", sans-serif; font-weight: 300; letter-spacing: 0.035em; word-spacing: 0.3em;
          color: #e9f0ff; text-shadow: 0.06em 0.06em 0 rgba(4, 8, 80, 0.85); background: rgba(4, 8, 90, 0.35); }
.ticker span { display: inline-block; }
.crawl { font-family: "Archivo Black", "Arial Black", sans-serif; color: var(--yellow); letter-spacing: -0.02em; word-spacing: 0.08em; background: rgba(4, 8, 90, 0.25); }
.crawl span { display: inline-block; text-shadow: 0.027em 0.027em 0 var(--shade), 0.054em 0.054em 0 var(--shade), 0.08em 0.08em 0 var(--shade); }

/* the tapes, level: the yellow one says it (words only, nothing to press), the navy one carries the credit */
.strip { display: flex !important; align-items: center; justify-content: center; white-space: nowrap; font: italic 700 1em "Arimo", Arial, sans-serif; }
.tape { background: linear-gradient(#fffb86, #f0e11c); color: #111; letter-spacing: -0.01em; }
.tape .sep { font-style: normal; color: var(--red); margin: 0 0.75em; font-size: 0.8em; }
.by { background: var(--shade); color: #fff; letter-spacing: 0.08em; text-transform: uppercase; border-top: 0.12em solid #04083a; }

/* the price card; only its 70% moves */
.card { width: 400px; height: 306px; background: #f3f4f6; color: #0c0c0c; border: 5px solid #000; box-shadow: 8px 8px 0 rgba(4, 6, 60, 0.92);
        transform-origin: left top; font: italic 700 50px/1 "Arimo", Arial, sans-serif; }
.card .hd { background: var(--red); color: #fff46a; font: 600 41px/57px "Antonio", "Arial Narrow", sans-serif; padding: 0 15px; border-bottom: 5px solid #000; white-space: nowrap; overflow: hidden; }
.card .ln { padding: 13px 17px 0; }
.card s { position: relative; text-decoration: none; color: #6b6f78; margin-left: 9px; }
.card s::after { content: ""; position: absolute; left: -8%; right: -8%; top: 46%; height: 8px; background: var(--red); transform: rotate(-11deg); box-shadow: 0 0 0 2px #000; }
.card .big { position: absolute; right: 9px; bottom: -54px; font: 400 165px/0.9 "Archivo Black", "Arial Black", sans-serif; color: var(--red); letter-spacing: -0.05em;
             -webkit-text-stroke: 11px #000; paint-order: stroke fill; transform: skewX(-8deg); transform-origin: 70% 80%; }

.oval { width: 7.6em; height: 3.31em; border-radius: 50%; display: grid !important; place-items: center; text-align: center;
        font: italic 700 1em/0.98 "Tinos", "Times New Roman", serif; background: radial-gradient(ellipse at 40% 30%, #fffc9a, #efe01c 72%); color: #151515;
        transform: rotate(-7deg); box-shadow: 0.143em 0.167em 0 rgba(6, 8, 70, 0.9), inset 0 0 0 0.095em rgba(170, 158, 0, 0.5); }
.cards { display: flex !important; flex-wrap: wrap; gap: 12px; width: 436px; transform-origin: left top; font: italic 700 19px/1 "Arimo", Arial, sans-serif; letter-spacing: 0.02em; }
.cards.grid { width: 212px; }
.cards i { flex: none; position: relative; display: block; width: 100px; height: 62px; border-radius: 7px; overflow: hidden; box-shadow: 3px 3px 0 rgba(6, 8, 70, 0.85); }
.cards b { position: absolute; left: 0; right: 0; bottom: 5px; text-align: center; }
.cards .c1 { background: linear-gradient(#f4f4f4 0 34%, #1c3fd1 34% 62%, #f1b400 62%); color: #111; }
.cards .c2 { background: radial-gradient(circle at 50% 40%, #ffb300 0 30%, transparent 31%), #f6f6f6; color: #111; }
.cards .c3 { background: linear-gradient(135deg, #7fd4ff, #2a79d8); color: #fff; }
.cards .c4 { background: linear-gradient(#151515, #3a2a00); color: #ffcf2e; }
.cards .c4 b { font-size: 14.5px; }
</style>
</head>
<body>
<main id="p" role="img" aria-label="30% off everything on the internet. Black Friday only!"></main>
<div class="lines" aria-hidden="true"></div>
<script>
(async () => {
  const query = new URLSearchParams(location.search);
  const IMG = { globe: '{{img:globe_anim}}', still: '{{img:globe_still}}', tile: '{{img:tile}}', logo: '{{img:logo}}' };
  const TICKER = 'But wait… there’s less! ✦ No purchase necessary! ✦ Black Friday only! ✦ Every website, 30% off! ✦ Works like magic! ✦ ';
  const CRAWL = 'BLACK FRIDAY ONLY! ✦ ';
  const RING = 'EVERY SITE 30% OFF! ✦', RINGS = 3;     // three times round: a third of a turn brings the ring back
  const BRAND = 'Brought to you by Gary Mustard Enterprises';
  const GLINT = 'M0,-1 C0.06,-0.22 0.22,-0.06 1,0 C0.22,0.06 0.06,0.22 0,1 C-0.06,0.22 -0.22,0.06 -1,0 C-0.22,-0.06 -0.06,-0.22 0,-1Z';
  const TAN9 = Math.tan((9 * Math.PI) / 180);
  const FPS = 25, LOOP = 12;   // every period below divides LOOP

  // ---- the tape look: the live banner's filter, distances set per frame, the noise moved on by the clock ----
  const LUMA = '0.299 0.587 0.114 0 0';
  const tint = (i, q) => `${i * 0.22} ${q * 0.2} 0 0 ${0.5 - 0.5 * (i * 0.22 + q * 0.2)}`;
  const MOTTLE = `${tint(0.956, 0.621)}  ${tint(-0.272, -0.647)}  ${tint(-1.106, 1.703)}  0 0 0 0 1`;
  const GRAIN = `${'0.7 0 0 0 -0.399  '.repeat(3)} 0 0 0 0 1`;
  const add = (extra = '') => `operator="arithmetic" k2="1" k3="1" k4="-0.5" ${extra}`;
  document.body.insertAdjacentHTML('beforeend', `
    <svg class="defs" aria-hidden="true"><filter id="tape" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB">
      <feFlood flood-color="#0a22d6"/><feMerge result="picture"><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
      <feGaussianBlur class="soft" in="picture"/><feColorMatrix type="matrix" values="${LUMA} ${LUMA} ${LUMA} 0 0 0 1 0" result="luma"/>
      <feGaussianBlur class="halo"/><feComposite in="luma" operator="arithmetic" k2="1.42" k3="-0.42" result="sharp"/>
      <feGaussianBlur class="smear" in="picture"/><feOffset class="late"/>
      <feColorMatrix type="matrix" values="0.393 -0.329 -0.064 0 0.5  -0.167 0.231 -0.064 0 0.5  -0.167 -0.329 0.496 0 0.5  0 0 0 1 0"/>
      <feComposite in2="sharp" operator="arithmetic" k2="2" k3="1" k4="-1" result="clean"/>
      <feTurbulence class="blotch" type="fractalNoise" numOctaves="1" seed="3"/>
      <feColorMatrix type="matrix" values="${MOTTLE}"/><feComposite in2="clean" ${add('result="mottled"')}/>
      <feTurbulence class="static" type="fractalNoise" numOctaves="2" seed="2"/>
      <feColorMatrix type="matrix" values="${GRAIN}"/><feComposite in2="mottled" operator="arithmetic" k2="1" k3="1" result="taped"/>
      <feComponentTransfer><feFuncR type="linear" intercept="-0.55"/><feFuncG type="linear" intercept="-0.55"/><feFuncB type="linear" intercept="-0.55"/></feComponentTransfer>
      <feGaussianBlur class="bloom"/><feComposite in2="taped" operator="arithmetic" k2="0.149" k3="0.93" k4="0.037"/>
    </filter></svg>`);
  const $ = (sel) => document.querySelector(sel);
  // the noise: each seed held for an uneven number of frames, so it never settles into a rhythm. The
  // blotch cycle is 25 frames, the grain's 30: both divide the 300-frame loop
  const cycle = (seeds, holds) => holds.flatMap((h, i) => Array(h).fill(seeds[i]));
  const BLOTCH = cycle([3, 41, 11, 7, 29, 19, 53, 5], [3, 4, 2, 4, 3, 2, 4, 3]);
  const STATIC = cycle([2, 31, 17, 47, 9, 23, 59, 4, 43, 29, 11, 61, 37, 19, 53, 7, 41, 13], [2, 1, 2, 2, 1, 3, 1, 2, 1, 1, 2, 2, 1, 3, 1, 2, 2, 1]);

  await Promise.all(['100px "Archivo Black"', 'italic 700 100px "Arimo"', '300 50px "Antonio"', '600 50px "Antonio"', 'italic 700 50px "Tinos"'].map((f) => document.fonts.load(f)));
  const p = document.getElementById('p');
  const put = (html) => { p.insertAdjacentHTML('beforeend', html); return p.lastElementChild; };
  const place = (el, x, y, w, h) => { Object.assign(el.style, { left: x + 'px', top: y + 'px', width: w + 'px', height: h + 'px' }); return el; };
  const at = (el, x, y) => { Object.assign(el.style, { left: x + 'px', top: y + 'px' }); return el; };

  // Lettering is measured, not guessed: the ink's edges and the cap height of a string, per 1px of type.
  const mc = document.createElement('canvas').getContext('2d');
  function ink(text, font, ls) {
    mc.font = font.replace('SIZE', '200px'); mc.letterSpacing = ls * 200 + 'px';
    const m = mc.measureText(text), k = 1 / 200;
    return { l: -m.actualBoundingBoxLeft * k, r: m.actualBoundingBoxRight * k - ls, cap: mc.measureText('H').actualBoundingBoxAscent * k,
             asc: m.fontBoundingBoxAscent * k, desc: m.fontBoundingBoxDescent * k };
  }
  // Set a line of type with its ink's left edge at x and its baseline at y (in `into`, default the page).
  function set(cls, text, font, ls, size, x, y, skew, tag = 'div', into = null) {
    const i = ink(text, font, ls);
    let el;
    if (into) { into.insertAdjacentHTML('beforeend', `<${tag} class="t ${cls}">${text}</${tag}>`); el = into.lastElementChild; } else el = put(`<${tag} class="t ${cls}">${text}</${tag}>`);
    const base = (1 - (i.asc + i.desc)) / 2 + i.asc;
    Object.assign(el.style, { fontSize: size + 'px', left: x - i.l * size + 'px', top: y - base * size + 'px' });
    if (skew) Object.assign(el.style, { transformOrigin: `0 ${base * size}px`, transform: 'skewX(-9deg)' });
    return el;
  }
  const HEAD = 'SIZE "Archivo Black"', SUB = 'italic 700 SIZE "Arimo"';
  const width = (text, font, ls) => { const i = ink(text, font, ls); return i.r - i.l; };
  const headW = (t) => width(t, HEAD, -0.05) + ink(t, HEAD, -0.05).cap * TAN9;
  const subW = (t) => width(t, SUB, -0.04);
  const HCAP = ink('H', HEAD, -0.05).cap, SCAP = ink('H', SUB, -0.04).cap;
  const across = (text, font, size, ls) => { mc.font = `${font} ${size}px ${font.includes('700') ? '"Arimo"' : '"Archivo Black"'}`; mc.letterSpacing = ls * size + 'px'; return mc.measureText(text).width; };
  const TAGW = across('BLACK FRIDAY ONLY!', '400', 100, -0.01) / 100 + 0.98, TAGH = 1.58;   // the tag, per 1px of its type

  // ---- what moves, and how, at time t (seconds); every period divides 12 s ----
  let movers = [];
  const ease = (q) => q * q * (3 - 2 * q);
  const lerp = (a, b, q) => a + (b - a) * q;
  const twinkle = (path, delay) => movers.push((t) => {
    const ph = ((t + delay) / 2.4) % 1, q = ease(ph < 0.5 ? ph * 2 : 2 - ph * 2);
    path.style.transform = `scale(${lerp(0.55, 1, q)}) rotate(${lerp(-10, 12, q)}deg)`; path.style.opacity = lerp(0.75, 1, q);
  });
  const JOLT = [[0, 1, 0], [0.12, 1.18, -5], [0.26, 0.96, 3], [0.4, 1.08, -2], [0.55, 1, 0], [1, 1, 0]];
  const keyed = (keys, ph) => { const i = keys.findIndex(([w], n) => ph < keys[n + 1]?.[0]), a = keys[i], b = keys[i + 1]; const q = ease((ph - a[0]) / (b[0] - a[0])); return a.slice(1).map((v, n) => lerp(v, b[n + 1], q)); };
  const jolt = (el, period) => movers.push((t) => {
    const [sc, r] = keyed(JOLT, (t / period) % 1);
    el.style.transform = `skewX(-8deg) scale(${sc}) rotate(${r}deg)`;
  });

  const glint = (cls, cx, cy, r) => {
    const el = place(put(`<div class="glint ${cls}" aria-hidden="true"><svg viewBox="-1 -1 2 2"><path d="${GLINT}"/></svg></div>`), cx - r, cy - r, r * 2, r * 2);
    twinkle(el.querySelector('path'), cls === 'b' ? 1.2 : 0);
    return el;
  };
  // As Seen On Every Website: 7.6 x 3.31 of its type, placed by its centre
  const oval = (size, cx, cy, turn = -7) => {
    const el = put('<div class="oval" aria-hidden="true"><span>As Seen On<br>Every Website</span></div>');
    el.style.fontSize = size + 'px'; el.style.transform = `rotate(${turn}deg)`;
    return at(el, cx - el.offsetWidth / 2, cy - el.offsetHeight / 2);
  };
  // the four cards: a row 436 x 62, or a 2 x 2 grid 212 x 136, scaled to w across
  const cards = (x, top, w, grid) => {
    const el = put(`<div class="cards${grid ? ' grid' : ''}" aria-hidden="true"><i class="c1"><b>FREE</b></i><i class="c2"><b>Gratis</b></i><i class="c3"><b>$0.00</b></i><i class="c4"><b>NO CHARGE</b></i></div>`);
    Object.assign(el.style, { left: x + 'px', top: top + 'px', transform: `scale(${w / (grid ? 212 : 436)})` });
    return el;
  };
  // the price card, 400 x 306 at scale 1 (its 70% hangs 54 below, and it leans); the 70% jolts every 1.2 s
  const card = (x, top, scale, turn = -2.4) => {
    const el = put('<div class="card" aria-hidden="true"><div class="hd">The Internet (All Of It)</div><div class="ln">WAS: <s>100%</s></div><div class="ln">NOW:</div><div class="big">70%</div></div>');
    Object.assign(el.style, { left: x + 'px', top: top + 'px', transform: `scale(${scale}) rotate(${turn}deg)` });
    jolt(el.querySelector('.big'), 1.2);
    return el;
  };
  const label = (text, size, x, y) => { const el = put(`<div class="label" aria-hidden="true">${text}</div>`); el.style.fontSize = size + 'px'; return at(el, x, y); };
  // the globe, its 60 frames drawn by the clock onto a canvas once decoded (one turn in 4 s); a picture until then
  let globeFrames = null;
  const globe = (cx, cy, d) => {
    const k = d / 374, box = 480 * k, x = cx - 240 * k, y = cy - (47 + 187) * k;
    if (globeFrames) {
      const c = put('<canvas class="globe" aria-hidden="true"></canvas>'), dpr = Math.min(2, devicePixelRatio || 1);
      c.width = Math.round(box * dpr); c.height = Math.round(box * dpr); place(c, x, y, box, box);
      const g = c.getContext('2d'); let shown = -1;
      movers.push((t) => { const i = Math.floor(t * 15 + 1e-6) % 60; if (i !== shown) { shown = i; g.clearRect(0, 0, c.width, c.height); g.drawImage(globeFrames[i], 0, 0, c.width, c.height); } });
    } else place(put(`<img class="globe" alt="" src="${IMG.still}">`), x, y, box, box);
  };
  const glow = (cx, cy, d) => place(put('<div class="glow" aria-hidden="true"></div>'), cx - d / 2, cy - d / 2, d, d);

  // ---- the badge: a starburst (red behind, yellow in front) of radius R round (cx, cy), the ring of words
  //      round its rim, the navy plate the globe sits on; turning: the red 45° (two of its 16 points) and
  //      the yellow with its words 120° (a third, to the next EVERY SITE 30% OFF!) in 12 s ----
  const star = (n, outer, inner, turn = 0) => Array.from({ length: n * 2 }, (_, i) => {
    const a = ((i + turn) * Math.PI) / n - Math.PI / 2, r = i % 2 ? inner : outer;
    return `${(r * Math.cos(a)).toFixed(4)},${(r * Math.sin(a)).toFixed(4)}`;
  }).join(' ');
  let uid = 0;
  function badge(cx, cy, R, words = true) {
    const rb = 0.735, circ = 2 * Math.PI * rb, id = 'b' + uid++;
    const fs = Math.min(0.105, (circ * 0.97) / ((RINGS * across(RING + ' ✦ ', '400', 100, 0.01)) / 100));
    // one copy of the words, drawn three times turned a third each: the same marks exactly, so a 120° turn is seamless
    const ring = Array.from({ length: RINGS }, (_, i) => `<text font-size="${fs}" transform="rotate(${(i * 360) / RINGS})"><textPath href="#ring${id}">${RING}</textPath></text>`).join('');
    const el = put(`<svg class="burst" viewBox="-1.12 -1.12 2.24 2.24" aria-hidden="true">
      <defs><radialGradient id="bY${id}" r="0.9"><stop offset="0.6" stop-color="#fffb86"/><stop offset="1" stop-color="#f6d80c"/></radialGradient>
        <radialGradient id="plate${id}" cx="0.42" cy="0.36" r="0.75"><stop offset="0" stop-color="#3aa6ff"/><stop offset="0.45" stop-color="#1550ee"/><stop offset="1" stop-color="#071090"/></radialGradient>
        <path id="ring${id}" d="M ${-rb} 0 A ${rb} ${rb} 0 1 1 ${rb} 0 A ${rb} ${rb} 0 1 1 ${-rb} 0"/></defs>
      <g transform="translate(0.05 0.06)"><g class="spinA"><polygon points="${star(16, 1.08, 0.8, 0.5)}" fill="#0a0f66" opacity="0.92"/></g></g>
      <g class="spinA"><polygon points="${star(16, 1.08, 0.8, 0.5)}" fill="#ff1616" stroke="#000" stroke-width="0.014" stroke-linejoin="round"/></g>
      <g transform="translate(0.03 0.035)"><g class="spinB"><polygon points="${star(30, 0.97, 0.86)}" fill="#0a0f66" opacity="0.7"/></g></g>
      <g class="spinB"><polygon points="${star(30, 0.97, 0.86)}" fill="url(#bY${id})" stroke="#000" stroke-width="0.012" stroke-linejoin="round"/>${words ? ring : ''}</g>
      <circle r="0.685" fill="#000"/><circle r="0.672" fill="#fff"/><circle r="0.648" fill="url(#plate${id})"/>
    </svg>`);
    place(el, cx - 1.12 * R, cy - 1.12 * R, 2.24 * R, 2.24 * R);
    const a = el.querySelectorAll('.spinA'), b = el.querySelectorAll('.spinB');
    movers.push((t) => { for (const g of a) g.setAttribute('transform', `rotate(${(-t * 3.75) % 360})`); for (const g of b) g.setAttribute('transform', `rotate(${(t * 10) % 360})`); });
    globe(cx, cy, R * 1.26);
  }

  // 1. 30% OFF on a red sticker w across, centred at (cx, cy); it pops every 3 s
  function sticker(cx, cy, w, turn) {
    const hs = (w * 0.84) / headW('30% OFF'), pad = HCAP * hs * 0.3, h = HCAP * hs + 2 * pad;
    const el = put('<div class="sticker"></div>');
    el.style.fontSize = hs + 'px';
    place(el, cx - w / 2, cy - h / 2, w, h);
    set('head', '30% OFF', HEAD, -0.05, hs, (w - headW('30% OFF') * hs) / 2 - hs * 0.05, pad + HCAP * hs, true, 'div', el);
    const POP = [[0, 1], [0.05, 1.07], [0.1, 0.98], [0.15, 1.02], [0.2, 1], [1, 1]];
    movers.push((t) => { const [sc] = keyed(POP, ((t + 0.6) / 3) % 1); el.style.transform = `rotate(${turn}deg) scale(${sc})`; });
    return h;
  }
  // 3. the aside: BUT WAIT… THERE'S LESS! stamped on every six seconds; placed by its centre
  function stamp(cx, cy, f, turn) {
    const el = put('<div class="stamp"><span class="a">But wait…</span><span class="b">THERE’S LESS!</span></div>');
    el.style.fontSize = f + 'px';
    at(el, cx - el.offsetWidth / 2, cy - el.offsetHeight / 2);
    const THUD = [[0, 1.9, 0], [0.04, 0.94, 1], [0.065, 1.03, 1], [0.09, 1, 1], [1, 1, 1]];
    movers.push((t) => { const [sc, o] = keyed(THUD, ((t + 4.6) / 6) % 1); el.style.transform = `rotate(${turn}deg) scale(${sc})`; el.style.opacity = o; });
    return el;
  }
  const STAMPW = (() => { const el = stamp(0, 0, 100, 0); const r = [el.offsetWidth / 100, el.offsetHeight / 100]; el.remove(); movers = []; return r; })();
  // 2. the caption, its lines centred on cx, the first cap line's top at y; returns the last baseline
  function caption(lines, ss, cx, y, lead) {
    lines.forEach((line, i) => {
      if (i) y += lead;
      y += SCAP * ss;
      set('sub', line, SUB, -0.04, ss, cx - (subW(line) * ss) / 2, y, false);
    });
    return y;
  }
  function tag(tf, cx, y) {
    const tg = put('<div class="tag">BLACK FRIDAY ONLY!</div>'); tg.style.fontSize = tf + 'px';
    return at(tg, cx - tg.offsetWidth / 2, y);
  }
  const L1 = ['EVERYTHING ON THE INTERNET.'], L2 = ['EVERYTHING ON', 'THE INTERNET.'], L3 = ['EVERYTHING', 'ON THE', 'INTERNET.'];
  const capH = (lines, ss) => SCAP * ss * (lines.length * 1.3 - 0.3);
  const fitLines = (lines, w) => w / Math.max(...lines.map(subW));

  // ---- the frame: where the bands go (worked out first, so the stage is known), drawn last ----
  let W, H, rays, rayC = [0, 0];
  function look(s) {
    $('.soft').setAttribute('stdDeviation', `${1.25 * s} ${0.5 * s}`);
    $('.halo').setAttribute('stdDeviation', `${5 * s} ${0.6 * s}`);
    $('.smear').setAttribute('stdDeviation', `${10 * s} ${1.6 * s}`);
    $('.late').setAttribute('dx', 7 * s); $('.late').setAttribute('dy', 1.7 * s);
    $('.bloom').setAttribute('stdDeviation', 14 * s);
    const n = Math.max(s, 0.6);   // the grain no finer than a pixel or so
    $('.blotch').setAttribute('baseFrequency', `${0.042 / n} ${0.167 / n}`);
    $('.static').setAttribute('baseFrequency', `${0.19 / n} ${0.71 / n}`);
  }
  function frame(o) {
    const tick = o.tick || 0, crawlH = o.crawl || 0, tapeH = o.tape || 0, byF = o.by || 0, byH = byF * 2.1;
    const crawlTop = H - crawlH, byTop = crawlTop - byH, tapeTop = byTop - tapeH;
    const osdF = o.osd || 0, m = o.m || 0, osdTop = tick + osdF * 0.7;
    return { ...o, tick, crawlH, tapeH, byF, byH, crawlTop, byTop, tapeTop, osdF, osdTop, m,
             top: osdF ? osdTop + osdF * 0.4 : tick, bot: tapeH ? tapeTop : byH ? byTop : crawlTop };
  }
  function back(s, tileK = 1) {
    look(s);
    const tiles = place(put('<div class="tiles" aria-hidden="true"></div>'), -W * 0.3, -H * 0.3, W * 1.6, H * 1.6);
    Object.assign(tiles.style, { backgroundImage: `url(${IMG.tile})`, backgroundSize: `${260 * s * tileK}px ${224 * s * tileK}px` });
    rays = place(put('<div class="rays" aria-hidden="true"></div>'), 0, 0, W, H);
  }
  // a band's words moved on so that a whole number of repeats goes by in 12 s, as near the given speed as may be
  function scroll(el, unit, v0, extra) {
    el.textContent = unit.repeat(4); const w4 = el.getBoundingClientRect().width;
    el.textContent = unit.repeat(8); const rep = (el.getBoundingClientRect().width - w4) / 4;
    const reps = Math.ceil((W + rep) / rep) + 1; el.textContent = unit.repeat(reps + 1);
    const v = (Math.max(1, Math.round((v0 * LOOP) / rep)) * rep) / LOOP;
    movers.push((t) => { el.style.transform = `translateX(${-(((t + 3) * v) % rep)}px) rotate(0.01deg)${extra}`; }); // the rotation stops whole-pixel snapping
  }
  function front(fr) {
    if (fr.osdF) {
      const osd = put('<div class="osd" aria-hidden="true">▶ PLAY&nbsp;&nbsp;<b>SP</b></div>');
      osd.style.fontSize = fr.osdF + 'px'; at(osd, fr.m, fr.osdTop);
      const air = put('<div class="osd" aria-hidden="true"><b>●</b> ON AIR</div>');
      air.style.fontSize = fr.osdF + 'px'; at(air, fr.m, fr.osdTop + fr.osdF * 1.35);
      movers.push((t) => { air.firstElementChild.style.visibility = Math.floor(t * 2 + 1e-6) % 2 ? 'hidden' : 'visible'; });
      const bugW = fr.osdF * 5.2, bug = put(`<img class="bug" alt="" src="${IMG.logo}">`);
      Object.assign(bug.style, { width: bugW + 'px', left: W - fr.m - bugW + 'px', top: fr.osdTop - fr.osdF * 0.25 + 'px' });
    }
    if (fr.byH) {
      const by = place(put(`<div class="strip by" aria-hidden="true"><span>${BRAND}</span></div>`), 0, fr.byTop, W, fr.byH);
      let f = fr.byF; const need = across(BRAND.toUpperCase(), 'italic 700', f, 0.08);
      if (need > W * 0.9) f *= (W * 0.9) / need;
      by.style.fontSize = f + 'px';
    }
    if (fr.tapeH) {
      const tape = place(put('<div class="strip tape" aria-hidden="true"><span>NO PURCHASE NECESSARY!</span><span class="sep">✦</span><span>ADD TO CHROME</span></div>'), 0, fr.tapeTop, W, fr.tapeH);
      const s = fr.tapeH / 74;
      Object.assign(tape.style, { fontSize: fr.tapeH * 0.44 + 'px', boxShadow: `inset 0 ${4 * s}px 0 rgba(170,158,0,0.6), inset 0 ${-4 * s}px 0 rgba(170,158,0,0.6), 0 ${-6 * s}px 0 rgba(6,8,70,0.55)` });
      const c = tape.children, need = c[c.length - 1].getBoundingClientRect().right - c[0].getBoundingClientRect().left;
      if (need > W * 0.92) tape.style.fontSize = (fr.tapeH * 0.44 * W * 0.92) / need + 'px';
    }
    if (fr.tick) {
      const tk = put('<div class="ticker" aria-hidden="true"><span></span></div>');
      Object.assign(tk.style, { height: fr.tick + 'px', fontSize: fr.tick * 0.66 + 'px', lineHeight: fr.tick + 'px' });
      scroll(tk.firstElementChild, TICKER, fr.tick * 1.5, '');
    }
    if (fr.crawlH) {
      const cr = put('<div class="crawl" aria-hidden="true"><span></span></div>');
      Object.assign(cr.style, { top: fr.crawlTop + 'px', height: fr.crawlH + 'px', fontSize: fr.crawlH * 0.75 + 'px', lineHeight: fr.crawlH + 'px' });
      scroll(cr.firstElementChild, CRAWL, fr.crawlH * 2.6, ' skewX(-9deg)');
    }
    // the rays, from the badge's centre across the whole frame: 30° (two of their 15° steps) in 12 s
    const [cx, cy] = rayC;
    movers.push((t) => { rays.style.background = `repeating-conic-gradient(from ${(t * 2.5) % 360}deg at ${cx}px ${cy}px, rgba(120, 200, 255, 0.11) 0deg 6deg, rgba(120, 200, 255, 0) 6deg 15deg)`; });
  }

  // ---- the hero: the badge with 30% OFF, the stamp on its shoulder, the caption and the tag under it,
  //      the four cards under those if asked; as large as goes between top and bot ----
  function stack(o) {
    const { cx, top, bot } = o;
    let ss = fitLines(o.lines, o.capW), tf = o.tagW / TAGW;
    const words = capH(o.lines, ss) + o.g2 + tf * TAGH;
    const cardsH = o.cardsW ? (62 * o.cardsW) / 436 + o.g3 : 0;
    let R = Math.min(o.maxR, (bot - top - o.g1 - words - cardsH) / 1.96);
    const used = R * 1.96 + o.g1 + words + cardsH, spare = Math.max(0, bot - top - used);
    const cy = top + spare * (o.lift ?? 0.35) + R * 1.1;
    rayC = [cx, cy];
    glow(cx, cy, R * 3);
    badge(cx, cy, R);
    glint('', cx - R * 0.98, cy - R * 0.72, R * 0.15);
    glint('b', cx + R * 1.02, cy + R * 0.64, R * 0.09);
    sticker(cx, cy + R * 0.06, Math.min(R * 2.15, W * 0.92), -6);
    if (o.stamp !== false) {
      const f = R * (o.stampK || 0.12), sw = STAMPW[0] * f;
      stamp(Math.min(cx + R * 0.84, W - sw * 0.56 - (o.m || 0) * 0.5), cy - R * 0.8, f, 11);
    }
    let y = cy + R * 0.86 + o.g1 + spare * (o.gapK ?? 0.3);
    y = caption(o.lines, ss, cx, y, 0.3 * SCAP * ss);
    tag(tf, cx, y + o.g2);
    y += o.g2 + tf * TAGH;
    if (o.cardsW) cards(cx - o.cardsW / 2, y + o.g3 + spare * 0.15, o.cardsW, false);
    return { cy, R };
  }

  // ---- the frames ----
  const LAYOUTS = {
    square() {
      const u = W / 1080;
      const fr = frame({ tick: 46 * u, osd: 23 * u, m: 38 * u, tape: 84 * u, by: 18 * u, crawl: 82 * u });
      back(0.9 * u);
      stack({ cx: W / 2, top: fr.top + 4 * u, bot: fr.bot - 22 * u, lines: L1, capW: 830 * u, tagW: 470 * u, g1: 30 * u, g2: 24 * u, maxR: 0.3 * W, m: fr.m });
      return fr;
    },
    portrait() {
      const u = W / 1080;
      const fr = frame({ tick: 62 * u, osd: 30 * u, m: 44 * u, tape: 118 * u, by: 26 * u, crawl: 104 * u });
      back(u);
      // the story's own bars cover about 250 px top and bottom: the hero keeps inside them
      stack({ cx: W / 2, top: Math.max(fr.top, 200 * u), bot: fr.bot - 40 * u, lines: L2, capW: 900 * u, tagW: 620 * u, cardsW: 860 * u,
              g1: 30 * u, g2: 34 * u, g3: 56 * u, maxR: 0.44 * W, m: fr.m, stampK: 0.1 });
      return fr;
    },
    p45() {
      const u = W / 1080;
      const fr = frame({ tick: 50 * u, osd: 25 * u, m: 40 * u, tape: 96 * u, by: 20 * u, crawl: 88 * u });
      back(0.95 * u);
      stack({ cx: W / 2, top: fr.top + 10 * u, bot: fr.bot - 26 * u, lines: L2, capW: 820 * u, tagW: 560 * u, g1: 28 * u, g2: 30 * u, maxR: 0.4 * W, m: fr.m, stampK: 0.11 });
      return fr;
    },
    horizontal() { return LAYOUTS.set(Math.min(W / 1280, H / 800)); },
    // the home-shopping set: the badge dead centre, the price card at its left, As Seen On over the cards at its right
    set(s) {
      const fr = frame({ tick: 40 * s, osd: 20 * s, m: 34 * s, tape: 74 * s, by: 19 * s, crawl: 64 * s });
      back(s);
      const top = fr.top, bot = fr.bot - 18 * s, m = fr.m, cx = W / 2;
      const capW = Math.min(W * 0.5, 740 * s);
      const ss = fitLines(L1, capW), tf = (capW * 0.5) / TAGW;
      const block = SCAP * ss + 22 * s + tf * TAGH;
      const R = Math.min((bot - top - block - 16 * s) / 1.9, W * 0.25);
      const used = R * 1.9 + 16 * s + block, y0 = top + Math.max(0, (bot - top - used) * 0.45);
      const cy = y0 + R * 1.06;
      rayC = [cx, cy];
      const wing = cx - R * 1.12 - m * 1.4, mid = (top + bot) / 2 + 6 * s;
      glow(cx, cy, R * 3.1);
      // left: ITEM # over the price card, its 70% jolting
      const cs = Math.min(wing / 440, (R * 1.3) / 360), cw = 400 * cs, lx = m + (wing - cw) / 2 + 6 * s;
      const ctop = mid - (360 * cs) / 2 + 22 * cs;
      const lab = label('ITEM # 0030 ✦ LIMITED TIME', 22 * cs, lx, 0);
      lab.style.top = ctop - lab.offsetHeight - 16 * cs + 'px';
      card(lx, ctop, cs);
      // right: the As Seen On badge over the four cards
      const gw = Math.min(wing * 0.8, 260 * s, R * 0.95), rx = W - m - (wing + gw) / 2;
      const of = Math.min(gw / 7.2, 36 * s), oh = of * 3.31, gh = (136 * gw) / 212, total = oh + 26 * s + gh, oy = mid - total / 2;
      oval(of, rx + gw / 2, oy + oh / 2);
      cards(rx, oy + oh + 26 * s, gw, true);
      badge(cx, cy, R);
      glint('', cx - R * 0.98, cy - R * 0.7, R * 0.15);
      glint('b', cx + R * 1.02, cy + R * 0.62, R * 0.09);
      sticker(cx, cy + R * 0.06, R * 2.15, -6);
      stamp(cx + R * 0.86, cy - R * 0.74, R * 0.11, 11);
      const y = caption(L1, ss, cx, cy + R * 0.84 + 16 * s, 0);
      tag(tf, cx, y + 22 * s);
      return fr;
    },
    // the store's marquee: the badge at the left, the words beside it, the price card at the right
    marquee() {
      const u = H / 560;
      const fr = frame({ tick: 40 * u, crawl: 66 * u });
      back(0.8 * u);
      const top = fr.top, bot = fr.bot, mid = bot - top, m = 40 * u;
      const R = mid / 2.12, cx = m * 0.5 + R * 1.12, cy = top + mid / 2 + 2 * u;
      rayC = [cx, cy];
      glow(cx, cy, R * 3);
      badge(cx, cy, R);
      glint('b', cx + R * 1.04, cy + R * 0.7, R * 0.11);
      sticker(cx, cy + R * 0.05, R * 2.2, -6);
      // the price card at the right
      const cs = (mid * 0.64) / 360, cardW = 400 * cs, cx2 = W - m - cardW;
      const lab = label('ITEM # 0030 ✦ LIMITED TIME', 21 * cs, cx2 + 6 * u, 0);
      const ctop = top + (mid - 360 * cs - lab.offsetHeight - 12 * u) / 2 + lab.offsetHeight + 12 * u + 4 * u;
      lab.style.top = ctop - lab.offsetHeight - 12 * u + 'px';
      card(cx2, ctop, cs);
      // the words between: stamp, caption in two lines, tag
      const left = cx + R * 1.12 + 22 * u, right = cx2 - 30 * u, colW = right - left, ccx = (left + right) / 2;
      const ss = fitLines(L2, colW * 0.96), tf = Math.min(ss * 0.6, (colW * 0.74) / TAGW), sf = Math.min(ss * 0.42, (colW * 0.62) / STAMPW[0]);
      const h = STAMPW[1] * sf + 22 * u + capH(L2, ss) + 22 * u + tf * TAGH;
      let y = top + (mid - h) / 2;
      stamp(ccx + colW * 0.12, y + (STAMPW[1] * sf) / 2, sf, 5);
      y += STAMPW[1] * sf + 22 * u;
      y = caption(L2, ss, ccx, y, 0.3 * SCAP * ss);
      tag(tf, ccx, y + 22 * u);
      return fr;
    },
    // the small tile: the badge and the words, nothing else
    small() {
      const u = H / 280;
      back(0.42 * u, 1.3);
      const fr = frame({});
      const R = 110 * u, cx = 12 * u + R * 1.08, cy = H / 2 + 2 * u;
      rayC = [cx, cy];
      glow(cx, cy, R * 3);
      badge(cx, cy, R, false);
      glint('b', cx + R * 1.02, cy - R * 0.8, R * 0.13);
      sticker(cx + 4 * u, cy + R * 0.04, R * 2.2, -6);
      const left = cx + R * 1.06 + 8 * u, right = W - 12 * u, colW = right - left, ccx = (left + right) / 2;
      const ss = fitLines(L3, colW), tf = (colW * 0.98) / TAGW;
      const h = capH(L3, ss) + 16 * u + tf * TAGH;
      let y = (H - h) / 2;
      y = caption(L3, ss, ccx, y, 0.3 * SCAP * ss);
      tag(tf, ccx, y + 16 * u);
      return fr;
    },
    // screenshot 1: the badge as hero, as large as the stage; the words column beside it
    shot1() {
      const s = Math.min(W / 1280, H / 800);
      const fr = frame({ tick: 40 * s, osd: 20 * s, m: 34 * s, tape: 74 * s, by: 19 * s, crawl: 64 * s });
      back(s);
      const top = fr.top + 4 * s, bot = fr.bot - 14 * s, mid = bot - top;
      const R = mid / 2.14, cx = W * 0.05 + R * 1.12, cy = top + mid / 2 + 4 * s;
      rayC = [cx, cy];
      glow(cx, cy, R * 3);
      badge(cx, cy, R);
      glint('', cx - R * 1.0, cy - R * 0.72, R * 0.14);
      glint('b', cx + R * 1.04, cy + R * 0.66, R * 0.09);
      sticker(cx, cy + R * 0.06, R * 2.2, -6);
      const left = cx + R * 1.14 + 30 * s, right = W - 60 * s, colW = right - left, ccx = (left + right) / 2;
      const ss = fitLines(L3, colW * 0.94), tf = (colW * 0.78) / TAGW, sf = Math.min(ss * 0.52, (colW * 0.66) / STAMPW[0]);
      const h = STAMPW[1] * sf + 34 * s + capH(L3, ss) + 30 * s + tf * TAGH;
      let y = top + (mid - h) / 2;
      stamp(ccx + colW * 0.14, y + (STAMPW[1] * sf) / 2, sf, 5);
      y += STAMPW[1] * sf + 34 * s;
      y = caption(L3, ss, ccx, y, 0.3 * SCAP * ss);
      tag(tf, ccx, y + 30 * s);
      return fr;
    },
    // screenshot 2: the price card as hero, the badge smaller beside it; the stamp slapped on the card's edge
    shot2() {
      const s = Math.min(W / 1280, H / 800);
      const fr = frame({ tick: 40 * s, osd: 20 * s, m: 34 * s, tape: 74 * s, by: 19 * s, crawl: 64 * s });
      back(s);
      const top = fr.top + 10 * s, bot = fr.bot - 16 * s;
      // the card under its label, filling the left of the stage (clear of the on-screen display)
      const ctop = 168 * s, cs = (bot - ctop - 8 * s) / 360, cw = 400 * cs, lx = 84 * s;
      const lab = label('ITEM # 0030 ✦ LIMITED TIME', 25 * s, lx + 6 * s, 0);
      lab.style.top = ctop - lab.offsetHeight - 22 * s + 'px';
      // the badge, caption and tag at the right
      const rcx = lx + cw + (W - lx - cw) / 2 + 10 * s;
      stack({ cx: rcx, top: top - 6 * s, bot, lines: L2, capW: 450 * s, tagW: 330 * s, g1: 22 * s, g2: 24 * s, maxR: 210 * s, stamp: false, lift: 0.5, gapK: 0.2 });
      card(lx, ctop, cs);
      stamp(lx + cw - 4 * s, ctop + 160 * cs, 27 * s, 8);   // in the space right of NOW:, half off the card
      return fr;
    },
    // screenshot 3: BUT WAIT… THERE'S LESS! as hero, As Seen On Every Website and the four cards; the badge smaller
    shot3() {
      const s = Math.min(W / 1280, H / 800);
      const fr = frame({ tick: 40 * s, osd: 20 * s, m: 34 * s, tape: 74 * s, by: 19 * s, crawl: 64 * s });
      back(s);
      const top = fr.top + 6 * s, bot = fr.bot - 16 * s, mid = bot - top;
      // left: the badge, caption and tag
      stack({ cx: 320 * s, top: top + 2 * s, bot, lines: L2, capW: 430 * s, tagW: 320 * s, g1: 20 * s, g2: 22 * s, maxR: 210 * s, stamp: false, lift: 0.5, gapK: 0.2 });
      // right: the stamp, large; under it As Seen On beside the four cards
      const x0 = 630 * s, x1 = W - 44 * s, rcx = (x0 + x1) / 2, rw = x1 - x0;
      const sf = (rw * 0.86) / STAMPW[0], sh = STAMPW[1] * sf;
      const of = 41 * s, ow = of * 7.6, oh = of * 3.31, gw = 250 * s, gh = (136 * gw) / 212, rowH = Math.max(oh, gh);

      let y = top + gap * 0.9;
      stamp(rcx, y + sh / 2, sf, -3);
      y += sh + gap * 1.2;
      const rowW = ow + 36 * s + gw, rx = rcx - rowW / 2;
      oval(of, rx + ow / 2, y + rowH / 2, -7);
      cards(rx + ow + 36 * s, y + (rowH - gh) / 2, gw, true);
      return fr;
    },
  };

  // ---- one layout pass, for the window as it is ----
  const F = LAYOUTS[query.get('f')] ? query.get('f') : null;
  function build() {
    p.textContent = ''; movers = [];
    W = p.clientWidth; H = p.clientHeight;
    if (!W || !H) return;
    const f = F || (W / H > 1.3 ? 'horizontal' : W / H < 0.7 ? 'portrait' : W / H < 0.9 ? 'p45' : 'square');
    front(LAYOUTS[f]());
    render(clock());
  }

  // ---- the clock ----
  const t0 = performance.now(), clock = () => Math.floor(((performance.now() - t0) / 1000) * FPS + 1e-6) / FPS;
  const blotch = $('.blotch'), grain = $('.static');
  function render(t) {
    for (const move of movers) move(t);
    const f = Math.round(t * FPS); blotch.setAttribute('seed', BLOTCH[f % BLOTCH.length]); grain.setAttribute('seed', STATIC[f % STATIC.length]);
  }

  build();
  let pending = 0;
  addEventListener('resize', () => { cancelAnimationFrame(pending); pending = requestAnimationFrame(build); });
  let last = -1;
  const tickFrame = () => { const t = clock(); if (t !== last) { last = t; render(t); } requestAnimationFrame(tickFrame); };
  requestAnimationFrame(tickFrame);
  if ('ImageDecoder' in window) {
    try {
      const dec = new ImageDecoder({ data: await (await fetch(IMG.globe)).arrayBuffer(), type: 'image/webp' });
      await dec.tracks.ready;
      const n = dec.tracks.selectedTrack.frameCount, frames = [];
      for (let i = 0; i < n; i++) { const { image } = await dec.decode({ frameIndex: i }); frames.push(await createImageBitmap(image)); image.close(); }
      dec.close();
      if (n === 60) { globeFrames = frames; build(); }
    } catch {}
  }
  window.ready = !!globeFrames;   // a recorder waits for this: the globe turns only once its frames are decoded
  window.globeFailed = !globeFrames;

  // the slow-machine fallback: if the look makes drawing slow, take it off (and put it back if that did not help)
  const frameRate = () => new Promise((resolve) => {
    let frames = 0, drawing = 0, prev = 0;
    const tick = (now) => { const gap = now - prev; if (prev && gap < 1000) { frames++; drawing += gap; } prev = now; if (drawing < 2000) requestAnimationFrame(tick); else resolve((frames * 1000) / drawing); };
    requestAnimationFrame(tick);
  });
  if (!query.has('keep')) {
    await new Promise((r) => setTimeout(r, 1200));
    const withLook = await frameRate();
    if (withLook < 24) {
      p.style.filter = 'none';
      if ((await frameRate()) < withLook * 1.5) p.style.removeProperty('filter');
    }
  }
})();
</script>
</body>
</html>
